openapi: 3.2.0
info:
  title: Dashboard Chainalysis API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: Chainalysis
  description: Configure Chainalysis integration for blockchain address screening and risk assessment.
paths:
  /environments/{environmentId}/integrations/chainalysis:
    get:
      summary: Find the Chainalysis configuration for an environment
      description: Returns the sanctions screening configuration for the specified environment. Sanction checks are always enabled.
      operationId: getChainalysisByEnvironmentId
      tags:
      - Chainalysis
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Chainalysis Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainalysisConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
components:
  schemas:
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    Forbidden:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Access Forbidden
        code:
          description: Machine-readable reason for the 403, set only by endpoints that distinguish rejections. Flow endpoints use sanctions_blocked, session_token_invalid and risk_blocked.
          type: string
          example: sanctions_blocked
    Unauthorized:
      type: object
      properties:
        error:
          description: Human-readable error message describing the authentication failure
          type: string
          example: No jwt provided!
    InternalServerError:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Internal Server Error
    ChainalysisConfiguration:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        sanctionsApiEnabled:
          description: Whether Chainalysis sanctions screening is enabled for wallet addresses
          type: boolean
        kytApiEnabled:
          description: Whether Chainalysis Know Your Transaction (KYT) monitoring is enabled
          type: boolean
        projectEnvironmentId:
          $ref: '#/components/schemas/uuid'
        createdAt:
          description: ISO 8601 timestamp of when the Chainalysis configuration was created
          type: string
          format: date-time
        updatedAt:
          description: ISO 8601 timestamp of when the Chainalysis configuration was last updated
          type: string
          format: date-time
      required:
      - id
      - projectEnvironmentId
      - sanctionsApiEnabled
      - kytApiEnabled
      - createdAt
      - updatedAt
  responses:
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
  parameters:
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Dynamic
  source: https://app.dynamic.xyz/api-docs/public-api.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
