openapi: 3.2.0
info:
  title: Dashboard Waas API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: Waas
  description: Wallet-as-a-Service endpoints for creating and managing embedded wallets.
paths:
  /environments/{environmentId}/waas/create:
    post:
      operationId: createWaasWallet
      description: Creates a new WAAS wallet for a user given an email or userId. If an email is provided and it is not associated with an existing user this call will also create a new user.
      summary: Create a WAAS wallet for a user
      tags:
      - Waas
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        description: Pregenerate WAAS wallet for a user given an identifier
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserWaasWalletsRequest'
      responses:
        '200':
          description: Wallet already exists for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '201':
          description: Successfully created new wallet for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/authenticate:
    post:
      operationId: authenticateWaas
      tags:
      - Waas
      summary: Authenticate for WAAS using an API key
      description: 'For legacy server SDKs: authenticates for WaaS using an API key, as the environment''s default server identity. Server signers do not use this endpoint; they sign each request with their registered key. A `serverIdentifier` in the JSON body is refused with 401. The body is not declared in this contract, so that clients that send none keep working.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasAuthenticateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/verifyApiKey:
    post:
      deprecated: true
      operationId: waasVerifyApiKey
      tags:
      - Waas
      summary: Verify if an API key is valid for a specific environment
      description: Simple endpoint to verify if the provided API key (DYN_API_TOKEN) is valid and has access to the specified environment. Returns true if the token is verified, false otherwise.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: API key verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasVerifyApiKeyResponse'
        '400':
          description: Bad request - token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasVerifyApiKeyErrorResponse'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasVerifyApiKeyErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/{walletId}/delegatedAccess/signMessage:
    post:
      operationId: delegatedSignMessage
      tags:
      - Waas
      summary: Sign a message with a delegated waas account
      description: Signs a message using a delegated WaaS account.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      requestBody:
        description: Delegate Sign Message Request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasDelegateSignMessageRequest'
      responses:
        '200':
          description: Successfully created a room for delegated signing message ceremony
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenRoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/{walletId}/delegatedAccess:
    delete:
      operationId: deleteDelegatedAccess
      tags:
      - Waas
      summary: Revoke delegated access for a single wallet
      description: Allows developers to revoke their own delegated access for a specific wallet
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      responses:
        '204':
          description: Delegated access successfully revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/delegatedAccess/revoke:
    post:
      operationId: revokeDelegatedAccess
      x-destructive: true
      tags:
      - Waas
      summary: Revoke delegated access for one or more wallets
      description: Allows developers to revoke their own delegated access
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        description: Revoke Delegated Access Request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeDelegatedAccessRequest'
      responses:
        '200':
          description: Delegated access revocation processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeDelegatedAccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/serverSigning/keys:
    post:
      operationId: registerServerSigningKey
      tags:
      - Waas
      summary: Register a Server Signing Key for a server identity
      description: Registers a P-256 public key for the server signer named by the admin's signed `consent`, creating the signer if needed. auth-service verifies the consent, so a key the admin did not consent to cannot be registered. Dashboard admin JWT only. Registering the same key again returns it. An identifier used by another environment's signer is a 409, and revoked keys cannot be re-registered. An invalid consent (malformed, older than 5 minutes, unverified or mismatched) is a 400, with the reason in `code`.
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterServerSigningKeyRequest'
      responses:
        '201':
          description: The registered key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSigningKeySummary'
        '400':
          description: Bad Request; `code` names the reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSigningRegistrationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: This key was registered before and has been revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: auth-service could not register the key; nothing was stored, so retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSigningRegistrationError'
    get:
      operationId: listServerSigningKeys
      tags:
      - Waas
      summary: List the environment's Server Signing Keys
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: The environment's keys, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSigningKeySummaryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/serverSigning/keys/{keyId}:
    delete:
      operationId: revokeServerSigningKey
      tags:
      - Waas
      summary: Revoke one of the environment's Server Signing Keys
      description: Revocation is terminal and idempotent.
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: path
        name: keyId
        required: true
        description: Registry id of the key (not its `kid`)
        schema:
          $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedServerSigningKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/delegatedAccess/encryptionPublicKeys:
    get:
      operationId: getDelegatedAccessEncryptionPublicKeys
      tags:
      - Waas
      summary: Get delegated access encryption public keys for an environment
      description: 'Fetches the encryption public keys used for delegated access in a WAAS environment.

        By default, returns only the latest active key. Use the includeAll query parameter to get all keys.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - name: includeAll
        in: query
        description: If true, returns all encryption public keys. Otherwise, returns only the latest active key.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Encryption public keys fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedAccessEncryptionPublicKeysUnifiedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createDelegatedCredentials
      tags:
      - Waas
      summary: Create credentials for waas wallet delegation
      description: Creates new encryption public key credentials for WaaS wallet delegation.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasDelegationCredentialsRequest'
      responses:
        '201':
          description: Credentials for waas wallet delegation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasDelegationCredentialsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/delegatedAccess/encryptionPublicKeys/{keyId}:
    get:
      operationId: getDelegatedAccessEncryptionPublicKeyById
      tags:
      - Waas
      summary: Get a specific delegated access encryption public key by ID
      description: Returns a delegated access encryption public key by its ID.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - name: keyId
        in: path
        description: The ID of the encryption public key
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Encryption public key fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedAccessEncryptionPublicKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/{walletId}:
    get:
      operationId: getWaasWalletByWalletId
      tags:
      - Waas
      summary: Get a specific WAAS wallet by walletId
      description: Returns a WaaS wallet by its wallet ID.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - name: walletId
        in: path
        description: The ID of the WAAS wallet
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: WAAS wallet fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasWalletResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/{walletId}/keyShares/backup/locations:
    post:
      operationId: backupKeySharesToLocationsForPregen
      tags:
      - Waas
      summary: Create backup action for key shares using API token authentication
      description: Creates backup locations for wallet key shares. Requires API token authentication. Validates that the user belongs to the environment and that no client key shares exist for the wallet. This endpoint is intended for server-side integrations that need to backup key shares on behalf of users.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      requestBody:
        description: Backup locations request with userId
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupKeySharesToLocationsWithUserIdRequest'
      responses:
        '201':
          description: Backup action and event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupKeySharesToLocationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}/waas/transactionReviewConfig:
    get:
      operationId: getWaasTransactionReviewConfig
      tags:
      - Waas
      summary: Get the transaction review config for an environment
      description: Returns the webhook configuration used to review transactions before signing.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Transaction review config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionReviewConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: upsertWaasTransactionReviewConfig
      tags:
      - Waas
      summary: Create or update the transaction review config for an environment
      description: 'Configures a webhook that is called before every transaction signing request. The webhook must respond with { "proceed": true } to allow signing, or { "proceed": false, "reason": "..." } to block it.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasTransactionReviewConfigRequest'
      responses:
        '200':
          description: Transaction review config saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionReviewConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteWaasTransactionReviewConfig
      tags:
      - Waas
      summary: Delete the transaction review config for an environment
      description: Removes transaction review enforcement. All transactions will proceed without review.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '204':
          description: Config deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/transactionReviewConfig/test:
    post:
      operationId: testWaasTransactionReviewConfig
      tags:
      - Waas
      summary: Send a synthetic transaction review request to the configured webhook
      description: Drives a dry-run request through the same crypto and timeout machinery as the production signing path, against either the saved config or an override supplied in the body. No events are emitted and no signing is affected. Useful for verifying the customer's webhook responds correctly to each transaction shape before enabling enforcement.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasTransactionReviewTestRequest'
      responses:
        '200':
          description: Test webhook decision and diagnostic detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionReviewTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/policies/env-layer:
    get:
      operationId: getEnvWaasPolicyLayerForDashboard
      tags:
      - Waas
      summary: Read the environment-Layer's Rules
      description: The dashboard counterpart to the SDK's env-Layer read, so the rule-language editor can open on what is actually stored.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: The environment-Layer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateWaasEnvPolicyLayer
      tags:
      - Waas
      summary: Write the environment-Layer's Rules
      description: 'Writes the environment-scoped Composition Layer directly. The only way to author Rules in the policy rule language at environment scope: the Layer is otherwise mirrored from the legacy environment policy, and a Rule in the rule language has no legacy form to be mirrored from.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasEnvPolicyLayerUpdateRequest'
      responses:
        '200':
          description: Environment-Layer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/policies:
    post:
      operationId: createWaasPolicy
      tags:
      - Waas
      summary: Create a new WAAS policy for an environment or add new rules to an existing…
      description: Creates a new WaaS policy for the specified environment.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasPolicyCreateRequest'
      responses:
        '201':
          description: WAAS policy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: getWaasPolicy
      tags:
      - Waas
      summary: Get the WAAS policy for an environment
      description: Returns the WaaS policy for the specified environment.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: WAAS policy fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateWaasPolicy
      tags:
      - Waas
      summary: Update the WAAS policy for an environment by ruleId
      description: Updates the WaaS policy for the specified environment.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasPolicyUpdateRequest'
      responses:
        '200':
          description: WAAS policy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteWaasPolicy
      tags:
      - Waas
      summary: Delete a WAAS policy rule by ruleId
      description: Permanently removes the specified WaaS policy rule.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasPolicyDeleteRequest'
      responses:
        '200':
          description: WAAS policy rules deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/wallets/{walletId}/policy-layer:
    get:
      operationId: getWaasPolicyLayer
      tags:
      - Waas
      summary: Get a wallet-Layer's current Rules
      description: Returns the specified wallet's Composition Layer content without mutating it.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      responses:
        '200':
          description: Wallet-Layer fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateWaasPolicyLayer
      tags:
      - Waas
      summary: Update a wallet-Layer's Rules by ruleId
      description: Applies a single per-Rule upsert or remove operation — or, with op set to batch, an operations array of 1-100 upsert/remove entries applied atomically in one enclave cycle (all-or-nothing — a rejection applies none of them) — or, with op set to replace, a full rules list that replaces the Layer's Rules (either syntax; an empty list clears it) — to the specified wallet's Composition Layer. ruleId may be omitted on an upsert; the enclave then mints one and returns it in the response's layerContent.rules.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasPolicyLayerUpdateRequest'
      responses:
        '200':
          description: Wallet-Layer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/waas/wallets/{walletId}/signer-policy-layer:
    get:
      operationId: getWaasSignerPolicyLayer
      tags:
      - Waas
      summary: Get a signer-Layer's current Rules
      description: Returns the Composition Layer content for the specified wallet's active Signer without mutating it.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      responses:
        '200':
          description: Signer-Layer fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateWaasSignerPolicyLayer
      tags:
      - Waas
      summary: Update a signer-Layer's Rules by ruleId
      description: Applies a single per-Rule upsert or remove operation — or, with op set to batch, an operations array of 1-100 upsert/remove entries applied atomically in one enclave cycle (all-or-nothing — a rejection applies none of them) — or, with op set to replace, a full rules list that replaces the Layer's Rules (either syntax; an empty list clears it) — to the Composition Layer of the specified wallet's active Signer. ruleId may be omitted on an upsert; the enclave then mints one and returns it in the response's layerContent.rules.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasPolicyLayerUpdateRequest'
      responses:
        '200':
          description: Signer-Layer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/waas/delegatedAccess/encryptionPublicKey:
    get:
      operationId: getDelegatedAccessEncryptionPublicKey
      tags:
      - Waas
      summary: Get delegated access encryption public key for an environment
      description: 'Fetches the encryption public key used for delegated access in a WAAS environment.

        By default, returns only the latest active key.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Encryption public key fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedAccessEncryptionPublicKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    WaasTransactionReviewConfigResponse:
      type: object
      required:
      - enabled
      - environmentId
      - webhookFailurePolicy
      - webhookSecretSet
      - webhookTimeoutMs
      - webhookUrl
      properties:
        enabled:
          type: boolean
        environmentId:
          $ref: '#/components/schemas/uuid'
        webhookFailurePolicy:
          $ref: '#/components/schemas/WaasTransactionReviewFailurePolicy'
        webhookPublicKey:
          type: string
          description: Ed25519 public key (PEM format) configured for response signature verification, if any.
        webhookSecretSet:
          type: boolean
          description: True iff a webhook secret is stored. The secret itself is never returned.
        webhookTimeoutMs:
          type: integer
        webhookUrl:
          type: string
          format: uri
    NameServiceData:
      type: object
      properties:
        avatar:
          description: URL of the avatar associated with the name service record
          type: string
        name:
          description: Resolved name from the name service (e.g. ENS name)
          type: string
    VerifiedCredentialId:
      description: UUID v4 with an optional -zerodev suffix for ZeroDev EIP-7702 smart-wallet credentials
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(-zerodev)?$
      minLength: 36
      maxLength: 45
      example: 95b11417-f18f-457f-8804-68e361f9164f-zerodev
    WaasTransactionReviewFailurePolicy:
      type: string
      enum:
      - ALLOW
      - DENY
      description: 'Determines what happens when the review webhook is unreachable or times out. ALLOW proceeds with signing; DENY blocks the transaction. Defaults to DENY when omitted from a configuration request.

        '
    WaasPolicyConstraintCondition:
      type: string
      enum:
      - equal
      - greater
      - less
      - greaterEqual
      - lessEqual
      - notEqual
      description: Comparison operator for argument validation
    SignMessageEvmMessage:
      description: EVM message that can be either a plain string or an object with raw hex data
      anyOf:
      - type: string
      - type: object
        required:
        - raw
        properties:
          raw:
            type: string
            description: Raw hex data
    WaasBackupOptionsEnum:
      type: string
      enum:
      - googleDrive
      - iCloud
      - dynamic
      - external
      - delegated
      - offlineRecovery
    WaasPolicyRule:
      type: object
      required:
      - name
      - ruleType
      - chain
      properties:
        ruleId:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: Human-readable name for the rule
        ruleType:
          $ref: '#/components/schemas/WaasPolicyRuleType'
        address:
          description: Target address EVM or SVM (legacy field)
          anyOf:
          - $ref: '#/components/schemas/WalletPublicKey'
          - $ref: '#/components/schemas/SolanaPublicKey'
          deprecated: true
        addresses:
          description: Target address(es) EVM or SVM
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/WalletPublicKey'
            - $ref: '#/components/schemas/SolanaPublicKey'
        chain:
          $ref: '#/components/schemas/WaasChainEnum'
        chainId:
          type: number
          description: Chain ID for the policy rule (legacy field)
        chainIds:
          description: Chain IDs for the policy rule
          type: array
          items:
            type: number
        contractAbi:
          type: array
          description: Contract ABI interface
          items:
            type: object
        functionName:
          type: string
          description: Specific function name to permit/deny
        argumentConstraints:
          type: array
          items:
            $ref: '#/components/schemas/WaasPolicyArgumentConstraint'
          description: Validation rules for function arguments
        valueLimit:
          type: object
          description: Value limits for the policy rule
          properties:
            asset:
              description: Target asset address. If undefined, refers to native token (e.g., ETH)
              anyOf:
              - $ref: '#/components/schemas/WalletPublicKey'
              - $ref: '#/components/schemas/SolanaPublicKey'
            maxPerCall:
              type: string
              description: Maximum value per function call (as string to handle bigint)
              pattern: ^[0-9]+$
            totalLimit:
              type: string
              description: Cumulative value limit (as string to handle bigint)
              pattern: ^[0-9]+$
        operationRestrictions:
          type: object
          description: Operation-level restrictions for the wallet
          properties:
            blockExport:
              type: boolean
              description: Block private key export
            blockRevocation:
              type: boolean
              description: Block end-user revocation of delegated access
            blockClientSigning:
              type: boolean
              description: Block all end-user signing (not delegated)
        disableBlockaidSecurityChecks:
          type: boolean
          description: When true, disables Blockaid security enforcement for this rule. Blockaid simulation will still run for policy evaluation, but security verdicts (e.g., malicious transactions) will not block execution. Transaction approval will be determined solely by customer-defined policy rules. Use with caution as this bypasses automated security protections.
        modifiableBySigner:
          type: boolean
          description: When true, a Signer is permitted to modify this Rule. Cannot be combined with operationRestrictions or disableBlockaidSecurityChecks on the same Rule.
        approvalRequirements:
          type: array
          description: Multi-party approval requirements for this Rule. Enforced only for accounts that support them; ignored for other accounts. when.initiatorRole and when.actionTypes are not yet resolved — until they are, a requirement that sets either field applies to all approvers, not just the named role.
          items:
            type: object
            required:
            - v
            - id
            - requiredApprovals
            properties:
              v:
                type: number
                description: Schema version for this requirement. An unknown value rejects the Composition.
              id:
                type: string
                description: Stable handle for this requirement, carried as requirementId in the deny reason.
              when:
                type: object
                description: All present conditions AND together. Omit for an unconditional requirement.
                properties:
                  minValue:
                    type: object
                    description: The amount at which this requirement starts to apply.
                    properties:
                      asset:
                        description: Target asset address. If undefined, refers to native token (e.g., ETH)
                        anyOf:
                        - $ref: '#/components/schemas/WalletPublicKey'
                        - $ref: '#/components/schemas/SolanaPublicKey'
                      amount:
                        type: string
                        description: Threshold amount (as string to handle bigint)
                        pattern: ^[0-9]+$
                  initiatorRole:
                    type: object
                    description: Matches on the user who starts the action. Not yet resolved — until it is, a requirement that sets this field applies to all initiators.
                    properties:
                      roles:
                        type: array
                        items:
                          type: string
                      userIds:
                        type: array
                        items:
                          type: string
                  actionTypes:
                    type: array
                    description: Matches on the operation type. Not yet resolved — until it is, a requirement that sets this field applies to all operation types.
                    items:
                      type: string
              eligibleApproverRoles:
                type: array
                items:
                  type: string
                description: Names of the roles whose holders may satisfy this requirement. A holder of any listed role may approve. An empty array means no restriction.
              mandatoryApproverRoles:
                type: array
                items:
                  type: string
                description: Names of the roles that must each be represented among the approvers, regardless of eligibleApproverRoles. An empty array means none.
              requiredApprovals:
                type: number
                description: Total approvals required. Never counts the Initiator.
              completeWithinSeconds:
                type: number
                description: How long a collected-approvals proposal remains valid.
    WaasEnvPolicyLayerUpdateRequest:
      type: object
      required:
      - rules
      properties:
        rules:
          type: array
          maxItems: 200
          description: The environment-Layer's full Rule list, in either syntax; a PUT always replaces it whole rather than patching one Rule at a time. Each Rule must structurally be one syntax or the other, so a malformed Rule is refused here rather than deep in the enclave.
          items:
            $ref: '#/components/schemas/WaasPolicyLayerRule'
    SdkUser:
      allOf:
      - $ref: '#/components/schemas/BaseUser'
      - type: object
        required:
        - verifiedCredentials
    WaasPolicyLayerRuleOperation:
      type: object
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - upsert
          - remove
          description: The per-Rule operation to apply within a batch
        rule:
          $ref: '#/components/schemas/WaasPolicyRule'
        declarativeRule:
          $ref: '#/components/schemas/WaasPolicyDeclarativeRuleInput'
        ruleId:
          $ref: '#/components/schemas/uuid'
    NonEmptyStringWith255MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      maxLength: 255
      example: An example name
    RegisterServerSigningKeyRequest:
      type: object
      description: '`publicSigningKey` and `serverIdentifier` must equal the ones in the signed `consent`.'
      additionalProperties: false
      required:
      - consent
      - consentSignature
      - publicSigningKey
      properties:
        consent:
          $ref: '#/components/schemas/ServerSigningRegistrationConsent'
        consentSignature:
          type: string
          minLength: 1
          description: The admin's signature over `consent`
        serverIdentifier:
          $ref: '#/components/schemas/uuid'
        publicSigningKey:
          $ref: '#/components/schemas/ServerSigningKeyPublicKey'
        label:
          type:
          - string
          - 'null'
          maxLength: 255
    WaasWalletResponse:
      type: object
      required:
      - wallet
      properties:
        wallet:
          $ref: '#/components/schemas/WaasWallet'
    SignMessageEip7702Auth:
      type: object
      description: EIP-7702 auth
      properties:
        address:
          type: string
          description: Address that signed the authorization
        chainId:
          type: number
          description: Chain ID
        nonce:
          type: number
          description: Nonce
      required:
      - address
      - chainId
      - nonce
    UnprocessableEntity:
      type: object
      properties:
        error:
          description: Human-readable error message describing the validation failure
          type: string
          example: Resources already exists for this Object
        code:
          $ref: '#/components/schemas/UnprocessableEntityErrorCode'
        payload:
          $ref: '#/components/schemas/UnprocessableEntityErrorPayload'
        retryAfterSeconds:
          description: Seconds the client should wait before retrying, present on rate-limit errors
          type: integer
          example: 600
      required:
      - error
    WaasTransactionReviewTestScenario:
      type: string
      description: Synthetic transaction shape sent to the configured webhook for testing.
      enum:
      - signMessage
      - evmTransaction
      - evmTokenTransfer
      - evmUserOperation
      - evmTypedData
      - svmTransaction
      - svmMessage
      - btcTransaction
      - suiTransaction
      - suiMessage
      - stellarMessage
    HeldBusinessAccountMemberRole:
      type: string
      description: 'The role a member actually holds: a built-in (`owner`, `admin`, `viewer`) or a customer-defined role the account has defined. Wider than AssignableBusinessAccountRoleName because a held role can be `owner`, which cannot be assigned directly.

        '
      pattern: ^[a-z0-9](?:[a-z0-9_-]{0,30}[a-z0-9])?$
      example: cfo
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    ChainalysisCheckResultEnum:
      type: string
      enum:
      - OK
      - BLOCKED
      - FAILED
    SignMessageRawSign:
      type: object
      description: Chain-agnostic raw digest signing payload; the digest must equal hashFunction(prefix + payload)
      properties:
        payload:
          type: string
          maxLength: 204800
          description: Pre-image the digest is derived from, as a hex string
        hashFunction:
          type: string
          description: 'Hash applied to (prefix + payload) to reproduce the digest being signed. Allowed algorithms: sha512Half (e.g. XRPL single-signer), keccak256 (screened against EVM operations), sha256 (TRON, SVM, TON; guarded against 32-byte pre-hashed payloads that could reproduce a Bitcoin double-SHA256 sighash), and blake2b (Sui, 32-byte digest)'
          enum:
          - sha512Half
          - keccak256
          - sha256
          - blake2b
        prefix:
          type: string
          maxLength: 1024
          description: Optional hex prefix prepended to the payload before hashing, e.g. the XRPL single-signer 'STX\0' prefix (53545800)
      required:
      - payload
      - hashFunction
    TurnkeyWalletProperties:
      deprecated: true
      type: object
      properties:
        turnkeySubOrganizationId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          deprecated: true
        turnkeyPrivateKeyId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          deprecated: true
        turnkeyHDWalletId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          deprecated: true
        isAuthenticatorAttached:
          type: boolean
          description: Whether or not the wallet has an authenticator (passkey, api key, etc) attached to it.
        turnkeyUserId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          deprecated: true
        isSessionKeyCompatible:
          description: Whether this wallet supports session key operations
          type: boolean
        version:
          $ref: '#/components/schemas/EmbeddedWalletVersionEnum'
        ecdsaProviderType:
          $ref: '#/components/schemas/ecdsaValidatorOptions'
        entryPointVersion:
          $ref: '#/components/schemas/ProviderEntryPointVersionEnum'
        kernelVersion:
          $ref: '#/components/schemas/ProviderKernelVersionEnum'
    WalletPublicKey:
      type: string
      pattern: ^[A-Za-z0-9_-]{18,100}$
      description: Valid blockchain wallet address, must be an alphanumeric string (underscores allowed for chains like Midnight, hyphens allowed for chains using base64url-encoded addresses like TON)
      example: '0xbF394748301603f18d953C90F0b087CBEC0E1834'
      maxLength: 255
    RevokeDelegatedAccessRequest:
      type: object
      required:
      - walletIds
      properties:
        walletIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          description: Array of wallet IDs to revoke delegated access for
          minItems: 1
          maxItems: 100
    WaasDelegatedAccessEncryptionPublicKeyType:
      type: string
      enum:
      - dynamic
      - external
    MergeConflicts:
      type: object
      description: Contains information needed for the SDK to surface merge conflicts when attempting to merge information from one user to another
      required:
      - fromUser
      - conflicts
      properties:
        fromUser:
          $ref: '#/components/schemas/SdkUser'
        conflicts:
          description: List of field-level merge conflicts between users
          type: array
          items:
            $ref: '#/components/schemas/MergeUserConflict'
    ThresholdSignatureScheme:
      type: string
      enum:
      - TWO_OF_TWO
      - TWO_OF_THREE
      - THREE_OF_FIVE
    SignMessageEvmTypedData:
      type: object
      description: EIP-712 typed data payload
      properties:
        domain:
          $ref: '#/components/schemas/Eip712Domain'
        message:
          type: object
          description: Typed data message object
        primaryType:
          description: Primary type name for EIP-712 typed data signing
          type: string
        types:
          $ref: '#/components/schemas/Eip712Types'
      required:
      - domain
      - message
      - primaryType
      - types
    Eip712Domain:
      type: object
      properties:
        name:
          description: Human-readable name of the signing domain
          type: string
        version:
          description: Version of the signing domain
          type: string
        chainId:
          description: Chain ID the typed data is intended for
          type: number
        verifyingContract:
          $ref: '#/components/schemas/WalletPublicKey'
    RevokeDelegatedAccessResponse:
      type: object
      required:
      - results
      - total
      - succeeded
      - failed
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RevokeDelegatedAccessWalletResult'
          description: Results for each wallet
        total:
          type: integer
          description: Total number of wallets processed
        succeeded:
          type: integer
          description: Number of wallets successfully revoked
        failed:
          type: integer
          description: Number of wallets that failed to revoke
    DelegatedAccessEncryptionPublicKeyResponse:
      type: object
      required:
      - key
      - message
      properties:
        key:
          $ref: '#/components/schemas/DelegatedAccessEncryptionPublicKey'
        message:
          type: string
          description: Message describing the operation result
    WaasPolicyLayerUpdateRequest:
      type: object
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - upsert
          - remove
          - batch
          - replace
          description: The per-Rule operation to apply to the wallet-Layer, batch to apply multiple operations atomically in one enclave cycle, or replace to set the Layer's full Rule list
        rule:
          $ref: '#/components/schemas/WaasPolicyRule'
        declarativeRule:
          $ref: '#/components/schemas/WaasPolicyDeclarativeRuleInput'
        ruleId:
          $ref: '#/components/schemas/uuid'
        operations:
          type: array
          minItems: 1
          maxItems: 100
          description: Only used when op is batch — applied atomically in one enclave cycle
          items:
            $ref: '#/components/schemas/WaasPolicyLayerRuleOperation'
        rules:
          type: array
          maxItems: 200
          description: Only used when op is replace — the Layer's full Rule list, in either syntax. A declarative Rule sent without a ruleId is given one. Only admins and business-account admins may replace.
          items:
            $ref: '#/components/schemas/WaasPolicyLayerRuleInput'
    HardwareWalletProperties:
      type: object
      properties:
        hardwareWallet:
          $ref: '#/components/schemas/HardwareWalletEnum'
    WaasPolicyDeclarativeApprovalRequirement:
      type: object
      description: 'One approval requirement on a Rule in the policy rule language. It has no condition of its own: the Rule''s own condition decides when it applies.'
      required:
      - v
      - id
      - requiredApprovals
      properties:
        v:
          type: number
          description: Schema version for this requirement. An unknown value rejects the Composition.
        id:
          type: string
          description: Stable handle for this requirement, carried as requirementId in the deny reason.
        eligibleApproverRoles:
          type: array
          items:
            type: string
          description: Names of the roles whose holders may satisfy this requirement. A holder of any listed role may approve. An empty array means no restriction.
        mandatoryApproverRoles:
          type: array
          items:
            type: string
          description: Names of the roles that must each be represented among the approvers, regardless of eligibleApproverRoles. An empty array means none.
        eligibleApproverRole:
          type: string
          deprecated: true
          description: Deprecated. Use eligibleApproverRoles. Do not send both.
        mandatoryApproverRole:
          type: string
          deprecated: true
          description: Deprecated. Use mandatoryApproverRoles. Do not send both.
        requiredApprovals:
          type: number
          description: Total approvals required. Never counts the Initiator.
        completeWithinSeconds:
          type: number
          description: How long a collected-approvals proposal remains valid.
    Unauthorized:
      type: object
      properties:
        error:
          description: Human-readable error message describing the authentication failure
          type: string
          example: No jwt provided!
    UserIdentifierTypeEnum:
      type: string
      enum:
      - email
      - id
      - externalUserId
      - phoneNumber
      - socialUsername
      - socialAccountId
    NonEmptyStringWith50MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
      maxLength: 50
    WaasPolicyRuleType:
      type: string
      enum:
      - allow
      - deny
      description: Whether the rule permits or denies the specified action
    WalletAddressType:
      type: string
      enum:
      - ordinals
      - payment
      - cosmos
      - evm
      - stellar
      - ton
      - midnight_unshielded
      - midnight_dust
      - midnight_shielded
    WaasPolicyDeleteRequest:
      type: object
      required:
      - ruleIdsToDelete
      properties:
        ruleIdsToDelete:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          description: Array of rule IDs to delete from the policy
    ProviderKernelVersionEnum:
      type: string
      enum:
      - v2_4
      - v3_0
      - v3_1
      - v3_2
      - v3_3
    WaasTransactionReviewTestRequest:
      type: object
      required:
      - scenario
      properties:
        scenario:
          $ref: '#/components/schemas/WaasTransactionReviewTestScenario'
        config:
          type: object
          description: 'Optional config overrides. When provided, fields here take precedence over the saved configuration. Use this to test a config that has not been saved yet (e.g. driving a test from an unsaved form).

            '
          properties:
            enabled:
              type: boolean
            webhookFailurePolicy:
              $ref: '#/components/schemas/WaasTransactionReviewFailurePolicy'
            webhookPublicKey:
              type:
              - string
              - 'null'
            webhookSecret:
              type:
              - string
              - 'null'
            webhookTimeoutMs:
              type: integer
              minimum: 500
              maximum: 30000
            webhookUrl:
              type: string
              format: uri
    ChainalysisCheck:
      type: object
      properties:
        id:
