            headers:
              type: object
              description: 'Headers sent to the webhook. When a secret is configured the x-dynamic-signature header is present but its HMAC value is redacted (returned as "[redacted]") so the computed signature is never echoed back to the caller.

                '
              additionalProperties:
                type: string
            url:
              type: string
              format: uri
        response:
          type: object
          required:
          - body
          - headers
          - parsed
          - status
          properties:
            body:
              type:
              - string
              - 'null'
              description: Raw response body as received from the webhook, or null on transport error.
            headers:
              type: object
              additionalProperties:
                type: string
            parsed:
              type:
              - object
              - 'null'
              description: The JSON-parsed response when the body parsed cleanly and the status was 2xx, otherwise null.
              properties:
                proceed:
                  type: boolean
                reason:
                  type: string
            status:
              type:
              - integer
              - 'null'
        responseSignature:
          type: object
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - not_configured
              - missing
              - invalid
              - valid
        scenario:
          $ref: '#/components/schemas/WaasTransactionReviewTestScenario'
        transportError:
          type:
          - string
          - 'null'
          description: Network or timeout error message, if any.
    WaasPolicyUpdateRequest:
      type: object
      required:
      - rulesToUpdate
      properties:
        rulesToUpdate:
          type: array
          items:
            $ref: '#/components/schemas/WaasPolicyRule'
          description: Array of rules to update in the policy
    CreateUserWaasWalletsRequest:
      required:
      - identifier
      - type
      - chains
      type: object
      properties:
        identifier:
          type: string
          description: Identifier for the user. Must be either an email, phone number, user id, external user id, or username from a supported social provider
        type:
          $ref: '#/components/schemas/UserIdentifierTypeEnum'
        chains:
          type: array
          description: The chains to create the wallet for
          items:
            $ref: '#/components/schemas/WaasChainEnum'
        smsCountryCode:
          $ref: '#/components/schemas/SmsCountryCode'
        socialProvider:
          $ref: '#/components/schemas/ProviderEnum'
    SignMessageSvmTransaction:
      type: object
      description: Solana serialized transactions
      properties:
        chainId:
          type: string
          description: Chain identifier
        method:
          type: string
          description: Method identifier
        serializedTransactions:
          type: array
          items:
            type: string
          description: Array of serialized transaction strings
      required:
      - chainId
      - method
      - serializedTransactions
    CustomFieldValidationRules:
      type: object
      properties:
        unique:
          type: boolean
          description: If this field must be unique for every user in the environment
        regex:
          type: string
          maxLength: 255
          description: The regex pattern that the text field must match
          example: ^0x
        validOptions:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldValidValue'
          description: The dropdown options for the select field
          example:
          - label: small
          - label: medium
          - label: large
        checkboxText:
          type: string
          maxLength: 255
          description: The text that will be displayed for the checkbox field
          example: Agree to the terms and conditions
      description: Optional validation rules for the custom field
    WaasShareSet:
      type: object
      required:
      - shareSetId
      - shareSetType
      - thresholdSignatureScheme
      - createdAt
      properties:
        shareSetId:
          type: string
          format: uuid
          description: Identifier of the share set (WaasWallets row id).
        shareSetType:
          $ref: '#/components/schemas/WaasWalletShareSetType'
        thresholdSignatureScheme:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this share set was created.
    OptionalNullableNonEmptyStringWith255MaxLength:
      type:
      - string
      - 'null'
      pattern: ^$|^(?=\S)[\p{L}\p{N} _.,:!?&%@\/+-]+(?<=\S)$
      example: An example name
      maxLength: 255
    JwtVerifiedCredentialFormatEnum:
      type: string
      enum:
      - blockchain
      - email
      - oauth
      - passkey
      - phoneNumber
      - externalUser
      - totp
    NonEmptyIsoCountryCode:
      type: string
      pattern: ^[a-zA-Z]{2,4}\d?$
      maxLength: 4
      example: US
    WaasWalletProperties:
      type: object
      properties:
        keyShares:
          description: List of key share information for the primary share set (the one this auth principal signs with).
          type: array
          items:
            $ref: '#/components/schemas/WalletKeyShareInfo'
        thresholdSignatureScheme:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        derivationPath:
          type: string
          description: The derivation path for the wallet
        settings:
          $ref: '#/components/schemas/WaasWalletSettings'
        shareSetId:
          type: string
          format: uuid
          description: 'Identifier of the primary share set (the one whose `keyShares`, `thresholdSignatureScheme`, `derivationPath`, and `settings` are inlined at the top level). Browser context: rootUser. Delegated-server context: delegated.'
        shareSetType:
          $ref: '#/components/schemas/WaasWalletShareSetType'
        businessAccountId:
          type: string
          format: uuid
          description: Identifier of the business account that owns this wallet, when it is a business-account wallet; absent for personal wallets.
        otherShareSets:
          type: array
          description: All other active share sets that exist on this wallet (i.e., owned by other auth principals). Returned for awareness so consumers can see, e.g., that a delegated share set is set up alongside their rootUser. Server-typed share sets are never exposed.
          items:
            $ref: '#/components/schemas/WaasShareSet'
        version:
          $ref: '#/components/schemas/EmbeddedWalletVersionEnum'
    WalletKeyShareInfo:
      type: object
      required:
      - id
      - backupLocation
      - passwordEncrypted
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        backupLocation:
          description: Where this key share is stored (e.g. "user", "dynamic", "googleDrive", "iCloud")
          type: string
        passwordEncrypted:
          description: Whether this key share is additionally encrypted with a user-provided password
          type: boolean
        walletShareDeveloperKeyEncrypted:
          description: Whether this key share is encrypted with the developer's encryption public key
          type: boolean
        externalKeyShareId:
          $ref: '#/components/schemas/uuid'
        keygenId:
          description: Identifier of the key generation ceremony that produced this share
          type: string
    NonEmptyString:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
    EmbeddedWalletVersionEnum:
      type: string
      enum:
      - V1
      - V2
      - V3
    MergeUserConflict:
      type: object
      description: Contains a merge conflict between two users with different values for the same user field data
      required:
      - field
      - fromUser
      - currentUser
      properties:
        field:
          $ref: '#/components/schemas/ProjectSettingsKyc'
        fromUser:
          $ref: '#/components/schemas/MergeUser'
        currentUser:
          $ref: '#/components/schemas/MergeUser'
    WaasDelegateSignMessageRequest:
      type: object
      required:
      - message
      properties:
        message:
          $ref: '#/components/schemas/NonEmptyStringWith204800MaxLength'
        isFormatted:
          description: When true, `message` is treated as a pre-computed 32-byte hash (64 hex characters, optionally with a leading `0x`) and signed by the MPC server as-is ("raw signing"). When false or omitted, the SDK hashes the message bytes using the chain's standard algorithm (e.g. keccak256 for EVM).
          type: boolean
        roomId:
          description: Unique session identifier that groups related key-generation and signing operations
          type: string
        context:
          allOf:
          - $ref: '#/components/schemas/SignMessageContext'
          description: Chain-specific transaction/message payload evaluated by the wallet policy engine. Required when the wallet's policy has rules.
        shareSetId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: 'Optional identifier of the share set this operation targets. When

            omitted, the active rootUser share set for `walletId` is resolved

            server-side (backwards-compat fallback for older SDKs).

            '
    WalletProviderEnum:
      type: string
      enum:
      - browserExtension
      - custodialService
      - walletConnect
      - qrCode
      - deepLink
      - embeddedWallet
      - smartContractWallet
    Session:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        createdAt:
          description: ISO 8601 timestamp of when the session was created
          type: string
          format: date-time
        ipAddress:
          description: IP address of the client that initiated the session
          type:
          - string
          - 'null'
        userAgent:
          description: User-Agent string of the client that initiated the session
          type:
          - string
          - 'null'
        revokedAt:
          description: ISO 8601 timestamp of when the session was revoked, or null if still active
          type:
          - string
          - 'null'
          format: date-time
    MfaBackupCodeAcknowledgement:
      type:
      - string
      - 'null'
      enum:
      - pending
      - complete
    Forbidden:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Access Forbidden
        code:
          description: Machine-readable reason for the 403, set only by endpoints that distinguish rejections. Flow endpoints use sanctions_blocked, session_token_invalid and risk_blocked.
          type: string
          example: sanctions_blocked
    WaasWalletSettings:
      type: object
      properties:
        hasDeniedDelegatedAccess:
          description: Whether the user has denied delegated access for this wallet
          type: boolean
        shouldRefreshOnNextSignOn:
          description: Whether to refresh wallet key shares on the user's next sign-on
          type: boolean
        reshareOnNextSignOn:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        revokeOnNextSignOn:
          description: Whether to revoke delegated access on the user's next sign-on
          type: boolean
        variant:
          $ref: '#/components/schemas/Ed25519Variant'
    WaasPolicyLayerRule:
      anyOf:
      - $ref: '#/components/schemas/WaasPolicyRule'
      - $ref: '#/components/schemas/WaasPolicyDeclarativeRule'
    WalletProperties:
      anyOf:
      - $ref: '#/components/schemas/TurnkeyWalletProperties'
      - $ref: '#/components/schemas/HardwareWalletProperties'
      - $ref: '#/components/schemas/CoinbaseMpcWalletProperties'
      - $ref: '#/components/schemas/SmartWalletProperties'
      - $ref: '#/components/schemas/WaasWalletProperties'
    WaasPolicyCreateRequest:
      type: object
      required:
      - rulesToAdd
      properties:
        rulesToAdd:
          type: array
          items:
            $ref: '#/components/schemas/WaasPolicyRule'
          description: Array of rules to add to the policy, will create policy if it doesn't exist
    NonEmptyStringWith255MaxLengthAndSpecialChars:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'()\[\]*]+(?<=\S)$
      maxLength: 255
      example: An example name
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conflict'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
  parameters:
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
    walletId:
      in: path
      name: walletId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of the wallet
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
