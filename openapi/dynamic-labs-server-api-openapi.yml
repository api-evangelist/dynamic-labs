          description: Additional structured details about the failure
          type: object
    WaasPolicyAction:
      type: string
      description: What a rule in the policy rule language decides when it matches. REQUIRE_APPROVAL neither allows nor denies; it applies the Rule's approvalRequirements to a matching transaction, and is valid in the transaction phase only.
      enum:
      - ALLOW
      - DENY
      - REQUIRE_APPROVAL
    FlowQuote:
      description: A versioned quote snapshot stored on a flow.
      type: object
      required:
      - version
      - fromAmount
      - toAmount
      - expiresAt
      - createdAt
      properties:
        version:
          description: Monotonically increasing version number for this quote
          type: integer
        fromAmount:
          description: Amount being sent in source-token base units
          type: string
        toAmount:
          description: Amount to be received in destination-token base units
          type: string
        fees:
          $ref: '#/components/schemas/FlowFeeBreakdown'
        estimatedTimeSec:
          description: Estimated time in seconds for the swap to complete
          type: integer
        signingPayload:
          $ref: '#/components/schemas/SwapSigningPayload'
        createdAt:
          description: ISO 8601 timestamp of when the quote was created
          type: string
          format: date-time
        expiresAt:
          description: ISO 8601 timestamp of when the quote expires
          type: string
          format: date-time
        fromChainName:
          $ref: '#/components/schemas/ChainEnum'
        fromChainId:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        fromToken:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        toChainName:
          $ref: '#/components/schemas/ChainEnum'
        toChainId:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        toToken:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        fromTokenInfo:
          $ref: '#/components/schemas/FlowTokenInfo'
        toTokenInfo:
          $ref: '#/components/schemas/FlowTokenInfo'
    Ed25519Variant:
      type: string
      description: Protocol variant for the wallet. `ed25519Standard` = non-exportable Ed25519, used for raw-scalar import where the 32-byte input is the signing scalar itself (not an RFC-8032 seed). Omitted/`ed25519Exportable` = the default seed-based Ed25519. Only meaningful for ed25519 chains (e.g. Solana).
      enum:
      - ed25519Exportable
      - ed25519Standard
    FlowPaymentLinkCreateRequestBaseFields:
      type: object
