          type: object
        feeConfig:
          $ref: '#/components/schemas/FlowFeeConfig'
        expiresIn:
          type: integer
          description: Seconds until the flow expires (default 3600, clamped server-side)
        pegStablecoins:
          description: When true, known stablecoins (USDC, USDT, DAI, etc.) in the settlement config are pegged 1:1 to the flow currency at quote time, skipping market-price lookup. Defaults to false.
          type: boolean
        disableSwaps:
          description: When true, this flow will not be quoted through swap providers; the payer must supply a token/chain already accepted by the settlement config. Defaults to false.
          type: boolean
        uiConfig:
          $ref: '#/components/schemas/FlowUIConfig'
    FeeRecipientConfig:
      description: A single fee recipient with a percentage and wallet address.
      type: object
      required:
      - percentage
      - walletAddress
      properties:
        percentage:
          type: number
          description: Fraction of the source amount to collect as a fee (0–1)
          minimum: 0
          maximum: 1
