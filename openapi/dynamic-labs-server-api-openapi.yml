      - baseUrl
      properties:
        baseUrl:
          type: string
          description: Merchant-hosted payer app URL
    FlowFeeBalancesResponse:
      description: The recipient's claimable fee balances aggregated across every provider. An empty balances list means there is nothing to claim; hasClaimableFees is a convenience flag that is true when balances is non-empty.
      type: object
      required:
      - balances
      - hasClaimableFees
      properties:
        balances:
          description: One entry per claimable token and chain balance; empty when there is nothing to claim
          type: array
          items:
            $ref: '#/components/schemas/FlowFeeBalance'
        hasClaimableFees:
          description: True when the recipient has at least one claimable balance
          type: boolean
    ChainEnum:
      type: string
