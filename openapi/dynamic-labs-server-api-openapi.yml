openapi: 3.2.0
info:
  title: Dashboard Server API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: Server
  description: Server-side SDK endpoints authenticated by environment API tokens.
paths:
  /server/{environmentId}/flow/{mode}:
    get:
      operationId: getFlowServer
      tags:
      - Server
      summary: Get a flow by ID
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: path
        name: mode
        required: true
        description: UUID of the flow to retrieve
        schema:
          $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: Returns the flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createFlowServer
      tags:
      - Server
      summary: Create a flow
      description: Create a flow (payment, deposit, or withdraw) for the environment.
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/flowMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowCreateRequest'
      responses:
        '201':
          description: Flow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/payment-links:
    post:
      operationId: createPaymentLinkServer
      tags:
      - Server
      summary: Create a payment link
      description: Create a payment-mode flow and a shareable payer URL.
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowPaymentLinkCreateRequest'
      responses:
        '201':
          description: Payment link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowPaymentLinkCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/flow/fees/balances:
    get:
      operationId: getFlowFeeClaimBalancesServer
      tags:
      - Server
      summary: Get claimable fee balances
      description: Returns the recipient claimable fee balances across all providers.
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: query
        name: recipientAddress
        required: true
        description: Recipient EVM address to query balances for
        schema:
          $ref: '#/components/schemas/WalletPublicKey'
      - in: query
        name: chainId
        required: false
        description: Optional filter — only claim balances settled on this chain
        schema:
          type: string
      - in: query
        name: tokenAddress
        required: false
        description: Optional filter — only claim balances for this token contract address
        schema:
          type: string
      responses:
        '200':
          description: Fee balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowFeeBalancesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/flow/fees/claim:
    post:
      operationId: initiateFlowFeeClaimServer
      tags:
      - Server
      summary: Initiate a fee claim
      description: Initiates a provider-agnostic fee claim for a recipient.
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowFeeClaimRequest'
      responses:
        '200':
          description: Claim initiation instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowFeeClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/flow/fees/claim/submit:
    post:
      operationId: submitFlowFeeClaimServer
      tags:
      - Server
      summary: Submit a fee claim
      description: Submits signatures to complete a previously initiated fee claim.
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowFeeClaimSubmitRequest'
      responses:
        '200':
          description: Claim submission result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowFeeClaimSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/waas/softDelete:
    post:
      operationId: softDeleteWaasWalletsServer
      tags:
      - Server
      summary: Soft-delete WaaS wallets (non-production only)
      description: Soft-deletes the specified WaaS wallets by ID. Only available in non-production environments.
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftDeleteWaasWalletsRequest'
      responses:
        '200':
          description: Soft-delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftDeleteWaasWalletsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/serverIdentity:
    get:
      operationId: getServerIdentityServer
      tags:
      - Server
      summary: Get the environment's server identity
      description: Resolves the userId of a server identity. With `serverIdentifier`, that identity once confirmed to exist in the environment; otherwise the environment's default. Feed it into addMember's targetIdentity.userId to add the server as a business-account member.
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - name: serverIdentifier
        in: query
        required: false
        description: Id of a server identity of the environment, as returned when registering its Server Signing Key.
        schema:
          $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The server's identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerIdentityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/businessAccounts:
    post:
      operationId: createBusinessAccountServer
      tags:
      - Server
      summary: Server — create a business account
      description: 'Create a business account from the server SDK. The authenticated

        service user becomes the first `owner` member. Gated by the

        `enable-business-accounts` feature flag.'
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessAccountSdkRequest'
      responses:
        '201':
          description: Business account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listBusinessAccountsServer
      tags:
      - Server
      summary: Server — list business accounts the caller is a member of
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: query
        name: externalRef
        required: false
        description: Filter to business accounts whose externalRef matches one of the given values. Repeat the param for multiple values (max 100). Only accounts the caller is a member of are ever returned.
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 255
        style: form
        explode: true
      responses:
        '200':
          description: Business accounts the caller is a member of
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/businessAccounts/{businessAccountId}:
    get:
      operationId: getBusinessAccountByIdServer
      tags:
      - Server
      summary: Server — get a business account with embedded members and signers
      description: 'Returns 404 if the caller is not a member of the business account

        (404 not 403 so we don''t leak business-account existence).'
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      responses:
        '200':
          description: Business account with embedded members and signers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/businessAccounts/{businessAccountId}/members:
    post:
      operationId: addBusinessAccountMemberServer
      tags:
      - Server
      summary: Server — add a member to a business account
      description: 'Owner or admin only. Target user is resolved by `userId` OR

        `identifier + type` (email/externalUserId create-or-resolve; id direct

        lookup). Idempotent: an already-active member returns the existing row

        with 200.


        When the account governs `addMember` the response is 202, not 201 —

        first with the intent to sign, then with the proposal collecting

        approvals. Neither is a failure.'
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBusinessAccountMemberSdkRequest'
      responses:
        '200':
          description: Target user was already a member; existing row returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMember'
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMember'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/businessAccounts/{businessAccountId}/policy-layer:
    get:
      operationId: getBusinessAccountPolicyLayerServer
      tags:
      - Server
      summary: Server — get the business account's account-Layer Rules
      description: 'Returns the Composition account-Layer content for the business account,

        the Rules that apply to every wallet in it. Business-account owner or

        admin only.'
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      responses:
        '200':
          description: Account-Layer fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateBusinessAccountPolicyLayerServer
      tags:
      - Server
      summary: Server — update the business account's account-Layer Rules
      description: 'Applies a per-Rule upsert or remove, a batch, or a replace of the whole

        Rule list to the account-Layer, which applies to every wallet in the

        business account. Business-account owner or admin only. Creates the

        account-Layer if the account has none yet.'
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasPolicyLayerUpdateRequest'
      responses:
        '200':
          description: Account-Layer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /server/{environmentId}/businessAccounts/linkWallet:
    post:
      operationId: linkBusinessAccountWalletServer
      tags:
      - Server
      summary: Server — add an existing wallet to a business account
      description: 'Brings an existing wallet under a business account so signers can be

        added to it. No MPC ceremony — the owner already holds a valid share

        set, so this transfers the wallet''s ownership to the business account

        and registers the caller as an owner member + signer bound to their

        existing share set. When `businessAccountId` is omitted, the

        per-wallet business account is found-or-created (unnamed). Idempotent.'
      x-cli-ignore: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkBusinessAccountWalletSdkRequest'
      responses:
        '200':
          description: Business account with embedded members, signers, and wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountDetail'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    NameServiceData:
      type: object
      properties:
        avatar:
          description: URL of the avatar associated with the name service record
          type: string
        name:
          description: Resolved name from the name service (e.g. ENS name)
          type: string
    VerifiedCredentialId:
      description: UUID v4 with an optional -zerodev suffix for ZeroDev EIP-7702 smart-wallet credentials
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(-zerodev)?$
      minLength: 36
      maxLength: 45
      example: 95b11417-f18f-457f-8804-68e361f9164f-zerodev
    WaasPolicyConstraintCondition:
      type: string
      enum:
      - equal
      - greater
      - less
      - greaterEqual
      - lessEqual
      - notEqual
      description: Comparison operator for argument validation
    FlowCurrencyEnum:
      description: Currency the flow amount is denominated in. USD prices the amount against each settlement token. SETTLEMENT_TOKEN denominates the amount directly in the settlement token itself (e.g. "0.5" for 0.5 ETH, not wei); only valid for flows using `payment` mode AND with exactly one settlement token in the settlement config.
      type: string
      enum:
      - USD
      - SETTLEMENT_TOKEN
    BusinessAccount:
      type: object
      description: A multi-operator wallet container (product name "Business Accounts")
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        projectEnvironmentId:
          $ref: '#/components/schemas/uuid'
        name:
          type:
          - string
          - 'null'
          maxLength: 255
        externalRef:
          description: Developer-supplied stable ID inside the env
          type:
          - string
          - 'null'
          maxLength: 255
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - projectEnvironmentId
    WaasPolicyRule:
      type: object
      required:
      - name
      - ruleType
      - chain
      properties:
        ruleId:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: Human-readable name for the rule
        ruleType:
          $ref: '#/components/schemas/WaasPolicyRuleType'
        address:
          description: Target address EVM or SVM (legacy field)
          anyOf:
          - $ref: '#/components/schemas/WalletPublicKey'
          - $ref: '#/components/schemas/SolanaPublicKey'
          deprecated: true
        addresses:
          description: Target address(es) EVM or SVM
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/WalletPublicKey'
            - $ref: '#/components/schemas/SolanaPublicKey'
        chain:
          $ref: '#/components/schemas/WaasChainEnum'
        chainId:
          type: number
          description: Chain ID for the policy rule (legacy field)
        chainIds:
          description: Chain IDs for the policy rule
          type: array
          items:
            type: number
        contractAbi:
          type: array
          description: Contract ABI interface
          items:
            type: object
        functionName:
          type: string
          description: Specific function name to permit/deny
        argumentConstraints:
          type: array
          items:
            $ref: '#/components/schemas/WaasPolicyArgumentConstraint'
          description: Validation rules for function arguments
        valueLimit:
          type: object
          description: Value limits for the policy rule
          properties:
            asset:
              description: Target asset address. If undefined, refers to native token (e.g., ETH)
              anyOf:
              - $ref: '#/components/schemas/WalletPublicKey'
              - $ref: '#/components/schemas/SolanaPublicKey'
            maxPerCall:
              type: string
              description: Maximum value per function call (as string to handle bigint)
              pattern: ^[0-9]+$
            totalLimit:
              type: string
              description: Cumulative value limit (as string to handle bigint)
              pattern: ^[0-9]+$
        operationRestrictions:
          type: object
          description: Operation-level restrictions for the wallet
          properties:
            blockExport:
              type: boolean
              description: Block private key export
            blockRevocation:
              type: boolean
              description: Block end-user revocation of delegated access
            blockClientSigning:
              type: boolean
              description: Block all end-user signing (not delegated)
        disableBlockaidSecurityChecks:
          type: boolean
          description: When true, disables Blockaid security enforcement for this rule. Blockaid simulation will still run for policy evaluation, but security verdicts (e.g., malicious transactions) will not block execution. Transaction approval will be determined solely by customer-defined policy rules. Use with caution as this bypasses automated security protections.
        modifiableBySigner:
          type: boolean
          description: When true, a Signer is permitted to modify this Rule. Cannot be combined with operationRestrictions or disableBlockaidSecurityChecks on the same Rule.
        approvalRequirements:
          type: array
          description: Multi-party approval requirements for this Rule. Enforced only for accounts that support them; ignored for other accounts. when.initiatorRole and when.actionTypes are not yet resolved — until they are, a requirement that sets either field applies to all approvers, not just the named role.
          items:
            type: object
            required:
            - v
            - id
            - requiredApprovals
            properties:
              v:
                type: number
                description: Schema version for this requirement. An unknown value rejects the Composition.
              id:
                type: string
                description: Stable handle for this requirement, carried as requirementId in the deny reason.
              when:
                type: object
                description: All present conditions AND together. Omit for an unconditional requirement.
                properties:
                  minValue:
                    type: object
                    description: The amount at which this requirement starts to apply.
                    properties:
                      asset:
                        description: Target asset address. If undefined, refers to native token (e.g., ETH)
                        anyOf:
                        - $ref: '#/components/schemas/WalletPublicKey'
                        - $ref: '#/components/schemas/SolanaPublicKey'
                      amount:
                        type: string
                        description: Threshold amount (as string to handle bigint)
                        pattern: ^[0-9]+$
                  initiatorRole:
                    type: object
                    description: Matches on the user who starts the action. Not yet resolved — until it is, a requirement that sets this field applies to all initiators.
                    properties:
                      roles:
                        type: array
                        items:
                          type: string
                      userIds:
                        type: array
                        items:
                          type: string
                  actionTypes:
                    type: array
                    description: Matches on the operation type. Not yet resolved — until it is, a requirement that sets this field applies to all operation types.
                    items:
                      type: string
              eligibleApproverRoles:
                type: array
                items:
                  type: string
                description: Names of the roles whose holders may satisfy this requirement. A holder of any listed role may approve. An empty array means no restriction.
              mandatoryApproverRoles:
                type: array
                items:
                  type: string
                description: Names of the roles that must each be represented among the approvers, regardless of eligibleApproverRoles. An empty array means none.
              requiredApprovals:
                type: number
                description: Total approvals required. Never counts the Initiator.
              completeWithinSeconds:
                type: number
                description: How long a collected-approvals proposal remains valid.
    SdkUser:
      allOf:
      - $ref: '#/components/schemas/BaseUser'
      - type: object
        required:
        - verifiedCredentials
    WaasPolicyLayerRuleOperation:
      type: object
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - upsert
          - remove
          description: The per-Rule operation to apply within a batch
        rule:
          $ref: '#/components/schemas/WaasPolicyRule'
        declarativeRule:
          $ref: '#/components/schemas/WaasPolicyDeclarativeRuleInput'
        ruleId:
          $ref: '#/components/schemas/uuid'
    FlowFeeClaimSignature:
      description: A signature over a single claim step's payload.
      type: object
      required:
      - signature
      - stepId
      properties:
        signature:
          description: Signature the recipient produced over the step's payload
          type: string
        stepId:
          description: The id of the FlowFeeClaimStep this signature corresponds to
          type: string
    NonEmptyStringWith255MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      maxLength: 255
      example: An example name
    BusinessAccountMemberSelection:
      type: object
      description: 'Names a user. Pass `userId` directly OR `identifier + type` (any UserIdentifierTypeEnum value), mirroring the pregen flow. `smsCountryCode` is required when `type` is `phoneNumber`; `socialProvider` is required when `type` is `socialUsername` or `socialAccountId`.

        '
      properties:
        userId:
          type:
          - string
          - 'null'
          format: uuid
        identifier:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/UserIdentifierTypeEnum'
        smsCountryCode:
          $ref: '#/components/schemas/SmsCountryCode'
        socialProvider:
          $ref: '#/components/schemas/ProviderEnum'
    BusinessAccountWallet:
      type: object
      description: Minimal business-account-wallet projection used by `BusinessAccountDetail`.
      required:
      - id
      - publicKey
      - chain
      - createdAt
      properties:
        id:
          description: Wallet ID (matches `signers[].walletId` for wallets that already have a signer).
          type: string
          format: uuid
        publicKey:
          description: Wallet address (already-formatted public address, not raw key material).
          type: string
        chain:
          $ref: '#/components/schemas/ChainEnum'
        createdAt:
          type: string
          format: date-time
    FlowGasEstimate:
      description: Estimated gas cost for executing a flow's source transaction.
      type: object
      properties:
        usdValue:
          type: string
          description: Estimated gas cost in USD
        nativeValue:
          type: string
          description: Estimated gas cost in native-token base units (wei, lamports, etc.)
        nativeSymbol:
          type: string
          description: Symbol of the native token (e.g. "ETH", "SOL")
    BusinessAccountAutoExecute:
      type: boolean
      default: true
      description: 'Whether the change applies the moment its quorum is met, or waits for an explicit execute. Read only on the first call, where it is stamped into the intent you sign; after that the signed intent is the authority. Defaults to true, because a change holding all its consent while waiting for a button press tends to be forgotten, and the deadline covers execution too.

        '
    BusinessAccountApprovalsPending:
      type: object
      description: 'The action is governed, signed, and short of quorum — not a refusal: the caller may perform it, they have simply not collected every approval it requires. `proposalId` is the proposal collecting approvals, and `approvalRequirements` says what each rule still needs.

        A missing signed intent is a different case entirely and is reported as `422 intent_required` (see `UnprocessableEntity`), not this response — the caller made a mistake (nothing to sign yet was supplied) rather than something outstanding.

        '
      required:
      - approvalRequirements
      - intent
      - proposalId
      - reason
      properties:
        reason:
          type: string
          enum:
          - APPROVALS_REQUIRED
        intent:
          $ref: '#/components/schemas/BusinessAccountMutationIntent'
        message:
          type: string
          description: 'Why the action did not apply, ready to show a user. A 202 carries no `error`, so a client rendering only that field would show nothing for the commonest case — executing before the approvals are in.

            '
          example: 'This proposal cannot be executed yet: addMember needs 1 more approval (1 of 2).'
        proposalId:
          type: string
          format: uuid
          description: The proposal collecting approvals.
        approvalRequirements:
          type: array
          description: 'Every matching requirement, met or not, so a client can render progress per rule.

            '
          items:
            $ref: '#/components/schemas/BusinessAccountApprovalRequirementStatus'
    UnprocessableEntity:
      type: object
      properties:
        error:
          description: Human-readable error message describing the validation failure
          type: string
          example: Resources already exists for this Object
        code:
          $ref: '#/components/schemas/UnprocessableEntityErrorCode'
        payload:
          $ref: '#/components/schemas/UnprocessableEntityErrorPayload'
        retryAfterSeconds:
          description: Seconds the client should wait before retrying, present on rate-limit errors
          type: integer
          example: 600
      required:
      - error
    CreateBusinessAccountSdkRequest:
      type: object
      description: SDK-side create-business-account request. Caller becomes the first owner.
      properties:
        name:
          type:
          - string
          - 'null'
          maxLength: 255
        externalRef:
          description: Developer-supplied stable ID inside the env
          type:
          - string
          - 'null'
          maxLength: 255
        metadata:
          type: object
    HeldBusinessAccountMemberRole:
      type: string
      description: 'The role a member actually holds: a built-in (`owner`, `admin`, `viewer`) or a customer-defined role the account has defined. Wider than AssignableBusinessAccountRoleName because a held role can be `owner`, which cannot be assigned directly.

        '
      pattern: ^[a-z0-9](?:[a-z0-9_-]{0,30}[a-z0-9])?$
      example: cfo
    Flow:
      description: A single payment, deposit, or withdraw flow. Collapses the former Checkout and CheckoutTransaction into one resource.
      type: object
      required:
      - id
      - mode
      - amount
      - currency
      - executionState
      - settlementState
      - riskState
      - quoteVersion
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        mode:
          $ref: '#/components/schemas/FlowModeEnum'
        amount:
          description: Amount in the specified currency. Set once at create by the API-key caller and immutable thereafter.
          type: string
        amountUsd:
          description: Amount in USD. Equals `amount` when `currency` is USD. For token-denominated currencies it is `amount` multiplied by the settlement token's USD price, calculated when a quote is generated. Absent until then, or if no price is available.
          type: string
        currency:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        currencyTokenInfo:
          $ref: '#/components/schemas/FlowTokenInfo'
        memo:
          description: Arbitrary metadata attached to the flow
          type: object
        userId:
          $ref: '#/components/schemas/uuid'
        executionState:
          $ref: '#/components/schemas/FlowExecutionStateEnum'
        settlementState:
          $ref: '#/components/schemas/FlowSettlementStateEnum'
        riskState:
          $ref: '#/components/schemas/FlowRiskStateEnum'
        sourceType:
          $ref: '#/components/schemas/FlowSourceTypeEnum'
        fromAddress:
          $ref: '#/components/schemas/WalletPublicKey'
        fromChainId:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        fromChainName:
          $ref: '#/components/schemas/ChainEnum'
        fromToken:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        toAddress:
          $ref: '#/components/schemas/WalletPublicKey'
        toChainId:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        toChainName:
          $ref: '#/components/schemas/ChainEnum'
        toToken:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        quoteVersion:
          description: Version number of the quote used for this flow
          type: integer
        quote:
          $ref: '#/components/schemas/FlowQuote'
        txHash:
          $ref: '#/components/schemas/NonEmptyStringWith4096MaxLength'
        settlementTxHash:
          allOf:
          - $ref: '#/components/schemas/NonEmptyStringWith4096MaxLength'
          - description: Transaction hash on the destination chain
        broadcastedAt:
          description: ISO 8601 timestamp of when the flow was broadcast to the network
          type: string
          format: date-time
        sourceConfirmedAt:
          description: ISO 8601 timestamp of when the source chain confirmed the transaction
          type: string
          format: date-time
        confirmations:
          description: Number of blockchain confirmations received
          type: integer
        settlement:
          $ref: '#/components/schemas/FlowSettlementData'
        completedAt:
          description: ISO 8601 timestamp of when the flow was completed
          type: string
          format: date-time
        failure:
          $ref: '#/components/schemas/FlowFailure'
        expiresAt:
          description: ISO 8601 timestamp of when the flow expires
          type: string
          format: date-time
        createdAt:
          description: ISO 8601 timestamp of when the flow was created
          type: string
          format: date-time
        updatedAt:
          description: ISO 8601 timestamp of when the flow was last updated
          type: string
          format: date-time
        depositAddress:
          $ref: '#/components/schemas/WalletPublicKey'
        exchangeSource:
          $ref: '#/components/schemas/FlowExchangeSource'
        pegStablecoins:
          description: When true, known stablecoins (USDC, USDT, DAI, etc.) in the settlement config are pegged 1:1 to the flow currency, skipping market-price lookup. Non-stablecoin settlements still use live pricing.
          type: boolean
        disableSwaps:
          description: When true, the flow will not be quoted through swap providers; the payer must supply a token/chain already accepted by the settlement config. Defaults to false.
          type: boolean
        uiConfig:
          $ref: '#/components/schemas/FlowUIConfig'
        settlementConfig:
          allOf:
          - $ref: '#/components/schemas/SettlementConfigInput'
          - description: Settlement configuration (tokens/chains accepted for payment). Only returned on the server (API-key) endpoint.
        destinationConfig:
          allOf:
          - $ref: '#/components/schemas/DestinationConfigInput'
          - description: Destination configuration (where settled funds are sent). Only returned on the server (API-key) endpoint.
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
