    WaasPolicyDeclarativeRuleInput:
      type: object
      description: 'A Rule authored in the policy rule language, evaluated by the engine as stored rather than compiled from WaasPolicyRule. Shares identity and authorship with a legacy Rule so the Layer machinery — deletion markers, authorship stamping, the edit guard — keys on the same fields and needs no second code path for anything but evaluation. A Layer holds one syntax or the other: a write that would leave both in one Layer is refused.'
      required:
      - phase
      - when
      - then
      properties:
        ruleId:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          description: Human-readable name for the rule
        phase:
          type: string
          description: Which question this Rule answers. A Layer is one flat list, so the phase travels on the Rule rather than being implied by its position.
          enum:
          - transaction
          - operation
        when:
          type: object
          description: Condition in the policy rule language, validated against the field catalog on write and again on read
        then:
          $ref: '#/components/schemas/WaasPolicyAction'
        approvalRequirements:
          type: array
          description: The approvals a matching transaction needs. Required when then is REQUIRE_APPROVAL and refused on any other action. A deny in the same Layer wins first; otherwise every REQUIRE_APPROVAL Rule whose when holds, or cannot be decided, applies. A message or raw sign has no transaction to test, so every such Rule applies. Enforced only for business-account wallets. Valid on business-account, wallet and signer Layers and refused on the environment Layer. Only admins and business-account admins may author one. May not read spendWindows.
          items:
            $ref: '#/components/schemas/WaasPolicyDeclarativeApprovalRequirement'
        modifiableBySigner:
          type: boolean
          description: When true, a Signer may adjust this Rule within its recognised shape
    SwapEvmApprovalData:
