              description: 'The Layer''s Rules, in whichever syntax it holds — legacy (WaasPolicyLayerResponseRule) or the policy rule language (WaasPolicyDeclarativeRule). Free-form for the same reason the request side is: which syntax a Layer may hold, and that it holds only one, are the enclave''s checks, not this contract''s. Pinning the legacy shape here would make a successful write of a declarative Layer return a body that violates its own response schema.'
