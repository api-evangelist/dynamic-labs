      properties:
        recipients:
          description: Fee recipients who each receive a share of the source amount on swaps — at most 1 per address family. Each recipient address must be a valid EVM (`0x`) or Solana (base58) address; families may be mixed on one flow since each swap provider collects only the recipients it can pay on the quote's source chain.
          type: array
          items:
            $ref: '#/components/schemas/FeeRecipientConfig'
          minItems: 1
          maxItems: 2
    FlowFeeClaimSubmitResponse:
      description: Result of submitting a fee claim.
      type: object
