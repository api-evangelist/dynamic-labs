    FlowCreateRequest:
      description: Create-time payload for a flow. amount, currency, settlementConfig and destinationConfig are written once here (by a trusted API-key caller) and are accepted by no later endpoint. mode is supplied in the URL path.
      type: object
      required:
      - amount
      - currency
      - settlementConfig
      - destinationConfig
      properties:
        amount:
          description: Amount in the specified currency
          type: string
        currency:
