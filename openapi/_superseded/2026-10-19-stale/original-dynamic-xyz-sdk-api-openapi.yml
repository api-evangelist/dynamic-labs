components:
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
    ForbiddenWithErrorAndPayload:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenWithErrorAndPayload'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequests'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
  schemas:
    WaasChainEnum:
      type: string
      enum:
      - EVM
      - SVM
      - SUI
      - BTC
      - TON
    SdkSettingsRequest:
      type: object
      properties:
        dynamicContextProps:
          type: object
        dynamicWagmiSettings:
          type: object
        frameworkSettings:
          $ref: '#/components/schemas/FrameworkSettings'
    UserPasskey:
      type: object
      required:
      - id
      - credentialId
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        alias:
          type: string
        userAgent:
          type: string
        origin:
          type: string
        credentialId:
          $ref: '#/components/schemas/NonEmptyString'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        storage:
          $ref: '#/components/schemas/PasskeyStorage'
    SignInProviderEnum:
      type: string
      description: The 'turnkey' value is deprecated and will be removed in a future version.
      enum:
      - dynamic
      - magicLink
      - blocto
      - turnkey
      - coinbaseWaas
    NonEmptyStringWith255MaxLengthAndSpecialChars:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'()\[\]*]+(?<=\S)$
      maxLength: 255
      example: An example name
    ProjectSettingsSecurity:
      type: object
      properties:
        jwtDuration:
          $ref: '#/components/schemas/Duration'
        hCaptcha:
          $ref: '#/components/schemas/HCaptchaSettings'
        mfa:
          $ref: '#/components/schemas/MFASettings'
        auth:
          $ref: '#/components/schemas/AuthSettings'
        externalAuth:
          $ref: '#/components/schemas/ExternalAuth'
        environmentLocked:
          type: boolean
          description: When enabled, all SDK requests to this environment will be blocked.
        notifications:
          $ref: '#/components/schemas/SecurityNotifications'
    UserFieldsCheckEnum:
      type: string
      enum:
      - email
      - username
      - name-service-subdomain-handle
    OAuthError:
      type: string
      pattern: ^[a-zA-Z_\-]{5,100}$
      description: Valid oauth error
      example: access_denied
    ProjectSettingsSdkWaasDelegatedAccess:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether delegated access is enabled for the environment. If enabled, developer can trigger user to accept delegated access.
        promptUsersOnSignIn:
          type: boolean
          description: Prompt for delegated access when user logs in.
        requiresDelegation:
          type: boolean
          description: If enabled, users will be required to delegate access.
    PasskeyStorage:
      type: object
      required:
      - name
      - icon
      properties:
        name:
          type: string
        icon:
          type: string
        updatedAt:
          type: string
          format: date-time
    NonEmptyStringWith50MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
      maxLength: 50
    ExportEmbeddedWalletResponse:
      required:
      - exportBundle
      type: object
      properties:
        exportBundle:
          type: string
    SupportedOnrampsResponse:
      type: object
      properties:
        onramps:
          type: array
          items:
            $ref: '#/components/schemas/RampConfiguration'
    EmbeddedWalletAuthType:
      type: string
      enum:
      - mpc
    WalletAdditionalAddress:
      type: object
      description: An additional address associated with a wallet.
      required:
      - address
      - type
      properties:
        address:
          type: string
          description: An address associated with a wallet.
        publicKey:
          type: string
          description: The public key associated with the address.
        type:
          $ref: '#/components/schemas/WalletAddressType'
    PasskeyExtension:
      type: object
      properties:
        appid:
          type: string
          description: FIDO AppID
        appidExclude:
          type: string
          description: FIDO AppID exclusion
        credProps:
          type: boolean
          description: Request credential properties
        uvm:
          type: boolean
          description: Request user verification method
    ReshareRequest:
      type: object
      required:
      - clientKeygenIds
      - oldThresholdSignatureScheme
      - newThresholdSignatureScheme
      properties:
        clientKeygenIds:
          type: array
          items:
            $ref: '#/components/schemas/NonEmptyBase58StringWith100MaxLength'
        oldThresholdSignatureScheme:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        newThresholdSignatureScheme:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        delegateToProjectEnvironment:
          type: boolean
        revokeDelegation:
          type: boolean
    FrameworkSettings:
      type: object
      properties:
        react:
          $ref: '#/components/schemas/ReactSettings'
        nextjs:
          $ref: '#/components/schemas/NextJsSettings'
    MergeUser:
      type: object
      description: Contains the current field value for the user.
      required:
      - userId
      - value
      properties:
        userId:
          $ref: '#/components/schemas/uuid'
        value:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
    GlobalWalletSettings:
