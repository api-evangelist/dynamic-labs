    OauthResultStatus:
      type: string
      enum:
      - pending
      - completed
    Funding:
      type: object
      properties:
        onramps:
          type: array
          items:
            $ref: '#/components/schemas/OnrampProviders'
        externalWallets:
          type: object
          properties:
            enabled:
              type: boolean
            minAmount:
              type: object
              properties:
                amount:
                  type: string
                currency:
                  type: string
            defaultSettings:
              type: object
              properties:
                chainSettings:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExternalWalletFundingDefaultSettings'
          required:
          - enabled
      required:
      - onramps
    TokenBalance:
      type: object
      required:
      - address
      - name
      - symbol
      - decimals
      - logoURI
      - balance
      - rawBalance
      properties:
        networkId:
          type: integer
        address:
          $ref: '#/components/schemas/WalletPublicKey'
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        logoURI:
          type: string
        balance:
          type: number
        rawBalance:
          type: number
        price:
          type: number
        marketValue:
          type: number
        liquidityPoolSizeUsd:
          type: number
        totalSupply:
          type: string
        isNative:
          type: boolean
    OptionalNonEmptyUrl:
      type: string
      pattern: ^$|^(https?:\/\/)?[a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}([0-9]{1,5})?(\/.*)?$
      example: https://website-sample.com
    SupportedOfframpsResponse:
      type: object
      properties:
        offramps:
          type: array
          items:
            $ref: '#/components/schemas/RampConfiguration'
    RampConfiguration:
      type: object
      required:
      - provider
      - name
      - iconUrl
      - url
      properties:
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        name:
          type: string
        iconUrl:
          type: string
        url:
          type: string
        qrCode:
          type: string
          description: Optional QR code provided by the onramp (e.g., Crypto.com)
    HardwareWalletProperties:
      type: object
      properties:
        hardwareWallet:
          $ref: '#/components/schemas/HardwareWalletEnum'
    Duration:
      type: object
      required:
      - amount
      - unit
      properties:
        amount:
          type: integer
        unit:
          $ref: '#/components/schemas/TimeUnitEnum'
    ProjectSettingsChains:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        networks:
          type: array
          items:
            $ref: '#/components/schemas/Network'
      required:
      - name
      - enabled
    ScanWebsiteUrlResponse:
      type: object
      properties:
        isMalicious:
          type:
          - boolean
          - 'null'
          description: Indicates whether the scanned URL is potentially malicious. Returns null if scan is inconclusive.
    PublishEvents:
      type: object
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            properties:
              anonymousId:
                type: string
              event:
                type: string
              properties:
                type: object
                additionalProperties: true
              type:
                type: string
                enum:
                - track
            required:
            - anonymousId
            - event
            - properties
            - type
      required:
      - events
    Account:
      type: object
      required:
      - id
      - exchange
      - balances
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        exchange:
          $ref: '#/components/schemas/ExchangeKeyEnum'
        type:
          type: string
          description: Account type as reported by the exchange
          example: wallet
        balances:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalances'
        name:
          type: string
          description: Human-friendly label if supplied by the exchange.
        chain:
          type: string
          description: Blockchain network if relevant
          example: ethereum
    RecoverMultipleClientKeySharesRequest:
      type: object
      properties:
        keyShareIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
    TurnkeyWalletAccount:
      required:
      - curve
      - pathFormat
      - path
      - addressFormat
      type: object
      properties:
        curve:
          $ref: '#/components/schemas/NonEmptyString'
        pathFormat:
          $ref: '#/components/schemas/NonEmptyString'
        path:
          type: string
        addressFormat:
          $ref: '#/components/schemas/NonEmptyString'
    AttestationConveyancePreference:
      type: string
      enum:
      - direct
      - enterprise
      - indirect
      - none
    SdkViewSectionType:
      type: string
      enum:
      - email
      - emailAndPhone
      - phone
      - separator
      - social
      - text
      - wallet
      - passkey
    WalletKeyShareInfoWithEncryptedAccountCredential:
      type: object
      allOf:
      - $ref: '#/components/schemas/WalletKeyShareInfo'
      - type: object
        properties:
          encryptedAccountCredential:
            $ref: '#/components/schemas/NonEmptyStringWith4096MaxLength'
    ProjectSettingsGeneralApps:
      type: object
      additionalProperties:
        type:
        - string
        - 'null'
        format: url
      example:
        slack: https://dynamic.xyz
        twitter: https://dynamic.xyz
    CreateExchangeTransferRequest:
      type: object
      required:
      - to
      - amount
      - currency
      properties:
        to:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        amount:
          type: number
          description: the amount to transfer
          minimum: 0
        currency:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        network:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        networkObject:
          type: object
          description: The chain and network to be used for the transaction. Note that Kraken does not support specifying the network.
          required:
          - networkId
          - chainName
          properties:
            networkId:
              $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
            chainName:
              $ref: '#/components/schemas/ChainEnum'
        id:
          $ref: '#/components/schemas/uuid'
        description:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        mfaCode:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
    MergeConflicts:
      type: object
      description: Contains information needed for the SDK to surface merge conflicts when attempting to merge information from one user to another
      required:
      - fromUser
      - conflicts
      properties:
        fromUser:
          $ref: '#/components/schemas/SdkUser'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/MergeUserConflict'
    RoomCount:
      type: integer
      description: Number of rooms to create
      default: 5
      minimum: 1
      maximum: 20
    GeneratedTokenResponse:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: The short-lived JWT token
    MultichainAccountBalancesRequest:
      type: object
      required:
      - balanceRequests
      properties:
        filterSpamTokens:
          description: If false, the balance requests will not be filtered for spam tokens
          type: boolean
          default: true
        balanceRequests:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required:
            - address
            - chain
            - networkIds
            properties:
              address:
                type: string
                description: The wallet address
              chain:
                $ref: '#/components/schemas/ChainEnum'
              networkIds:
                type: array
                items:
                  type: number
                description: Array of network IDs to query
              whitelistedContracts:
                type: array
                items:
                  type: string
                description: Array of contract addresses to not filter out in the response
    ProviderKernelVersionEnum:
      type: string
      enum:
      - v2_4
      - v3_0
      - v3_1
      - v3_2
      - v3_3
    SignMessageEvmUserOperation:
      type: object
      description: User Operation (ERC-4337)
      properties:
        chainId:
          type: number
          description: Chain identifier needed for user operation hash calculation
        entryPoint:
          type: string
          description: Address of the entry point contract
        operation:
          $ref: '#/components/schemas/SignMessageUserOperationData'
    kasWalletString:
      type:
      - string
      - 'null'
      description: KAS wallet address
      pattern: ^kaspa:[1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz]{56,}$
      example: kaspa:qrelgny7sr3vahq69yykxx36m65gvmhryxrlwngfzgu8xkdslum2yxjp3ap8m
    WalletProperties:
      anyOf:
      - $ref: '#/components/schemas/TurnkeyWalletProperties'
      - $ref: '#/components/schemas/HardwareWalletProperties'
      - $ref: '#/components/schemas/CoinbaseMpcWalletProperties'
      - $ref: '#/components/schemas/SmartWalletProperties'
      - $ref: '#/components/schemas/WaasWalletProperties'
    PasskeyRegisterRequest:
      type: object
      required:
      - id
      - rawId
      - response
      - clientExtensionResults
      - type
      properties:
        id:
          $ref: '#/components/schemas/NonEmptyString'
        rawId:
          $ref: '#/components/schemas/NonEmptyString'
        response:
          $ref: '#/components/schemas/PasskeyRegistrationCredentialV2'
        clientExtensionResults:
          $ref: '#/components/schemas/AuthenticationExtensionsClientOutputs'
        authenticatorAttachment:
          $ref: '#/components/schemas/AuthenticatorAttachment'
        type:
          $ref: '#/components/schemas/PasskeyCredentialType'
        createMfaToken:
          $ref: '#/components/schemas/CreateMfaToken'
    NonEmptyString:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
    SupportedSecurityMethods:
      type: object
      properties:
        passkey:
          $ref: '#/components/schemas/SupportedSecurityMethod'
        email:
          $ref: '#/components/schemas/SupportedSecurityMethod'
        password:
          $ref: '#/components/schemas/SupportedSecurityMethod'
    PasskeyAuthRequest:
      type: object
      required:
      - id
      - rawId
      - response
      - clientExtensionResults
      - type
      properties:
        id:
          $ref: '#/components/schemas/NonEmptyString'
        rawId:
          $ref: '#/components/schemas/NonEmptyString'
        response:
          $ref: '#/components/schemas/AuthenticatorAssertionResponse'
        authenticatorAttachment:
          $ref: '#/components/schemas/AuthenticatorAttachment'
        clientExtensionResults:
          $ref: '#/components/schemas/AuthenticationExtensionsClientOutputs'
        type:
          $ref: '#/components/schemas/PublicKeyCredentialType'
        createMfaToken:
          $ref: '#/components/schemas/CreateMfaToken'
    AuthenticationExtensionsClientInputs:
      type: object
      properties:
        appid:
          type: string
        credProps:
          type: boolean
        hmacCreateSecret:
          type: boolean
    SimulateTransactionResponse:
      type: object
      required:
      - inAssets
      - outAssets
      - priceData
      - showTotalFiat
      properties:
        inAssets:
          type: array
          items:
            $ref: '#/components/schemas/AssetDiff'
        outAssets:
          type: array
          items:
            $ref: '#/components/schemas/AssetDiff'
        counterparties:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/WalletPublicKey'
            - $ref: '#/components/schemas/SolanaPublicKey'
        priceData:
          $ref: '#/components/schemas/PriceData'
        showTotalFiat:
          type: boolean
        validation:
          $ref: '#/components/schemas/BlockaidValidation'
        assetExposures:
          type: array
          items:
            $ref: '#/components/schemas/AssetExposure'
    DelegatedShareDeliveryResponse:
      type: object
      required:
      - delegatedShareDeliveryId
      - status
      properties:
        delegatedShareDeliveryId:
          type: string
          format: uuid
          description: Unique identifier for this delivery, used for tracking and correlation
        status:
          type: string
          enum:
          - accepted
          - queued
          description: Current status of the delegated share delivery
        message:
          type: string
          description: Human-readable status message
    HealthcheckStatus:
      type: string
      enum:
      - healthy
      - unhealthy
    ltcWalletString:
      type:
      - string
      - 'null'
      description: LTC wallet address
      pattern: ^[LM3][a-km-zA-HJ-NP-Z1-9]{26,53}$
      example: LUttH43tQ4x4qniCKr1Rqo8ESeXFPdv9ax
    CompletePasskeyRecoveryRequest:
      required:
      - walletId
      - attestation
      - challenge
      type: object
      properties:
        walletId:
          $ref: '#/components/schemas/uuid'
        attestation:
          $ref: '#/components/schemas/PasskeyRegistrationCredential'
        challenge:
          $ref: '#/components/schemas/NonEmptyString'
    RegisterSessionKeyRequest:
      required:
      - publicKey
      type: object
      properties:
        publicKey:
          $ref: '#/components/schemas/NonEmptyString'
        prevSessionKeySignature:
          $ref: '#/components/schemas/NonEmptyString'
        walletId:
          $ref: '#/components/schemas/uuid'
    OauthRedirectUri:
      type: string
      pattern: ^(https?:\/\/[a-zA-Z0-9 _.,:?&%\/-]+)*$
  parameters:
    mfaDeviceId:
      in: path
      name: mfaDeviceId
      required: true
      description: ID of the MFA Device
      schema:
        $ref: '#/components/schemas/uuid'
    walletAddress:
      in: path
      name: walletAddress
      schema:
        $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
      required: true
      description: Public key (address) of the wallet
    mfaAuthToken:
      in: header
      name: x-mfa-auth-token
      required: true
      description: MFA authentication token
      schema:
        type: string
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
    exchangeKey:
      in: path
      name: exchangeKey
      required: true
      description: Exchange identifier
      schema:
        $ref: '#/components/schemas/ExchangeKeyEnum'
    activityId:
      in: path
      name: activityId
      required: true
      description: ID of activity
      schema:
        $ref: '#/components/schemas/uuid'
    userId:
      in: path
      name: userId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of the user
    accountId:
      in: path
      name: accountId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of an exchange account
    globalWalletConnectionId:
      in: path
      name: globalWalletConnectionId
      required: true
      description: ID of the global wallet connection
      schema:
        $ref: '#/components/schemas/uuid'
    walletId:
      in: path
      name: walletId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of the wallet
    oauthAccountId:
      in: path
      name: oauthAccountId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of a user oauth account
    providerType:
      in: path
      name: providerType
      required: true
      description: Type of external auth provider
      schema:
        $ref: '#/components/schemas/ProviderEnum'
    relatedOriginRpId:
      in: query
      name: relatedOriginRpId
      required: false
      description: Related origin rp id
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
