openapi: 3.2.0
info:
  title: Dashboard Visits API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: Visits
  description: Track and query user visit activity within your environment.
paths:
  /environments/{environmentId}/visitors:
    get:
      operationId: getEnvironmentVisitors
      tags:
      - Visits
      summary: Get all visitors for an environment
      description: Returns all visitors for the specified environment.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: query
        name: filter
        description: JSON-encoded filter object with filterColumn (id, walletPublicKey, or all) and filterValue
        required: false
        style: form
        schema:
          $ref: '#/components/schemas/VisitorSearchFilterParams'
      - in: query
        name: orderBy
        description: Sort order as "column-direction" (e.g. createdAt-desc) — defaults to createdAt-desc
        required: false
        schema:
          $ref: '#/components/schemas/orderBy'
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set
        required: false
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: The number of items to return
        required: false
      responses:
        '200':
          description: List of visitors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
components:
  schemas:
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    VisitorFilterableFieldsEnum:
      type: string
      enum:
      - all
      - id
      - walletPublicKey
    ChainEnum:
      type: string
      enum:
      - ETH
      - EVM
      - FLOW
      - SOL
      - ALGO
      - STARK
      - COSMOS
      - BTC
      - ECLIPSE
      - SUI
      - SPARK
      - TRON
      - APTOS
      - TON
      - STELLAR
      - ALEO
      - TEMPO
      - MIDNIGHT
    WalletProviderEnum:
      type: string
      enum:
      - browserExtension
      - custodialService
      - walletConnect
      - qrCode
      - deepLink
      - embeddedWallet
      - smartContractWallet
    BadRequest:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
        code:
          description: Machine-readable reason for the 400, set only by endpoints that distinguish rejections. Flow endpoints use exchange_not_supported and exchange_currency_unsupported.
          type: string
          example: exchange_currency_unsupported
    Forbidden:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Access Forbidden
        code:
          description: Machine-readable reason for the 403, set only by endpoints that distinguish rejections. Flow endpoints use sanctions_blocked, session_token_invalid and risk_blocked.
          type: string
          example: sanctions_blocked
    VisitorsResponse:
      type: object
      properties:
        count:
          description: Total number of visitors matching the query
          type: integer
        visitors:
          description: List of visitor objects
          type: array
          items:
            $ref: '#/components/schemas/Visitor'
    orderBy:
      type: string
      description: $COLUMN_NAME-asc|desc
      pattern: ^[A-Za-z]*-(asc|desc)$
      example: something-asc
    Unauthorized:
      type: object
      properties:
        error:
          description: Human-readable error message describing the authentication failure
          type: string
          example: No jwt provided!
    Visitor:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        address:
          description: Wallet public address of the visitor
          type: string
          maxLength: 255
        chain:
          $ref: '#/components/schemas/ChainEnum'
        walletName:
          description: Name of the wallet provider used by the visitor
          type: string
          maxLength: 255
        provider:
          $ref: '#/components/schemas/WalletProviderEnum'
        createdAt:
          description: ISO 8601 timestamp of when the visitor was first seen
          type: string
          format: date-time
        projectEnvironmentId:
          $ref: '#/components/schemas/uuid'
      required:
      - id
      - address
      - chain
      - walletName
      - provider
      - createdAt
    InternalServerError:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Internal Server Error
    VisitorSearchFilterParams:
      type: object
      properties:
        filterValue:
          description: Search term to match against the selected filter column
          type: string
        filterColumn:
          $ref: '#/components/schemas/VisitorFilterableFieldsEnum'
        chain:
          $ref: '#/components/schemas/ChainEnum'
  responses:
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
  parameters:
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
