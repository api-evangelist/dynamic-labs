openapi: 3.2.0
info:
  title: Dashboard Events API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: Events
  description: Browse the event log of actions performed within your environment.
paths:
  /eventTypes:
    get:
      operationId: getEventTypes
      tags:
      - Events
      summary: Get event types
      description: Returns all available event types.
      responses:
        '200':
          description: List of event types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/events:
    get:
      operationId: getEvents
      tags:
      - Events
      summary: Get environment events
      description: Returns the events for the specified environment.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/resourceType'
      - $ref: '#/components/parameters/startDate'
      - $ref: '#/components/parameters/endDate'
      responses:
        '200':
          description: List of environment events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/events/{eventId}:
    get:
      operationId: getEventById
      tags:
      - Events
      summary: Get an environment event by ID
      description: Returns a single event by its unique identifier.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          description: Event for this project environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
  schemas:
    Event:
      type: object
      required:
      - eventId
      - environmentId
      - environmentName
      - eventName
      - timestamp
      - data
      - context
      properties:
        eventId:
          $ref: '#/components/schemas/uuid'
        environmentId:
          $ref: '#/components/schemas/uuid'
        environmentName:
          $ref: '#/components/schemas/EnvironmentEnum'
        eventAction:
          description: The action that occurred (e.g. "created", "updated", "deleted")
          type: string
        eventName:
          description: Dotted event name identifier (e.g. "admin.user.created")
          type: string
        resourceType:
          description: Type of resource affected by the event (e.g. "user", "wallet", "webhook")
          type: string
        timestamp:
          description: ISO 8601 timestamp of when the event occurred
          type: string
          format: date-time
        data:
          description: Event payload containing the resource data at the time of the event
          type: object
        context:
          $ref: '#/components/schemas/EventContext'
    EventTypesResponse:
      type: array
      items:
        $ref: '#/components/schemas/EventType'
    EventType:
      type: object
      required:
      - name
      - description
      properties:
        name:
          description: Dotted event type identifier (e.g. "admin.user.created")
          type: string
        description:
          description: Human-readable explanation of what triggers this event type
          type: string
    EventContext:
      type: object
      properties:
        userId:
          description: ID of the user who triggered the event
          type: string
        version:
          description: Event schema version for backward-compatible payload parsing
          type: string
    InternalServerError:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Internal Server Error
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    EnvironmentEnum:
      type: string
      enum:
      - sandbox
      - live
    EventsResponse:
      type: object
      properties:
        cursor:
          description: Opaque pagination cursor for fetching the next page of events
          type: string
        data:
          description: List of event objects
          type: array
          items:
            $ref: '#/components/schemas/Event'
    Forbidden:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Access Forbidden
        code:
          description: Machine-readable reason for the 403, set only by endpoints that distinguish rejections. Flow endpoints use sanctions_blocked, session_token_invalid and risk_blocked.
          type: string
          example: sanctions_blocked
    Unauthorized:
      type: object
      properties:
        error:
          description: Human-readable error message describing the authentication failure
          type: string
          example: No jwt provided!
  parameters:
    endDate:
      in: query
      name: endDate
      required: false
      schema:
        type: string
      description: End date of the event query
    resourceType:
      in: query
      name: resourceType
      schema:
        type: string
      required: false
      description: Resource type of event
    startDate:
      in: query
      name: startDate
      required: false
      schema:
        type: string
      description: Start date of the event query
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
    eventId:
      in: path
      name: eventId
      required: true
      description: ID of the event
      schema:
        $ref: '#/components/schemas/uuid'
    cursor:
      in: query
      name: cursor
      schema:
        type: string
      required: false
      description: Cursor for pagination
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Dynamic
  source: https://app.dynamic.xyz/api-docs/public-api.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
