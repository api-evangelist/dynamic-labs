    WaasWalletSettings:
      type: object
      properties:
        hasDeniedDelegatedAccess:
          type: boolean
        shouldRefreshOnNextSignOn:
          type: boolean
        reshareOnNextSignOn:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        revokeOnNextSignOn:
          type: boolean
    WaasWalletSignaturePolicyTmpResponse:
      type: object
      required:
      - id
      - walletId
      - expiresAt
      - policyContent
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        walletId:
          $ref: '#/components/schemas/uuid'
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when the policy expires
        policyContent:
          type: array
          minItems: 1
          description: Array of policy rules, each defining allowed addresses, chain, and value limits for different assets
          items:
            type: object
            required:
            - chain
            - toAddresses
            - valueLimits
            properties:
              chain:
                $ref: '#/components/schemas/WaasChainEnum'
              toAddresses:
                type: array
                minItems: 1
                description: Array of allowed recipient addresses (vault addresses) for this chain
                items:
                  anyOf:
                  - $ref: '#/components/schemas/WalletPublicKey'
                  - $ref: '#/components/schemas/SolanaPublicKey'
              valueLimits:
                type: array
                minItems: 1
                description: Array of value limits for different assets on this chain
                items:
                  type: object
                  required:
                  - asset
                  - maxPerCall
                  properties:
                    asset:
                      description: Target asset address
                      anyOf:
                      - $ref: '#/components/schemas/WalletPublicKey'
                      - $ref: '#/components/schemas/SolanaPublicKey'
                    maxPerCall:
                      type: string
                      description: Maximum value per transaction (as string to handle bigint)
                      pattern: ^[0-9]+$
    CustomFieldType:
      type: string
      enum:
      - text
      - checkbox
      - select
    ChainEnum:
      type: string
      enum:
      - ETH
      - EVM
      - FLOW
      - SOL
      - ALGO
      - STARK
      - COSMOS
      - BTC
      - ECLIPSE
      - SUI
      - SPARK
      - TRON
      - APTOS
      - TON
      - STELLAR
    UserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
    WaasAuthenticateResponse:
      type: object
      required:
      - message
      - encodedJwts
      properties:
        message:
          type: string
        encodedJwts:
          type: object
          properties:
            jwt:
              type: string
            minifiedJwt:
              type: string
    ecdsaValidatorOptions:
      type: string
      enum:
      - zerodev_signer_to_ecdsa
      - zerodev_multi_chain
    WaasDelegatedAccessEncryptionPublicKeyType:
      type: string
      enum:
      - dynamic
      - external
    UserIdentifierTypeEnum:
      type: string
      enum:
      - email
      - id
      - externalUserId
      - phoneNumber
      - socialUsername
      - socialAccountId
    HardwareWalletProperties:
      type: object
      properties:
        hardwareWallet:
          $ref: '#/components/schemas/HardwareWalletEnum'
    RevokeDelegatedAccessWalletResult:
      type: object
      required:
      - walletId
      - success
      properties:
        walletId:
          $ref: '#/components/schemas/uuid'
        success:
          type: boolean
          description: Whether the revocation was successful for this wallet
        error:
          type: string
          description: Error message if the revocation failed
    WalletAddressType:
      type: string
      enum:
      - ordinals
      - payment
      - cosmos
      - evm
      - ton
    NonEmptyIsoCountryCode:
      type: string
      pattern: ^[a-zA-Z]{2,4}\d?$
      maxLength: 4
      example: US
    WaasPolicyResponse:
      type: object
      required:
      - policyId
      - projectEnvironmentId
      - createdAt
      - updatedAt
      - policyContent
      properties:
        message:
          type: string
          description: Message describing the operation result
        policyId:
          type: string
        projectEnvironmentId:
          $ref: '#/components/schemas/uuid'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        policyContent:
          type: array
          items:
            $ref: '#/components/schemas/WaasPolicyRule'
    UnprocessableEntityErrorPayload:
      type: object
      description: Contains information which the integrating client of this API can use to tailor an experience to a customer to fix the underlying issue that triggered this error.
      properties:
        email:
          type: string
          format: email
          example: joe@email.com
        loginProvider:
          $ref: '#/components/schemas/ProviderEnum'
        embeddedWalletName:
          type: string
        embeddedSocialSigninProvider:
          $ref: '#/components/schemas/ProviderEnum'
        mergeConflicts:
          $ref: '#/components/schemas/MergeConflicts'
        additionalMessages:
          type: array
          items:
            type: string
    EmbeddedWalletVersionEnum:
      type: string
      enum:
      - V1
      - V2
      - V3
    CustomFieldValidValue:
      type: object
      required:
      - label
      properties:
        label:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLengthAndSpecialChars'
        key:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLengthAndSpecialChars'
    WaasWalletSignaturePolicyTmpTimeLimit:
      type: integer
      description: Time limit in seconds until the policy expires. Must be greater than 0 seconds.
      minimum: 1
    RevokeDelegatedAccessResponse:
      type: object
      required:
      - results
      - total
      - succeeded
      - failed
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RevokeDelegatedAccessWalletResult'
          description: Results for each wallet
        total:
          type: integer
          description: Total number of wallets processed
        succeeded:
          type: integer
          description: Number of wallets successfully revoked
        failed:
          type: integer
          description: Number of wallets that failed to revoke
    WaasPolicyDeleteRequest:
      type: object
      required:
      - ruleIdsToDelete
      properties:
        ruleIdsToDelete:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          description: Array of rule IDs to delete from the policy
    WaasVerifyApiKeyErrorResponse:
      type: object
      required:
      - message
      - verified
      properties:
        message:
          type: string
          description: Error message describing why verification failed
        verified:
          type: boolean
          description: Always false for error responses
    MergeConflicts:
      type: object
      description: Contains information needed for the SDK to surface merge conflicts when attempting to merge information from one user to another
      required:
      - fromUser
      - conflicts
      properties:
        fromUser:
          $ref: '#/components/schemas/SdkUser'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/MergeUserConflict'
    MFADevice:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MFADeviceType'
        verified:
          type: boolean
          description: Whether or not the user has a verified this MFA Device
        id:
          $ref: '#/components/schemas/uuid'
        createdAt:
          type: string
          format: date-time
          description: The date and time the MFA device was created
        verifiedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time the MFA device was verified
        default:
          type: boolean
          description: Whether or not this is the default MFA device for the user
        alias:
          type: string
          description: The optional alias for the MFA device
    MfaBackupCodeAcknowledgement:
      type:
      - string
      - 'null'
      enum:
      - pending
      - complete
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    DelegatedAccessEncryptionPublicKeyResponse:
      type: object
      required:
      - key
      - message
      properties:
        key:
          $ref: '#/components/schemas/DelegatedAccessEncryptionPublicKey'
        message:
          type: string
          description: Message describing the operation result
    ProviderKernelVersionEnum:
      type: string
      enum:
      - v2_4
      - v3_0
      - v3_1
      - v3_2
      - v3_3
    SdkUser:
      allOf:
      - $ref: '#/components/schemas/BaseUser'
      - type: object
        required:
        - verifiedCredentials
    ThresholdSignatureScheme:
      type: string
      enum:
      - TWO_OF_TWO
      - TWO_OF_THREE
      - THREE_OF_FIVE
    WaasDelegateSignMessageRequest:
      type: object
      required:
      - message
      properties:
        message:
          $ref: '#/components/schemas/NonEmptyStringWith16384MaxLength'
        isFormatted:
          type: boolean
        roomId:
          type: string
    WalletProperties:
      anyOf:
      - $ref: '#/components/schemas/TurnkeyWalletProperties'
      - $ref: '#/components/schemas/HardwareWalletProperties'
      - $ref: '#/components/schemas/CoinbaseMpcWalletProperties'
      - $ref: '#/components/schemas/SmartWalletProperties'
      - $ref: '#/components/schemas/WaasWalletProperties'
    NonEmptyString:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
    BackupKeySharesToLocationsWithUserIdRequest:
      type: object
      required:
      - userId
      - locations
      properties:
        userId:
          type: string
          format: uuid
          description: The ID of the user who owns the wallet
        locations:
          type: array
          items:
            type: object
            required:
            - location
            properties:
              location:
                $ref: '#/components/schemas/WaasBackupOptionsEnum'
              keygenId:
                $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
              thresholdSignatureScheme:
                $ref: '#/components/schemas/ThresholdSignatureScheme'
              externalKeyShareId:
                $ref: '#/components/schemas/NonEmptyString'
    WaasWalletSignaturePolicyTmpCreateRequest:
      type: object
      required:
      - policyContent
      - timeLimit
      properties:
        policyContent:
          type: array
          minItems: 1
          description: Array of policy rules, each defining allowed addresses, chain, and value limits for different assets
          items:
            type: object
            required:
            - chain
            - toAddresses
            - valueLimits
            properties:
              chain:
                $ref: '#/components/schemas/WaasChainEnum'
              toAddresses:
                type: array
                minItems: 1
                description: Array of allowed recipient addresses (vault addresses) for this chain
                items:
                  anyOf:
                  - $ref: '#/components/schemas/WalletPublicKey'
                  - $ref: '#/components/schemas/SolanaPublicKey'
              valueLimits:
                type: array
                minItems: 1
                description: Array of value limits for different assets on this chain
                items:
                  type: object
                  required:
                  - asset
                  - maxPerCall
                  properties:
                    asset:
                      description: Target asset address
                      anyOf:
                      - $ref: '#/components/schemas/WalletPublicKey'
                      - $ref: '#/components/schemas/SolanaPublicKey'
                    maxPerCall:
                      type: string
                      description: Maximum value per transaction (as string to handle bigint)
                      pattern: ^[0-9]+$
        timeLimit:
          $ref: '#/components/schemas/WaasWalletSignaturePolicyTmpTimeLimit'
    WaasPolicyConstraintCondition:
      type: string
      enum:
      - equal
      - greater
      - less
      - greaterEqual
      - lessEqual
      - notEqual
      description: Comparison operator for argument validation
    WaasPolicyUpdateRequest:
      type: object
      required:
      - rulesToUpdate
      properties:
        rulesToUpdate:
          type: array
          items:
            $ref: '#/components/schemas/WaasPolicyRule'
          description: Array of rules to update in the policy
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
  parameters:
    walletId:
      in: path
      name: walletId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of the wallet
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
