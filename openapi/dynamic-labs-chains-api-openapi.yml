openapi: 3.2.0
info:
  title: Dashboard Chains API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: Chains
  description: Manage the blockchain networks available for wallet connection in your environment.
paths:
  /chains/{chainName}/tokens:
    get:
      summary: Get tokens for a chain
      description: Returns all tokens for the specified chain.
      operationId: getAllTokensByChain
      tags:
      - Chains
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/chainName'
      - in: query
        name: networkId
        description: Numeric blockchain network ID to filter tokens by (e.g. 1 for Ethereum mainnet, 137 for Polygon)
        required: false
        schema:
          type: number
      responses:
        '200':
          description: Get all tokens for chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tokenCatalog:
    get:
      summary: Get the token catalog
      description: Returns the current token metadata catalog.
      operationId: getTokenCatalog
      tags:
      - Chains
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/cursor'
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: The number of items to return
        required: false
      responses:
        '200':
          description: Current token catalog
          headers:
            Cache-Control:
              description: Requires clients to revalidate cached snapshots.
              schema:
                type: string
            ETag:
              description: Content hash for conditional requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCatalogResponse'
        '304':
          description: Catalog has not changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    NonEmptyStringWith255MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      maxLength: 255
      example: An example name
    ChainEnum:
      type: string
      enum:
      - ETH
      - EVM
      - FLOW
      - SOL
      - ALGO
      - STARK
      - COSMOS
      - BTC
      - ECLIPSE
      - SUI
      - SPARK
      - TRON
      - APTOS
      - TON
      - STELLAR
      - ALEO
      - TEMPO
      - MIDNIGHT
    TokenCatalogEntry:
      description: Token metadata for a contract on a specific network.
      type: object
      required:
      - chain
      - contractAddress
      - decimals
      - name
      - networkId
      - symbol
      - tokenId
      properties:
        chain:
          $ref: '#/components/schemas/ChainEnum'
        contractAddress:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        decimals:
          type: integer
          minimum: 0
        logoURI:
          type: string
          format: uri
        name:
          type: string
        networkId:
          type: integer
        symbol:
          type: string
        tokenId:
          type: string
    InternalServerError:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Internal Server Error
    BadRequest:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
        code:
          description: Machine-readable reason for the 400, set only by endpoints that distinguish rejections. Flow endpoints use exchange_not_supported and exchange_currency_unsupported.
          type: string
          example: exchange_currency_unsupported
    Forbidden:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Access Forbidden
        code:
          description: Machine-readable reason for the 403, set only by endpoints that distinguish rejections. Flow endpoints use sanctions_blocked, session_token_invalid and risk_blocked.
          type: string
          example: sanctions_blocked
    ChainToken:
      description: Defined an one token which can have multiple contract addresses dependent to networkId
      type: object
      required:
      - name
      - symbol
      - tokenAddresses
      properties:
        name:
          description: Name of the token
          type: string
          example: Shiba Inu
        symbol:
          description: Symbol of the token
          type: string
          example: SHIB
        tokenAddresses:
          description: Array of different contract addresses dependent to networkId
          type: array
          items:
            $ref: '#/components/schemas/TokenAddress'
    TokenAddress:
      description: Defines one token address connected with network Id on which it's working
      type: object
      required:
      - networkId
      - contractAddress
      properties:
        networkId:
          description: Id of the network
          type: number
          example: 1
        contractAddress:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
    Unauthorized:
      type: object
      properties:
        error:
          description: Human-readable error message describing the authentication failure
          type: string
          example: No jwt provided!
    TokenCatalogResponse:
      type: object
      required:
      - tokens
      - version
      properties:
        nextCursor:
          description: Cursor for fetching the next page, null if no more pages
          type:
          - string
          - 'null'
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenCatalogEntry'
        version:
          description: Content hash for this catalog snapshot.
          type: string
    ChainTokensResponse:
      type: array
      items:
        $ref: '#/components/schemas/ChainToken'
  responses:
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
  parameters:
    chainName:
      name: chainName
      in: path
      description: Shortened chain name
      example: EVM
      required: true
      schema:
        $ref: '#/components/schemas/ChainEnum'
    cursor:
      in: query
      name: cursor
      schema:
        type: string
      required: false
      description: Cursor for pagination
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Dynamic
  source: https://app.dynamic.xyz/api-docs/public-api.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
