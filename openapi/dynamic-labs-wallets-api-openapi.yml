    InternalServerError:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Internal Server Error
    BusinessAccountMutationIntent:
      type: object
      description: 'The initiator''s proposal, signed with their session key. Built by the API, not the client — sign these exact bytes verbatim, because re-serializing can change them and invalidate the signature.

        `autoExecute` is inside the signed bytes, so an approver consents to it and nothing can flip it afterwards.

        '
      additionalProperties: true
    oAuthAccount:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        accountUsername:
          description: Username or display name from the linked OAuth provider account
          type: string
    UnprocessableEntityErrorPayload:
      type: object
      description: Contains information which the integrating client of this API can use to tailor an experience to a customer to fix the underlying issue that triggered this error.
      properties:
        email:
          description: Email address that caused the validation error
          type: string
          format: email
          example: joe@email.com
        loginProvider:
          $ref: '#/components/schemas/ProviderEnum'
        embeddedWalletName:
          description: Embedded wallet name that caused the validation error
          type: string
        embeddedSocialSigninProvider:
          $ref: '#/components/schemas/ProviderEnum'
        mergeConflicts:
          $ref: '#/components/schemas/MergeConflicts'
        intent:
          $ref: '#/components/schemas/BusinessAccountMutationIntent'
        additionalMessages:
          description: List of additional validation error messages
          type: array
          items:
            type: string
    DelegatedAccessWalletApiKey:
      type: object
      required:
      - encryptionPublicKey
      - scopes
      - createdAt
      - updatedAt
      properties:
        encryptionPublicKey:
          $ref: '#/components/schemas/DelegatedAccessEncryptionPublicKey'
        scopes:
          description: List of permission scopes granted to this delegated access API key
          type: array
          items:
            type: string
        expiresAt:
          description: ISO 8601 timestamp of when the delegated access API key expires, or null if it does not expire
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          description: ISO 8601 timestamp of when the delegated access API key was created
          type: string
          format: date-time
        updatedAt:
          description: ISO 8601 timestamp of when the delegated access API key was last updated
          type: string
          format: date-time
        deletedAt:
          description: ISO 8601 timestamp of when the delegated access API key was deleted, or null if active
          type:
          - string
          - 'null'
          format: date-time
    User:
      allOf:
      - $ref: '#/components/schemas/BaseUser'
      - type: object
        properties:
          walletPublicKey:
            type: string
          wallet:
            type: string
          chain:
            $ref: '#/components/schemas/ChainEnum'
          createdAt:
            description: ISO 8601 timestamp of when the user account was created
            type: string
            format: date-time
          updatedAt:
            description: ISO 8601 timestamp of when the user account was last updated
            type: string
            format: date-time
          sessions:
            description: List of authentication sessions for this user
            type: array
            items:
              $ref: '#/components/schemas/Session'
          wallets:
            description: List of wallets linked to this user
            type: array
            items:
              $ref: '#/components/schemas/Wallet'
          chainalysisChecks:
            description: Deprecated. Always an empty array — per-user check records are no longer surfaced. Retained for backward compatibility only.
            deprecated: true
            type: array
            items:
              $ref: '#/components/schemas/ChainalysisCheck'
          oauthAccounts:
            description: List of OAuth social accounts linked to this user
            type: array
            items:
              $ref: '#/components/schemas/oAuthAccount'
          mfaDevices:
            description: List of MFA devices registered by this user
            type: array
            items:
              $ref: '#/components/schemas/MFADevice'
    WalletRecoveryResponse:
      type: object
      properties:
        data:
          type: object
          description: Recovered wallets data
        message:
          type: string
          description: Summary of wallet recovery
    WalletsResponse:
      type: object
      required:
      - wallets
      - count
      properties:
        wallets:
          description: List of detailed wallet objects matching the query
          type: array
          items:
            $ref: '#/components/schemas/WalletDetail'
        count:
          type: integer
          description: Total number of wallets matching the filter
        limit:
          type: integer
          description: Maximum number of wallets returned
        offset:
          type: integer
          description: Number of wallets skipped
    BusinessAccountProperties:
      type: object
      description: 'Business-account context attached to a verified credential that belongs to a business account. Present whenever `wallet_properties.shareSetType` is `businessAccountUser`; absent otherwise. Each field is namespaced by its source table so a caller reading the response sees exactly which entity the value came from (no ambiguity between member role and signer type, between business-account name and signer-derived names, etc.).

        '
      required:
      - businessAccountId
      - businessAccountCreatedAt
      - businessAccountSignerId
      - businessAccountSignerType
      - businessAccountMemberRole
      properties:
        businessAccountId:
          $ref: '#/components/schemas/uuid'
        businessAccountName:
          type:
          - string
          - 'null'
          description: Display name; user-supplied at create time. Nullable.
        businessAccountExternalRef:
          type:
          - string
          - 'null'
          description: Developer-supplied stable ID inside the env. Nullable.
        businessAccountCreatedAt:
          type: string
          format: date-time
        businessAccountSignerId:
          $ref: '#/components/schemas/uuid'
        businessAccountSignerType:
          $ref: '#/components/schemas/BusinessAccountSignerType'
        businessAccountMemberRole:
          $ref: '#/components/schemas/HeldBusinessAccountMemberRole'
    DelegatedAccessEncryptionPublicKey:
      type: object
      required:
      - id
      - projectEnvironmentId
      - kid
      - alg
      - publicKeyPemB64
      - status
      - type
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        projectEnvironmentId:
          $ref: '#/components/schemas/uuid'
        kid:
          type: string
          description: Short identifier referenced in webhook envelopes so the developer knows which private key to use
          maxLength: 64
        alg:
          type: string
          enum:
          - RSA-OAEP-256
          - HYBRID-RSA-AES-256
          description: Algorithm for how this key is used
        publicKeyPemB64:
          type: string
          description: Developer's public key material, PEM encoded then base64'd
          maxLength: 4096
        status:
          type: string
          enum:
          - pending
          - active
          - revoked
          description: Lifecycle status of this key
        type:
          $ref: '#/components/schemas/WaasDelegatedAccessEncryptionPublicKeyType'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional expiry for planned rotations
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the key was revoked
        createdAt:
          description: ISO 8601 timestamp of when the encryption public key was created
          type: string
          format: date-time
        updatedAt:
          description: ISO 8601 timestamp of when the encryption public key was last updated
          type: string
          format: date-time
    WaasWalletShareSetType:
      type: string
      enum:
