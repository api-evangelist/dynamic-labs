          type: boolean
        enabled:
          description: Whether this KYC field is enabled for collection
          type: boolean
        unique:
          description: Whether this KYC field value must be unique across all users
          type: boolean
        verify:
          description: Whether this KYC field requires verification
          type: boolean
        type:
