    InternalServerError:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Internal Server Error
    BusinessAccountMutationIntent:
      type: object
      description: 'The initiator''s proposal, signed with their session key. Built by the API, not the client — sign these exact bytes verbatim, because re-serializing can change them and invalidate the signature.

        `autoExecute` is inside the signed bytes, so an approver consents to it and nothing can flip it afterwards.

        '
      additionalProperties: true
    oAuthAccount:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        accountUsername:
          description: Username or display name from the linked OAuth provider account
          type: string
    UnprocessableEntityErrorPayload:
      type: object
      description: Contains information which the integrating client of this API can use to tailor an experience to a customer to fix the underlying issue that triggered this error.
      properties:
        email:
          description: Email address that caused the validation error
          type: string
          format: email
          example: joe@email.com
        loginProvider:
          $ref: '#/components/schemas/ProviderEnum'
        embeddedWalletName:
          description: Embedded wallet name that caused the validation error
          type: string
        embeddedSocialSigninProvider:
          $ref: '#/components/schemas/ProviderEnum'
        mergeConflicts:
          $ref: '#/components/schemas/MergeConflicts'
        intent:
          $ref: '#/components/schemas/BusinessAccountMutationIntent'
        additionalMessages:
          description: List of additional validation error messages
          type: array
          items:
            type: string
    User:
      allOf:
      - $ref: '#/components/schemas/BaseUser'
      - type: object
        properties:
          walletPublicKey:
            type: string
          wallet:
            type: string
          chain:
            $ref: '#/components/schemas/ChainEnum'
          createdAt:
            description: ISO 8601 timestamp of when the user account was created
            type: string
            format: date-time
          updatedAt:
            description: ISO 8601 timestamp of when the user account was last updated
            type: string
            format: date-time
          sessions:
            description: List of authentication sessions for this user
            type: array
            items:
              $ref: '#/components/schemas/Session'
          wallets:
            description: List of wallets linked to this user
            type: array
            items:
              $ref: '#/components/schemas/Wallet'
          chainalysisChecks:
            description: Deprecated. Always an empty array — per-user check records are no longer surfaced. Retained for backward compatibility only.
            deprecated: true
            type: array
            items:
              $ref: '#/components/schemas/ChainalysisCheck'
          oauthAccounts:
            description: List of OAuth social accounts linked to this user
            type: array
            items:
              $ref: '#/components/schemas/oAuthAccount'
          mfaDevices:
            description: List of MFA devices registered by this user
            type: array
            items:
              $ref: '#/components/schemas/MFADevice'
    BulkUserCreateResponse:
      type: object
      properties:
        created:
          description: List of user objects that were newly created
          type: array
          items:
            $ref: '#/components/schemas/User'
        updated:
          description: List of user objects that were updated with new data
          type: array
          items:
            $ref: '#/components/schemas/User'
        failed:
          description: List of user objects that failed to create or update, with error details
          type: array
          items:
            type: object
            properties:
              user:
                $ref: '#/components/schemas/User'
              error:
                type: string
                example: Resources already exists for this Object
              code:
                $ref: '#/components/schemas/UnprocessableEntityErrorCode'
        total:
          description: Total number of users in the bulk request
          type: integer
    emailOrEmptyString:
      type: string
      pattern: ^$|(^([!#-'*+\/-9=?A-Z^-~-]+(\.[!#-'*+\/-9=?A-Z^-~-]+)*|"([]!#-[^-~ \t]|([\t -~]))+")@([!#-'*+\/-9=?A-Z^-~-]+(\.[!#-'*+\/-9=?A-Z^-~-]+)*|[\t -Z^-~]*)$)
      example: hello-world@foobar.com
      maxLength: 255
    UsersResponse:
      type: object
      properties:
        count:
          description: Total number of users matching the query
          type: integer
        users:
          description: List of user objects
          type: array
          items:
            $ref: '#/components/schemas/User'
    BusinessAccountProperties:
      type: object
      description: 'Business-account context attached to a verified credential that belongs to a business account. Present whenever `wallet_properties.shareSetType` is `businessAccountUser`; absent otherwise. Each field is namespaced by its source table so a caller reading the response sees exactly which entity the value came from (no ambiguity between member role and signer type, between business-account name and signer-derived names, etc.).

        '
      required:
      - businessAccountId
      - businessAccountCreatedAt
      - businessAccountSignerId
      - businessAccountSignerType
      - businessAccountMemberRole
      properties:
        businessAccountId:
          $ref: '#/components/schemas/uuid'
        businessAccountName:
          type:
          - string
          - 'null'
          description: Display name; user-supplied at create time. Nullable.
        businessAccountExternalRef:
          type:
          - string
          - 'null'
          description: Developer-supplied stable ID inside the env. Nullable.
        businessAccountCreatedAt:
          type: string
          format: date-time
        businessAccountSignerId:
          $ref: '#/components/schemas/uuid'
        businessAccountSignerType:
          $ref: '#/components/schemas/BusinessAccountSignerType'
        businessAccountMemberRole:
          $ref: '#/components/schemas/HeldBusinessAccountMemberRole'
    CreateUserOauthRequest:
      type: object
      required:
      - provider
      - accountId
      properties:
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        accountId:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        emails:
          description: List of email addresses associated with this OAuth account
          type: array
          items:
            $ref: '#/components/schemas/emailOrEmptyString'
        displayName:
          $ref: '#/components/schemas/OptionalNonEmptyStringWith255MaxLength'
        username:
          $ref: '#/components/schemas/OptionalNonEmptyStringWith255MaxLength'
        photos:
          description: List of profile photo URLs from the OAuth provider
          type: array
          items:
            type: string
        profile:
          description: Raw profile data returned by the OAuth provider
          type: object
    WaasWalletShareSetType:
      type: string
      enum:
      - delegated
      - rootUser
      - server
      - businessAccountUser
      - offlineRecovery
      description: The role this share set plays for the wallet
    WalletAdditionalAddress:
      type: object
      description: An additional address associated with a wallet.
      required:
      - address
      - type
      properties:
        address:
          type: string
          description: An address associated with a wallet.
        publicKey:
          type: string
          description: The public key associated with the address.
        type:
          $ref: '#/components/schemas/WalletAddressType'
        network:
          type: string
          description: Network this address is encoded for (e.g. 'mainnet' | 'testnet' | 'preview'). Present when a wallet exposes an address per network.
    ecdsaValidatorOptions:
      type: string
      enum:
      - zerodev_signer_to_ecdsa
      - zerodev_multi_chain
    Wallet:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          $ref: '#/components/schemas/NonEmptyString'
        chain:
          $ref: '#/components/schemas/ChainEnum'
        publicKey:
          $ref: '#/components/schemas/WalletPublicKey'
        provider:
          $ref: '#/components/schemas/WalletProviderEnum'
        properties:
          $ref: '#/components/schemas/WalletProperties'
        lastSelectedAt:
          description: ISO 8601 timestamp of when the user last selected this wallet as active
          type:
          - string
          - 'null'
      required:
      - id
      - name
      - chain
      - publicKey
      - provider
    BusinessAccountSignerType:
      type: string
      description: Type of a business account signer
      enum:
      - endUser
      - server
    kdaWalletString:
      type:
      - string
      - 'null'
      description: KDA wallet address
      pattern: ^k:[0-9a-fA-F]{64}$
      example: k:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
    ErrorMessageWithCode:
