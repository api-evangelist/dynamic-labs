          type: string
          example: not_found
    CustomFieldType:
      type: string
      enum:
      - text
      - checkbox
      - select
    Username:
      type:
      - string
      - 'null'
      description: Alphanumeric with slugs and underscores username
      pattern: ^$|^[\p{L}\p{N}_-]{3,20}$
      example: johndoe
      maxLength: 255
    OptionalNonEmptyStringWith255MaxLength:
      type: string
      pattern: ^$|^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
      maxLength: 255
    MFADevice:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MFADeviceType'
        verified:
          type: boolean
          description: Whether or not the user has a verified this MFA Device
        id:
          $ref: '#/components/schemas/uuid'
        createdAt:
          type: string
          format: date-time
          description: The date and time the MFA device was created
        verifiedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time the MFA device was verified
        default:
          type: boolean
          description: Whether or not this is the default MFA device for the user
        alias:
          type: string
          description: The optional alias for the MFA device
    updatableEmailOrEmptyString:
      type: string
      description: If email is trusted and verified, please provide a emailVerifiedAt timestamp. This will ensure that a user signing in with this email can access the correctly-created user account.
      pattern: ^$|(^([!#-'*+\/-9=?A-Z^-~-]+(\.[!#-'*+\/-9=?A-Z^-~-]+)*|"([]!#-[^-~ \t]|([\t -~]))+")@([!#-'*+\/-9=?A-Z^-~-]+(\.[!#-'*+\/-9=?A-Z^-~-]+)*|[\t -Z^-~]*)$)
      example: hello-world@foobar.com
      maxLength: 255
    MFADeviceType:
      type: string
      enum:
      - totp
      - passkey
      - email
    PasswordSourceTypeEnum:
      type: string
      enum:
      - dynamic
      - user
    CreateWalletRequest:
      required:
      - publicWalletAddress
      - chain
      - walletName
      - walletProvider
      type: object
      properties:
        publicWalletAddress:
          $ref: '#/components/schemas/WalletPublicKey'
        chain:
          $ref: '#/components/schemas/ChainEnum'
        walletName:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        walletProvider:
          $ref: '#/components/schemas/WalletProviderEnum'
        additionalWalletAddresses:
          description: Extra public addresses derived from or associated with this wallet (e.g. multi-chain)
          type: array
          items:
            $ref: '#/components/schemas/WalletAdditionalAddress'
    ckbWalletString:
      type:
      - string
      - 'null'
      description: CKB wallet address
      pattern: ^(ckb1q|ckt1q)[0-9a-z]{25,111}$
      example: ckt1q9876543210abcdefghijklmnopqrstuvwxyz
    MergeUser:
      type: object
      description: Contains the current field value for the user.
      required:
      - userId
      - value
      properties:
        userId:
          $ref: '#/components/schemas/uuid'
        value:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
    CountryCode:
      type:
      - string
      - 'null'
      description: Standard ISO 3166-1 alpha-2 two-letter country code
      pattern: ^[A-Z]{2}$
      example: US
      maxLength: 255
    CustomFieldValidationRules:
      type: object
      properties:
        unique:
          type: boolean
          description: If this field must be unique for every user in the environment
        regex:
          type: string
          maxLength: 255
          description: The regex pattern that the text field must match
          example: ^0x
        validOptions:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldValidValue'
          description: The dropdown options for the select field
          example:
          - label: small
          - label: medium
          - label: large
        checkboxText:
          type: string
          maxLength: 255
          description: The text that will be displayed for the checkbox field
          example: Agree to the terms and conditions
      description: Optional validation rules for the custom field
    WaasShareSet:
      type: object
      required:
      - shareSetId
      - shareSetType
      - thresholdSignatureScheme
      - createdAt
      properties:
        shareSetId:
          type: string
          format: uuid
          description: Identifier of the share set (WaasWallets row id).
        shareSetType:
          $ref: '#/components/schemas/WaasWalletShareSetType'
        thresholdSignatureScheme:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this share set was created.
    OptionalNullableNonEmptyStringWith255MaxLength:
      type:
      - string
      - 'null'
      pattern: ^$|^(?=\S)[\p{L}\p{N} _.,:!?&%@\/+-]+(?<=\S)$
      example: An example name
      maxLength: 255
    JwtVerifiedCredentialFormatEnum:
      type: string
      enum:
      - blockchain
      - email
      - oauth
      - passkey
      - phoneNumber
      - externalUser
      - totp
    WaasWalletProperties:
      type: object
      properties:
        keyShares:
          description: List of key share information for the primary share set (the one this auth principal signs with).
          type: array
          items:
            $ref: '#/components/schemas/WalletKeyShareInfo'
        thresholdSignatureScheme:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        derivationPath:
          type: string
          description: The derivation path for the wallet
        settings:
          $ref: '#/components/schemas/WaasWalletSettings'
        shareSetId:
          type: string
          format: uuid
          description: 'Identifier of the primary share set (the one whose `keyShares`, `thresholdSignatureScheme`, `derivationPath`, and `settings` are inlined at the top level). Browser context: rootUser. Delegated-server context: delegated.'
        shareSetType:
          $ref: '#/components/schemas/WaasWalletShareSetType'
        businessAccountId:
          type: string
          format: uuid
          description: Identifier of the business account that owns this wallet, when it is a business-account wallet; absent for personal wallets.
        otherShareSets:
          type: array
          description: All other active share sets that exist on this wallet (i.e., owned by other auth principals). Returned for awareness so consumers can see, e.g., that a delegated share set is set up alongside their rootUser. Server-typed share sets are never exposed.
          items:
            $ref: '#/components/schemas/WaasShareSet'
        version:
          $ref: '#/components/schemas/EmbeddedWalletVersionEnum'
    WalletKeyShareInfo:
      type: object
      required:
      - id
      - backupLocation
      - passwordEncrypted
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        backupLocation:
          description: Where this key share is stored (e.g. "user", "dynamic", "googleDrive", "iCloud")
          type: string
        passwordEncrypted:
          description: Whether this key share is additionally encrypted with a user-provided password
          type: boolean
        walletShareDeveloperKeyEncrypted:
          description: Whether this key share is encrypted with the developer's encryption public key
          type: boolean
        externalKeyShareId:
          $ref: '#/components/schemas/uuid'
        keygenId:
          description: Identifier of the key generation ceremony that produced this share
          type: string
    NonEmptyString:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
    EmbeddedWalletVersionEnum:
      type: string
      enum:
      - V1
      - V2
      - V3
    MergeUserConflict:
      type: object
      description: Contains a merge conflict between two users with different values for the same user field data
      required:
      - field
      - fromUser
      - currentUser
      properties:
        field:
          $ref: '#/components/schemas/ProjectSettingsKyc'
        fromUser:
          $ref: '#/components/schemas/MergeUser'
        currentUser:
          $ref: '#/components/schemas/MergeUser'
    UserOauthAccessTokenResponse:
      type: object
      required:
      - accessToken
      - scopes
      properties:
        accessToken:
          description: OAuth access token for the user's connected social account
          type: string
        scopes:
          description: OAuth scopes granted to the access token, as captured at the time of token issuance. Empty array when the provider did not surface scopes or when the token predates scope capture.
          type: array
          items:
            type: string
          example:
          - openid
          - email
          - profile
    WalletProviderEnum:
      type: string
      enum:
      - browserExtension
      - custodialService
      - walletConnect
      - qrCode
      - deepLink
      - embeddedWallet
      - smartContractWallet
    Session:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        createdAt:
          description: ISO 8601 timestamp of when the session was created
          type: string
          format: date-time
        ipAddress:
          description: IP address of the client that initiated the session
          type:
          - string
          - 'null'
        userAgent:
          description: User-Agent string of the client that initiated the session
          type:
          - string
          - 'null'
        revokedAt:
          description: ISO 8601 timestamp of when the session was revoked, or null if still active
          type:
          - string
          - 'null'
          format: date-time
    MfaBackupCodeAcknowledgement:
      type:
      - string
      - 'null'
      enum:
      - pending
      - complete
    InternalBulkUpdateUserFields:
      allOf:
      - $ref: '#/components/schemas/InternalUpdatableUserFields'
      - type: object
        properties:
          id:
            $ref: '#/components/schemas/uuid'
          emailVerifiedAt:
            type: string
            format: date-time
            description: When provided, the user email will be marked as verified in our system and the user will be allowed to sign in with that email. When social is enabled and the social provider has a verified email, we will automatically associate that social with the existing user.
          email:
            $ref: '#/components/schemas/updatableEmailOrEmptyString'
          wallets:
            description: List of wallets to create and link to this user in bulk
            type: array
            items:
              $ref: '#/components/schemas/CreateWalletRequest'
          oauthAccounts:
            description: List of OAuth accounts to create and link to this user in bulk
            type: array
            items:
              $ref: '#/components/schemas/CreateUserOauthRequest'
    Forbidden:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Access Forbidden
        code:
          description: Machine-readable reason for the 403, set only by endpoints that distinguish rejections. Flow endpoints use sanctions_blocked, session_token_invalid and risk_blocked.
          type: string
          example: sanctions_blocked
    WaasWalletSettings:
      type: object
      properties:
        hasDeniedDelegatedAccess:
          description: Whether the user has denied delegated access for this wallet
          type: boolean
        shouldRefreshOnNextSignOn:
          description: Whether to refresh wallet key shares on the user's next sign-on
          type: boolean
        reshareOnNextSignOn:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        revokeOnNextSignOn:
          description: Whether to revoke delegated access on the user's next sign-on
          type: boolean
        variant:
          $ref: '#/components/schemas/Ed25519Variant'
    WalletProperties:
      anyOf:
      - $ref: '#/components/schemas/TurnkeyWalletProperties'
      - $ref: '#/components/schemas/HardwareWalletProperties'
      - $ref: '#/components/schemas/CoinbaseMpcWalletProperties'
      - $ref: '#/components/schemas/SmartWalletProperties'
      - $ref: '#/components/schemas/WaasWalletProperties'
    NonEmptyStringWith255MaxLengthAndSpecialChars:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'()\[\]*]+(?<=\S)$
      maxLength: 255
      example: An example name
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
    ForbiddenWithErrorAndPayload:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenWithErrorAndPayload'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
  parameters:
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
    oauthAccountId:
      in: path
      name: oauthAccountId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of a user oauth account
    userId:
      in: path
      name: userId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of the user
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
