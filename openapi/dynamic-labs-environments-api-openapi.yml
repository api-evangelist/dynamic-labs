        iss:
          $ref: '#/components/schemas/OptionalNullableNonEmptyStringWith255MaxLength'
        aud:
          $ref: '#/components/schemas/OptionalNullableNonEmptyStringWith255MaxLength'
        jwksUrl:
          $ref: '#/components/schemas/OptionalNonEmptyUrl'
        cookieName:
          $ref: '#/components/schemas/OptionalNullableNonEmptyStringWith255MaxLength'
        assumeEmailVerified:
          description: When enabled, the backend treats a missing `emailVerified` claim on the external JWT as `true` during signin, so customers don't have to add the claim explicitly. An explicit `false` value is always respected. Defaults to false.
          type: boolean
        stepUpEnabled:
          description: When enabled, users in this environment can complete step-up verification with an assertion JWT minted by the customer's identity provider (`POST /sdk/{environmentId}/externalAuth/verify`). When disabled, that endpoint returns an error. Defaults to true.
          type: boolean
    TokenScopes:
      type: string
