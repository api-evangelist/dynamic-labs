    MFASettings:
      type: object
      properties:
        enabled:
          description: Whether multi-factor authentication is enforced at the session level (prompted at login).
          type: boolean
          x-security-impact:
            path: security.mfa.enabled
            weakenedWhen: when-false
            message: multi-factor authentication disabled
        required:
          description: 'Whether MFA enrollment is required. Derived from `enrollment` — true when enrollment is `signup` or `action`. Kept for backwards compatibility; new clients should read `enrollment` directly.

            '
          type: boolean
          x-security-impact:
            path: security.mfa.required
            weakenedWhen: when-false
            message: MFA no longer required for all users
        enrollment:
          $ref: '#/components/schemas/MfaEnrollment'
        availableMethods:
          description: List of MFA device types available for enrollment
          type: array
          items:
            $ref: '#/components/schemas/MFADeviceType'
        methods:
          description: List of MFA methods with their enabled status
          type: array
          items:
            type: object
            required:
            - type
            - enabled
            properties:
              type:
                $ref: '#/components/schemas/MFADeviceType'
              enabled:
                description: Whether this MFA method is enabled
                type: boolean
              allowBackupCodes:
                type:
                - boolean
                - 'null'
        actions:
          description: List of actions that require MFA verification
          type: array
          items:
            type: object
            required:
            - action
            - required
            properties:
              action:
                $ref: '#/components/schemas/MFAAction'
              required:
                description: Whether MFA is required for this action
                type: boolean
              tokenBehavior:
                type: string
                enum:
                - single_use
                - time_bound
                description: 'Whether the elevated access token is consumed after one use (single_use) or remains valid until expiry (time_bound). Defaults to single_use for wallet scopes, time_bound for others.

                  '
              tokenExpirySeconds:
                type: integer
                minimum: 60
                maximum: 600
                description: 'Custom TTL in seconds for the elevated access token. Defaults to 300 (5 min) for single_use, 600 (10 min) for time_bound.

                  '
