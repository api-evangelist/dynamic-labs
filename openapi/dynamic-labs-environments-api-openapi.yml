    NetworkConfiguration:
      type: object
      properties:
        lcdUrl:
          type: string
          example: https://lcd.osmosis.zone
          description: A light client, compared to a full node, tracks only pieces of certain information on a blockchain. Light clients do not track the entire state of a blockchain and also do not contain every transaction/block of a chain.
        chainName:
          type: string
          description: '[Deprecated] use `name` property instead'
          example: Ethereum Mainnet
        key:
          description: Unique key identifier for the network configuration
          type: string
          example: ethereum
        name:
          description: Full display name of the network
          type: string
          example: Ethereum Mainnet
        shortName:
          description: Abbreviated name of the network
          type: string
          example: ETH
        isTestnet:
          description: Whether this network is a test network
          type: boolean
          example: false
        chain:
          description: Chain identifier code
          type: string
          example: ETH
        chainId:
          description: Unique chain identifier (e.g. EIP-155 chain ID for EVM networks)
          type: string
          example: '1'
        nameService:
          $ref: '#/components/schemas/NameService'
        networkId:
          description: Network identifier used for routing and lookups
          type: string
          example: '1'
        iconUrls:
          description: List of URLs for the network icon images
          type: array
          items:
            type: string
        nativeCurrency:
          $ref: '#/components/schemas/NativeCurrency'
        rpcUrls:
          description: List of public RPC endpoint URLs for the network
          type: array
          items:
            type: string
            example: https://mainnet.infura.io/v3/
        privateCustomerRpcUrls:
          type: array
          description: Contains the client private RPC urls
          items:
            type: string
            example: https://mainnet.infura.io/v3/
        blockExplorerUrls:
          description: List of block explorer URLs for viewing transactions on this network
          type: array
          items:
            type: string
            example: https://etherscan.io/
        vanityName:
          description: Simplified display name for the network used in the UI
          type: string
          example: Ethereum
        bech32Prefix:
          description: Bech32 address prefix for Cosmos-based chains
          type: string
          example: cosmos
        genesisHash:
          description: Genesis hash of the network, used for Solana clusters
          type: string
          example: 5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
        cluster:
          description: Cluster name for Solana-based networks
          type: string
          example: mainnet, devnet, etc
        hasNativeToken:
          type: boolean
          default: true
          description: Whether this network has a native token. Defaults to true if not specified.
          example: true
        supportsFeeTokenSelection:
          type: boolean
          default: false
          description: Whether this network supports selecting a fee token for transactions. Defaults to false if not specified.
          example: false
      required:
      - name
      - shortName
      - chain
      - chainId
      - networkId
      - iconUrls
      - nativeCurrency
      - rpcUrls
      - blockExplorerUrls
    BusinessAccountProperties:
      type: object
      description: 'Business-account context attached to a verified credential that belongs to a business account. Present whenever `wallet_properties.shareSetType` is `businessAccountUser`; absent otherwise. Each field is namespaced by its source table so a caller reading the response sees exactly which entity the value came from (no ambiguity between member role and signer type, between business-account name and signer-derived names, etc.).

        '
      required:
      - businessAccountId
      - businessAccountCreatedAt
      - businessAccountSignerId
      - businessAccountSignerType
      - businessAccountMemberRole
      properties:
        businessAccountId:
          $ref: '#/components/schemas/uuid'
        businessAccountName:
          type:
          - string
          - 'null'
          description: Display name; user-supplied at create time. Nullable.
        businessAccountExternalRef:
          type:
          - string
          - 'null'
          description: Developer-supplied stable ID inside the env. Nullable.
        businessAccountCreatedAt:
          type: string
          format: date-time
        businessAccountSignerId:
          $ref: '#/components/schemas/uuid'
        businessAccountSignerType:
          $ref: '#/components/schemas/BusinessAccountSignerType'
        businessAccountMemberRole:
          $ref: '#/components/schemas/HeldBusinessAccountMemberRole'
    WalletConnectorKey:
