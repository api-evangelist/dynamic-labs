      maxLength: 255
      example: An example name
  parameters:
    screeningAmountUsd:
      in: query
      name: amountUsd
      required: false
      schema:
        type: number
        minimum: 0
      description: USD value of the transaction being screened for; supply it only when the amount is genuinely USD-denominated.
    projectId:
      name: projectId
      in: path
      required: true
      description: ID of project
      schema:
        $ref: '#/components/schemas/uuid'
    screeningAsset:
      in: query
      name: asset
      required: false
      schema:
        type: string
        maxLength: 64
      description: Asset the transaction is denominated in, evaluated on the same terms as amountUsd.
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
    screeningScope:
      in: query
      name: scope
      required: false
      schema:
        $ref: '#/components/schemas/ScreeningPolicyScopeEnum'
      description: Which of the environment's policies to evaluate against; defaults to TRANSACTION.
    screeningApplyPolicies:
      in: query
      name: applyPolicies
      required: false
      schema:
        type: boolean
      description: Defaults to true; false ignores the environment's screening rules and address entries, but not the cost rules deciding which providers are called.
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conflict'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
