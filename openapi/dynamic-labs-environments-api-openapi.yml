          description: Whether on-transaction sanction screening is enabled for connected wallets
          type: boolean
    HardwareWalletEnum:
      type: string
      enum:
      - ledger
    AdminActionRequest:
      description: An admin action that may require approval before execution. When approval mode is enabled, sensitive actions create a pending request. When disabled, actions are auto-approved with an audit record.
      type: object
      required:
      - id
      - organizationId
      - submittedById
      - status
      - actionType
      - displayName
      - category
      - actionPayload
      - requiredApprovals
      - currentApprovals
      - expiresAt
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          description: The organization this action belongs to.
          type: string
          format: uuid
        environmentId:
          description: The environment this action targets. Null for org-level actions.
          type:
          - string
          - 'null'
          format: uuid
        submittedById:
          description: The admin who initiated this action.
          type: string
          format: uuid
        submittedBy:
          $ref: '#/components/schemas/AdminActionRequestUser'
        responses:
          description: Review responses from admins, one row per reviewer per request. Under quorum, multiple approve responses may accumulate before the request reaches requiredApprovals and transitions to approved.
          type: array
          items:
            $ref: '#/components/schemas/AdminActionResponseItem'
        status:
          $ref: '#/components/schemas/AdminActionRequestStatus'
        actionType:
          $ref: '#/components/schemas/AdminActionType'
        displayName:
          description: Human-readable action label shown in the Activity Queue, e.g. "Reset MFA for alice@example.com" or "Environment Lock".
          type: string
        category:
          description: Grouping label for the Activity Queue table, e.g. "Security" or "User Management".
          type: string
        targetEntityType:
          description: The type of entity this action targets, e.g. "user" or "provider". Null for settings changes.
          type:
          - string
          - 'null'
        targetEntityId:
          description: The ID of the target entity. Null for settings changes.
          type:
          - string
          - 'null'
          format: uuid
        previousState:
          description: State before the change. Shape varies by actionType. Used for display and conflict detection.
          type:
          - object
          - 'null'
        actionPayload:
          description: What to apply when approved. Shape varies by actionType — for settings_change includes fullSettingsSnapshot, for reset_user_mfa includes userId and resetAll flag, for delete_user includes userId and email.
          type: object
        requiredApprovals:
          description: Number of distinct admin approvals needed to execute this request, snapshotted from the organization settings at creation time. Subsequent changes to the org setting do not affect in-flight requests.
          type: integer
        currentApprovals:
          description: Number of approvals received so far. The request transitions to approved when this reaches requiredApprovals. A single deny at any point transitions the request to denied regardless of this counter.
          type: integer
        expiresAt:
          description: When this request expires if still pending. Calculated as createdAt + TTL hours.
          type: string
          format: date-time
        resolvedAt:
          description: When the request was approved, denied, or expired. Null while pending.
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotFound:
      type: object
      required:
      - error
      - code
      properties:
        error:
          description: Human-readable error message
          type: string
