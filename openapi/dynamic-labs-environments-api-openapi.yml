openapi: 3.2.0
info:
  title: Dashboard Environments API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: Environments
  description: Manage environments (live and sandbox) where your authentication configuration lives.
paths:
  /environments/{environmentId}/wallet/sanctions:
    get:
      operationId: checkWalletSanctionsByEnvironmentId
      tags:
      - Environments
      summary: Check if a wallet address is sanctioned
      description: Check if a wallet address is sanctioned. Returns whether the wallet is blocked or not.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: query
        name: walletAddress
        required: true
        schema:
          $ref: '#/components/schemas/WalletPublicKey'
        description: The wallet address to check for sanctions
      - in: query
        name: chain
        required: true
        schema:
          $ref: '#/components/schemas/ChainEnum'
        description: The blockchain chain of the wallet
      - $ref: '#/components/parameters/screeningScope'
      - $ref: '#/components/parameters/screeningApplyPolicies'
      - $ref: '#/components/parameters/screeningAmountUsd'
      - $ref: '#/components/parameters/screeningAsset'
      responses:
        '200':
          description: Wallet sanctions check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletSanctionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}:
    x-auth-critical: true
    get:
      summary: Get an environment by ID
      description: Returns a single environment by its unique identifier.
      operationId: getEnvironmentById
      tags:
      - Environments
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Environment response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvironment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    put:
      operationId: updateProjectSettings
      x-cli-ignore: true
      tags:
      - Environments
      summary: Update the environment settings
      description: 'Updates the settings for the specified environment.


        When the organization has admin action approvals enabled and the update

        would weaken a step-up authentication protection, the change is not

        applied. It is filed as a `settings_change` admin action request and the

        endpoint returns `202` — the settings only take effect once another admin

        approves the request.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSettings'
      responses:
        '200':
          description: Project settings response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSettings'
        '202':
          description: The change requires admin approval and has been filed as a pending action request. The settings were not applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}/statistics/visitors:
    get:
      operationId: getVisitorsCountByEnvironmentId
      tags:
      - Environments
      summary: Get visitor statistics for the environment
      description: Returns visitor statistics for the specified environment.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Environment Unique Visitor Count Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVisitorsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}/keys:
    get:
      operationId: getKeysForEnvironment
      tags:
      - Environments
      summary: Get API keys for the environment
      description: Returns the API keys for the specified environment.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Environment Key response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Key not found
        '500':
          description: Error response
      security:
      - bearerAuth: []
  /environments/{environmentId}/lookup:
    get:
      operationId: getEnvironmentLocation
      tags:
      - Environments
      summary: Get the organization and project owning an environment
      description: Returns the organization and project that own the specified environment. Available to members of that organization.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Environment location response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /projects/{projectId}/environments:
    get:
      operationId: getEnvironmentsByProjectId
      tags:
      - Environments
      summary: Get environments for a project
      description: Returns the environments for the specified project.
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project environments response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}/verifyApiKey:
    post:
      operationId: verifyApiKey
      tags:
      - Environments
      summary: Verify if an API key is valid for a specific environment
      description: Simple endpoint to verify if the provided API key (DYN_API_TOKEN) is valid and has access to the specified environment. Returns true if the token is verified, false otherwise.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: API key verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasVerifyApiKeyResponse'
        '400':
          description: Bad request - token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasVerifyApiKeyErrorResponse'
        '401':
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasVerifyApiKeyErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    NativeCurrency:
      type: object
      properties:
        decimals:
          description: Number of decimal places the native currency supports
          type: number
          example: '18'
        name:
          description: Display name of the native currency
          type: string
          example: Ether
        symbol:
          description: Ticker symbol of the native currency
          type: string
          example: ETH
        denom:
          description: Denomination identifier used on Cosmos-based chains
          type: string
          example: uatom
        iconUrl:
          description: URL of the native currency icon image
          type: string
        pricingProviderTokenId:
          description: Token identifier used by the pricing provider for price lookups
          type: string
      required:
      - decimals
      - name
      - symbol
    SdkViewSectionAlignment:
      type: string
      enum:
      - center
      - left
      - right
    NameServiceData:
      type: object
      properties:
        avatar:
          description: URL of the avatar associated with the name service record
          type: string
        name:
          description: Resolved name from the name service (e.g. ENS name)
          type: string
    VerifiedCredentialId:
      description: UUID v4 with an optional -zerodev suffix for ZeroDev EIP-7702 smart-wallet credentials
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(-zerodev)?$
      minLength: 36
      maxLength: 45
      example: 95b11417-f18f-457f-8804-68e361f9164f-zerodev
    WaasBackupOptionsEnum:
      type: string
      enum:
      - googleDrive
      - iCloud
      - dynamic
      - external
      - delegated
      - offlineRecovery
    OptionalNonEmptyStringWith75MaxLength:
      type: string
      pattern: ^$|^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
      maxLength: 75
    ProjectSettingsSdk:
      type: object
      properties:
        nameService:
          $ref: '#/components/schemas/NameServiceSdkSettings'
        featureFlags:
          $ref: '#/components/schemas/FeatureFlags'
        emailSignIn:
          description: Email-based sign-in configuration settings
          type: object
          properties:
            signInProvider:
              $ref: '#/components/schemas/SignInProviderEnum'
        socialSignIn:
          description: Social sign-in provider configuration settings
          type: object
          properties:
            signInProvider:
              $ref: '#/components/schemas/SignInProviderEnum'
            providers:
              type: array
              items:
                $ref: '#/components/schemas/SocialSignInProvider'
        exchangeOptions:
          description: List of configured exchange options for token swaps
          type: array
          items:
            $ref: '#/components/schemas/ExchangeOption'
        multiWallet:
          description: Whether to allow users to connect multiple wallets
          type: boolean
        multiWalletUnlinkDisabled:
          description: Whether to disable the ability for users to unlink wallets in multi-wallet mode
          type: boolean
        mobile:
          $ref: '#/components/schemas/MobileSettings'
        confirmWalletTransfers:
          description: Whether to require confirmation for wallet transfer operations
          type: boolean
          x-security-impact:
            path: sdk.confirmWalletTransfers
            weakenedWhen: when-false
            message: wallet transfer confirmation removed
        onrampFunding:
          description: Whether to enable fiat-to-crypto onramp funding
          type: boolean
        passkeyEmbeddedWalletEnabled:
          type: boolean
          description: passkeyEmbeddedWalletEnabled is deprecated as of v0.19. Please enable embedded wallets using the provider API.
          deprecated: true
        automaticEmbeddedWalletCreation:
          description: Whether to automatically create an embedded wallet for new users
          type: boolean
        passkeyEmbeddedWalletRecoveryEnabled:
          description: Whether to enable passkey-based recovery for embedded wallets
          type: boolean
        embeddedWalletSecurityMethods:
          type: array
          description: Embedded wallet authenticator security methods required upon creation of the embedded wallet at onboarding
          items:
            $ref: '#/components/schemas/EmbeddedWalletSecurityMethod'
        embeddedWallets:
          description: Embedded wallet configuration settings
          type: object
          properties:
            automaticEmbeddedWalletCreation:
              type: boolean
              description: When true embedded wallets will be generated during onboarding for the users. When false customer needs to trigger the creation.
            automaticEmbeddedWalletCreationForExternal:
              type: boolean
              description: When true embedded wallets will be created for external wallets during sign in. When false embedded wallets are not generated for external wallets during sign in.
            showEmbeddedWalletActionsUI:
              type: boolean
              description: When true users will see embedded wallets action confirmation views.
            emailRecoveryEnabled:
              type: boolean
              description: When true users will be able to start recovery for their accounts.
            forceAuthenticatorAtSignup:
              type: boolean
              description: When true user will be prompted to add a security method during onboarding. When false user will need to add a security method before a transaction
            allowSkippingAuthenticatorAtSignup:
              type: boolean
              description: When combined with forceAuthenticatorAtSignup it allows user to skip adding a security method during onboarding. User will need to add it before a transaction.
            sessionKeyDuration:
              $ref: '#/components/schemas/Duration'
            supportedSecurityMethods:
              $ref: '#/components/schemas/SupportedSecurityMethods'
            chainConfigurations:
              $ref: '#/components/schemas/ChainConfigurations'
            domainEnabledByProvider:
              type: boolean
              description: When a client domain needs to be whitelisted explicitly by one of our embedded wallet providers, this will be true when Dynamic has confirmed that this is the case.
            defaultWalletVersion:
              $ref: '#/components/schemas/EmbeddedWalletVersionEnum'
            promptForKeyExport:
              type: boolean
              description: When true, the user will be prompted to export their private key after creating a wallet.
            transactionSimulation:
              type: boolean
              description: When true, user transactions will show asset transfers in the Confirmation UI.
            evmGasSponsorshipEnabled:
              type: boolean
              description: When true, EVM gas sponsorship is available for this environment.
            evmGasSponsorshipRelayMode:
              type: string
              enum:
              - clientAndServer
              - serverOnly
              description: Restricts who may submit EVM sponsored transactions. serverOnly rejects end-user (client) submissions; environment API token and server-auth submissions are still accepted. Defaults to clientAndServer.
            evmGasSponsorshipNetworks:
              type: array
              items:
                type: string
                pattern: ^(mainnet|testnet|\d+)$
              description: Restricts EVM gas sponsorship to specific networks. Use mainnet or testnet for every supported chain of that class, or a numeric chain id for a single chain. Absent or empty covers every supported chain.
            svmGasSponsorshipEnabled:
              type: boolean
              description: When true, network fees for Solana embedded wallet transactions will be sponsored.
        waas:
          description: Wallet-as-a-Service configuration settings
          type: object
          properties:
            allowMultipleWaasWalletsPerChain:
              type: boolean
              description: When true, users can have multiple WAAS wallets per chain.
            passcodeRequired:
              type: boolean
              description: When true, passcode security method is forced for v3 embedded wallets. Usually it is an optional security method.
            onSignUp:
              type: object
              properties:
                promptBackupOptions:
                  type: boolean
                  description: When true, backup options are shown during sign up for v3 embedded wallets.
                promptClientShareExport:
                  type: boolean
                  description: When true, users will be prompted to export their client share.
              required:
              - promptBackupOptions
              - promptClientShareExport
            backupOptions:
              type: array
              items:
                $ref: '#/components/schemas/WaasBackupOptionsEnum'
            iCloud:
              type: object
              description: Apple iCloud configuration for key share backup.
              properties:
                containerIdentifier:
                  type: string
                  description: The iCloud container identifier for storing key share backups.
                apiToken:
                  type: string
                  description: CloudKit Web Services API token for public operations.
                environment:
                  type: string
                  enum:
                  - development
                  - production
                  description: The CloudKit environment to use.
            relayUrl:
              type: string
              description: The URL of the relay server for the environment. If not provided, the default relay server will be used.
            delegatedAccessEndpoint:
              type: string
              description: 'Webhook URL where Dynamic delivers encrypted key shares for share-delivery flows.

                Despite the legacy name, this endpoint carries multiple event families:

                `wallet.delegation.*` (delegated access) and `wallet.offlineRecovery.created`

                (developer recovery share). Configure once; subscribers differentiate by

                `eventName` on the inbound payload. If not provided, neither feature can be enabled.

                '
            delegatedAccess:
              $ref: '#/components/schemas/ProjectSettingsSdkWaasDelegatedAccess'
            offlineRecovery:
              $ref: '#/components/schemas/ProjectSettingsSdkWaasOfflineRecovery'
            enableForwardMPCClient:
              type: boolean
              description: When true, the sdk will utilize the forward MPC client for select MPC operations.
            customKeyshareRelayBaseUrl:
              type: string
              description: When applicable, this is the custom base URL hostname to use for the WAAS keyshare backup relay. If not provided, the default will be used.
            exportDisabled:
              type: boolean
              description: When true, private key exports are disabled at both API and wallet enclave levels. When false (default), users can export their private keys from v3 embedded wallets.
            fireblocksMigration:
              type: object
              description: Fireblocks NCW backend configuration the SDK reads when migrating a Fireblocks embedded wallet into a Dynamic WaaS wallet.
              properties:
                backendBaseUrl:
                  type: string
                  description: Base URL of the Fireblocks NCW backend the SDK calls during migration.
                environment:
                  type: string
                  enum:
                  - sandbox
                  - production
                  description: The Fireblocks NCW environment to target.
          required:
          - passcodeRequired
          - onSignUp
          - backupOptions
        walletConnect:
          description: WalletConnect integration configuration settings
          type: object
          properties:
            projectId:
              type: string
            v2Enabled:
              type: boolean
            walletProjectId:
              type: string
        confirmEmailProviderForVerify:
          description: Whether to require email provider confirmation during verification
          type: boolean
          x-security-impact:
            path: sdk.confirmEmailProviderForVerify
            weakenedWhen: when-false
            message: email-provider confirmation during verification removed
        displayDynamicMessaging:
          description: Whether to display Dynamic branding messaging in the SDK
          type: boolean
        hideNetworkInDynamicWidget:
          description: Whether to hide the network selector in the Dynamic widget
          type: boolean
        minApiVersion:
          $ref: '#/components/schemas/MinApiVersionEnum'
        preventOrphanedAccounts:
          description: Whether to prevent users from removing their last authentication method
          type: boolean
          x-security-impact:
            path: sdk.preventOrphanedAccounts
            weakenedWhen: when-false
            message: orphaned-account prevention disabled
        views:
          type: array
          description: Configs used to create the views in the sdk.
          items:
            $ref: '#/components/schemas/SdkView'
        accountAbstraction:
          description: Account abstraction (ERC-4337) configuration settings
          type: object
          properties:
            allWallets:
              description: If set to false, will create smart wallets for embedded wallets only.
              type: boolean
            allUsers:
              description: If set to false, will create smart wallets for new users only.
              type: boolean
            separateSmartWalletAndSigner:
              description: if set to false, only smart wallet will be in user wallets list.
              type: boolean
            enablePasskeys:
              description: If set to false, will disable passkeys (if specified) for zksync wallets.
              type: boolean
        blockEmailSubaddresses:
          description: Whether to block email subaddresses (plus addressing) during sign-up
          type: boolean
          x-security-impact:
            path: sdk.blockEmailSubaddresses
            weakenedWhen: when-false
            message: email subaddress block disabled
        enableMultiAsset:
          description: Whether to enable multi-asset support in the wallet
          type: boolean
        showFiat:
          description: Whether to display fiat currency values in the wallet
          type: boolean
        disabledWalletConnectors:
          type: array
          description: Ids of wallet connectors to filter out from available options in the sdk
          items:
            $ref: '#/components/schemas/WalletConnectorKey'
        funding:
          $ref: '#/components/schemas/Funding'
    SdkUser:
      allOf:
      - $ref: '#/components/schemas/BaseUser'
      - type: object
        required:
        - verifiedCredentials
    ProjectSettingsChains:
      type: object
      properties:
        name:
          description: Display name of the chain
          type: string
        enabled:
          description: Whether this chain is enabled for the project
          type: boolean
        networks:
          description: List of network configurations for this chain
          type: array
          items:
            $ref: '#/components/schemas/Network'
      required:
      - name
      - enabled
    NonEmptyStringWith255MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      maxLength: 255
      example: An example name
    SdkViewSection:
      type: object
      description: A section used create the view in the sdk.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/SdkViewSectionType'
        label:
          type: string
          description: The label for the section. This will be displayed above the section or as part of the separator component if it is a Separator section.
        numOfItemsToDisplay:
          type: integer
          description: The deafult number of items to display in the section. For Wallet section, represents the number of wallet items to be displayed by default. User has to click a button to view more options if there are any. For Social section, represents the number of social providers to be displayed by default. User has to click a button to view more options if there are any.
        defaultItem:
          type: string
          description: The option to be displayed as the main one. The default item will be displayed in a more prominent way than the rest of the items in the section. For Wallet section, represents the wallet item to be displayed by default. For Social section, represents the social provider to be displayed by default.
        alignment:
          $ref: '#/components/schemas/SdkViewSectionAlignment'
    ProjectSettingsGeneralApps:
      type: object
      additionalProperties:
        type:
        - string
        - 'null'
        format: url
      example:
        slack: https://dynamic.xyz
        twitter: https://dynamic.xyz
    UnprocessableEntity:
      type: object
      properties:
        error:
          description: Human-readable error message describing the validation failure
          type: string
          example: Resources already exists for this Object
        code:
          $ref: '#/components/schemas/UnprocessableEntityErrorCode'
        payload:
          $ref: '#/components/schemas/UnprocessableEntityErrorPayload'
        retryAfterSeconds:
          description: Seconds the client should wait before retrying, present on rate-limit errors
          type: integer
          example: 600
      required:
      - error
    caip2:
      description: CAIP-2 Chain ID (https://github.com/ChainAgnostic/CAIPs/blob/main/CAIPs/caip-2.md)
      type: string
      pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
      minLength: 5
      maxLength: 41
      example: eip155:1
    ProjectSettingsPrivacy:
      type: object
      properties:
        collectIp:
          description: Whether to collect and store user IP addresses
          type: boolean
    HCaptchaSettings:
      type: object
      deprecated: true
      description: Deprecated — use `security.captcha` instead. Only populated when the environment's configured captcha provider is hCaptcha.
      properties:
        enabled:
          description: Whether hCaptcha verification is enabled
          type: boolean
          x-security-impact:
            path: security.hCaptcha.enabled
            weakenedWhen: when-false
            message: hCaptcha verification disabled
        secretKey:
          description: Secret key used to validate captcha response. This will never be surfaced in a GET response.
          type: string
        siteKey:
          description: Public site key used to render the hCaptcha widget
          type: string
    HeldBusinessAccountMemberRole:
      type: string
      description: 'The role a member actually holds: a built-in (`owner`, `admin`, `viewer`) or a customer-defined role the account has defined. Wider than AssignableBusinessAccountRoleName because a held role can be `owner`, which cannot be assigned directly.

        '
      pattern: ^[a-z0-9](?:[a-z0-9_-]{0,30}[a-z0-9])?$
      example: cfo
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    Provider:
      type: object
      required:
      - provider
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        enabledAt:
          description: ISO 8601 timestamp of when this provider was enabled
          type:
          - string
          - 'null'
          format: date-time
        clientId:
          description: 'Standard OAuth client ID. For more information, see: https://www.oauth.com/oauth2-servers/client-registration/client-id-secret/'
          type: string
        clientSecret:
          description: Provider secret. The OAuth client secret for OAuth-based providers (see https://www.oauth.com/oauth2-servers/client-registration/client-id-secret/); the API key for providers that authenticate by key (e.g., trmWalletScreening, chainalysisAddressScreening).
          type: string
        webhookSecret:
          description: Masked signing secret for verifying inbound webhooks from this provider (currently coinbaseOnramp only), returned as the last 3 characters only.
          type: string
        providerProjectId:
          description: Some providers require additional information, typically called a project ID or site ID
          type: string
        authorizationUrl:
          description: If the provider supports Oauth 2, this field will contain the URL of the login and authorization where a user can authorize the applciation to gain access to their provider account
          type: string
        redirectUrl:
          description: If the provider supports Oauth 2, this field will contain the URL of redirect or callback URL which will need to be provided to the Oauth provider to properly configure your App tp talk with Dynamic
          type: string
        defaultChainId:
          description: 'DEPRECATED: Use defaultChain. The default chain id the SDK should use'
          type: integer
        defaultChain:
          $ref: '#/components/schemas/caip2'
        keyExportUrl:
          description: The url of the site to go to export wallets private keys
          type: string
        termsAcceptedByUser:
          $ref: '#/components/schemas/ProviderAgreement'
        scopes:
          description: Optional custom space-delimited list of Oauth scopes for the social provider
          type: string
        baseAuthUrl:
          description: Base auth url for oauth provider
          type: string
