openapi: 3.2.0
info:
  title: Dashboard Yield API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: Yield
  description: List yield vaults registered for your environment.
paths:
  /environments/{environmentId}/yield/vaults:
    get:
      operationId: getEnvironmentVaults
      tags:
      - Yield
      security:
      - bearerAuth: []
      summary: Get the yield vaults for an environment
      description: Returns the yield vaults registered and accessible to the specified environment.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: List of yield vaults for this project environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YieldVaultListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    ChainEnum:
      type: string
      enum:
      - ETH
      - EVM
      - FLOW
      - SOL
      - ALGO
      - STARK
      - COSMOS
      - BTC
      - ECLIPSE
      - SUI
      - SPARK
      - TRON
      - APTOS
      - TON
      - STELLAR
      - ALEO
      - TEMPO
      - MIDNIGHT
    YieldVaultSummary:
      type: object
      required:
      - vaultId
      - curator
      - assetSymbol
      - assetAddress
      - chainId
      - provider
      properties:
        vaultId:
          type: string
          description: Opaque identifier for the vault, issued by the Dynamic dashboard.
        curator:
          type: string
          description: Name of the organization or team that curates this vault.
        assetSymbol:
          type: string
          description: Ticker symbol of the underlying asset (e.g. USDC).
        assetAddress:
          type: string
          description: Contract address of the underlying asset token.
        chainId:
          type: integer
          description: 'Numeric identifier of the network the vault is deployed on: the EVM chain ID, or the Solana cluster id (101 mainnet, 103 devnet).'
        chainName:
          $ref: '#/components/schemas/ChainEnum'
        provider:
          $ref: '#/components/schemas/YieldProviderEnum'
        netApy:
          type: number
          description: 'Net APY including reward incentives, as a decimal (e.g. 0.05 = 5%). Omitted when live data is unavailable.

            '
        tvlUsd:
          type: number
          description: 'Total value locked in USD. Omitted when live data is unavailable.

            '
    Forbidden:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Access Forbidden
        code:
          description: Machine-readable reason for the 403, set only by endpoints that distinguish rejections. Flow endpoints use sanctions_blocked, session_token_invalid and risk_blocked.
          type: string
          example: sanctions_blocked
    Unauthorized:
      type: object
      properties:
        error:
          description: Human-readable error message describing the authentication failure
          type: string
          example: No jwt provided!
    YieldProviderEnum:
      type: string
      enum:
      - MORPHO
      - AAVE
      - KAMINO
      description: Yield provider that manages the vault.
    InternalServerError:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Internal Server Error
    YieldVaultListResponse:
      type: object
      required:
      - vaults
      properties:
        vaults:
          type: array
          items:
            $ref: '#/components/schemas/YieldVaultSummary'
          description: List of yield vaults accessible to this environment.
  responses:
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
  parameters:
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Dynamic
  source: https://app.dynamic.xyz/api-docs/public-api.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
