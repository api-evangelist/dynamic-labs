          description: How many approvals are needed, excluding the initiator.
        completeWithinSeconds:
          type: integer
          description: 'Seconds from the signed intent in which the change must be both approved and executed. One deadline, not separate approve-by and execute-by clocks. Defaults to 30 days, the maximum allowed — an unconfigured account has expressed no opinion, so it isn''t given a shorter one.

