  /sdk/{environmentId}/yield/earnings:
    get:
      operationId: getYieldEarnings
      tags:
      - SDK
      summary: Get a wallet's earnings across all vaults on one chain
      description: Returns the wallet's earnings across every Morpho Vault V2 position it holds on the given chain, as a per-vault breakdown plus USD totals. Morpho only aggregates within a single chain, so `chainId` is required. Totals are USD-denominated because each vault's earnings are expressed in its own underlying asset and are therefore not additive. Positions in vaults this environment does not offer are still included, with a null `vaultId`.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - name: ownerAddress
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/WalletPublicKey'
        description: Wallet address whose earnings to query.
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
        description: EVM chain id to aggregate earnings on.
      responses:
        '200':
          description: Earnings across the wallet's vault positions on the chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YieldEarnings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
