              $ref: '#/components/schemas/FlowAttachSourceRequest'
      responses:
        '200':
          description: Source attached; session token minted
          headers:
            Cache-Control:
              schema:
                type: string
              description: Set to no-store to prevent caching of the one-time session token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowSourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
