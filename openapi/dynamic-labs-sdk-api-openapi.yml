          - string
          - 'null'
        emailNotification:
          description: Whether the user has opted in to email notifications
          type:
          - boolean
          - 'null'
        discordNotification:
          description: Whether the user has opted in to Discord notifications
          type:
          - boolean
          - 'null'
        newsletterNotification:
          description: Whether the user has opted in to newsletter notifications
          type:
          - boolean
          - 'null'
        lists:
          type: array
          description: Access lists evaluated by Dynamic when considering access for the user.
          items:
            type: string
        scope:
          type: string
          description: 'A whitespace-separate list of permissions associated with the JWT token issued. This conforms to the JWT standard for scope claims: https://datatracker.ietf.org/doc/html/rfc8693#section-4.2'
          example: superuser marketing operations
        missingFields:
          description: List of required user fields that have not yet been provided
          type: array
          items:
            $ref: '#/components/schemas/ProjectSettingsKyc'
    SponsorSVMTransactionRequest:
      type: object
      description: Request to sponsor a Solana transaction via Grid API
      properties:
        transaction:
          type: string
          pattern: ^[A-Za-z0-9+/]+={0,2}$
          description: Base64 encoded unsigned Solana transaction (versioned transaction format)
        userId:
          type: string
          format: uuid
          description: The end user this relay is sponsored for. Required for server-auth callers.
      required:
      - transaction
    FlowSettlementStateEnum:
      description: Settlement axis of a flow's state machine.
      type: string
      enum:
      - none
      - routing
      - bridging
      - swapping
      - settling
      - completed
      - failed
    MobileSettings:
      type: object
      properties:
        deeplinkUrlsEnabled:
          type: boolean
          description: Whether to enable whitelisting mobile deeplink URLs, which will be used for redirecting back to the mobile app. Is required for many features such as social sign in.
          x-security-impact:
            path: sdk.mobile.deeplinkUrlsEnabled
            weakenedWhen: when-false
            message: mobile deeplink URL whitelist disabled
    BusinessAccountForbidden:
      allOf:
      - $ref: '#/components/schemas/Forbidden'
      - type: object
        description: 'Carries the requirement tallies when the caller is authorized but consent is outstanding, which is a different thing from being refused outright.

          '
        properties:
          approvalRequirements:
            type: array
            items:
              $ref: '#/components/schemas/BusinessAccountApprovalRequirementStatus'
    AddBusinessAccountSignerSdkRequest:
      description: 'SDK addSigner body. Same user resolution shape as addMember (userId OR identifier + type), plus `signerType` for the signer-role enum (endUser/server). `type` here is the user-resolution type, NOT the signer type — `signerType` lives on a dedicated field. `smsCountryCode` is required when `type` is `phoneNumber`; `socialProvider` is required when `type` is `socialUsername` or `socialAccountId`.

        The remaining fields parameterise the MPC reshare ceremony that runs during the SSE response. `clientKeygenIds` come from the caller''s local MPC state (the JS SDK obtains them internally by calling `exportID()` on the existing client share); the threshold scheme fields describe the source share set (old) and the destination share set (new) that the ceremony produces.

        '
      allOf:
      - $ref: '#/components/schemas/BusinessAccountMemberSelection'
      - type: object
        required:
        - signerType
        - clientKeygenIds
        - oldThresholdSignatureScheme
        - newThresholdSignatureScheme
        properties:
          signerType:
            $ref: '#/components/schemas/BusinessAccountSignerType'
          clientKeygenIds:
            description: Caller's MPC keygen IDs participating in the reshare.
            type: array
            items:
              type: string
          oldThresholdSignatureScheme:
            $ref: '#/components/schemas/ThresholdSignatureScheme'
          newThresholdSignatureScheme:
            $ref: '#/components/schemas/ThresholdSignatureScheme'
          initialSignerRules:
            description: 'Optional Rules to seed the new signer''s signer-Layer with at

              add-signer time, so the signer is restricted from its first sign.

              Only valid when policy composition is enabled and the wallet is a

              composition wallet (env/wallet Layers exist); if supplied otherwise

              the request is rejected with 422 rather than creating an unrestricted

              signer. Rule shape mirrors the signer self-service policy-layer schema.

              '
            type: array
            items:
              $ref: '#/components/schemas/WaasPolicyRule'
    AuthenticationExtensionsClientInputs:
      type: object
      properties:
        appid:
          description: FIDO AppID extension input for backward compatibility with U2F
          type: string
        credProps:
          description: Whether to request credential properties from the authenticator
          type: boolean
        hmacCreateSecret:
          description: Whether to create an HMAC secret with the authenticator
          type: boolean
    LastVerifiedCredentialId:
      description: ID of the most recently used verified credential. This would refer to a value in the verified credentials list
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(-zerodev)?$
      minLength: 36
      maxLength: 45
      example: 95b11417-f18f-457f-8804-68e361f9164f-zerodev
    SwapQuoteRequestSide:
      type: object
      required:
