          description: The roles defined on this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountRolesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    post:
      operationId: sdkDefineBusinessAccountRole
      tags:
      - SDK
      summary: SDK — define a customer role for a business account
      description: 'Defines a role that inherits a built-in one. The role lives only in the

        signed authorization document, so there is no separate role resource.

        Requires step-up authentication.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineBusinessAccountRoleSdkRequest'
      responses:
        '201':
          description: Role defined; the new document version returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMutationVersion'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/roles/{role}:
    delete:
      operationId: sdkDeleteBusinessAccountRole
      tags:
