        clientDataJSON:
          $ref: '#/components/schemas/NonEmptyString'
        attestationObject:
          $ref: '#/components/schemas/NonEmptyString'
        authenticatorData:
          $ref: '#/components/schemas/NonEmptyString'
        publicKeyAlgorithm:
          description: COSE algorithm identifier for the credential public key
          type: number
        publicKey:
          $ref: '#/components/schemas/NonEmptyString'
    MergeUser:
      type: object
      description: Contains the current field value for the user.
      required:
      - userId
      - value
      properties:
        userId:
          $ref: '#/components/schemas/uuid'
        value:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
    CountryCode:
      type:
      - string
      - 'null'
      description: Standard ISO 3166-1 alpha-2 two-letter country code
      pattern: ^[A-Z]{2}$
      example: US
      maxLength: 255
    EmbeddedWalletAuthType:
      type: string
      enum:
      - mpc
    WaasBroadcastEvmFee:
      type: object
      description: One fee. Either `gasPrice`, or `maxFeePerGas` with `maxPriorityFeePerGas`; both styles together are rejected with `ambiguous_fee_style`.
      additionalProperties: false
      properties:
        gasPrice:
          $ref: '#/components/schemas/WaasHexQuantity'
        maxFeePerGas:
          $ref: '#/components/schemas/WaasHexQuantity'
        maxPriorityFeePerGas:
          $ref: '#/components/schemas/WaasHexQuantity'
    AssetTransfer:
      type: object
      properties:
        rawValue:
          description: Raw token amount before decimal adjustment
          type: string
        summary:
          description: Human-readable summary of the transfer
          type: string
        usdPrice:
          description: Estimated USD value of the transferred amount
          type: string
        value:
          description: Decimal-adjusted token amount
          type: string
    WalletTransactionAssetTransfer:
      type: object
      required:
      - fromAddress
      - toAddress
      - amount
      properties:
        tokenAddress:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        fromAddress:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        toAddress:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        amount:
          type: number
          description: Amount of the asset transferred
        metadata:
          description: Additional metadata about the asset transfer
          type: object
          properties:
            name:
              type: string
              description: Name of the asset
            symbol:
              type: string
              description: Symbol of the asset
            decimals:
              type: number
              description: Decimals of the asset
            imageUri:
              type: string
              description: Logo URI of the asset
    NoncesResponse:
      type: object
      required:
      - nonces
      properties:
        nonces:
          description: List of nonce values for multi-wallet authentication
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 5
    CustomFieldValidationRules:
      type: object
      properties:
        unique:
          type: boolean
          description: If this field must be unique for every user in the environment
        regex:
          type: string
          maxLength: 255
          description: The regex pattern that the text field must match
          example: ^0x
        validOptions:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldValidValue'
          description: The dropdown options for the select field
          example:
          - label: small
          - label: medium
          - label: large
        checkboxText:
          type: string
          maxLength: 255
          description: The text that will be displayed for the checkbox field
          example: Agree to the terms and conditions
      description: Optional validation rules for the custom field
    AccountBalances:
      type: object
      required:
      - currency
      - balance
      properties:
        currency:
          type: string
          description: Chain symbol that funds are denominated in.
          example: USDC
        balance:
          type: number
          description: amount held in associated currency
        availableBalance:
          type: number
          description: Funds immediately available for withdrawal or trading
        logoURI:
          description: URL of the token or currency logo image
          type: string
    SignMessageSvmTransaction:
      type: object
      description: Solana serialized transactions
      properties:
        chainId:
          type: string
          description: Chain identifier
        method:
          type: string
          description: Method identifier
        serializedTransactions:
          type: array
          items:
            type: string
          description: Array of serialized transaction strings
      required:
      - chainId
      - method
      - serializedTransactions
    EncryptedWalletApiKey:
      type: object
      description: 'A payload sealed by the enclave to the environment''s delegated-access RSA public key (HYBRID-RSA-AES-256). Only the developer''s private key opens it; redcoast stores and relays it without ever resolving the contents. Structurally identical to DelegatedShareDeliveryRequest''s inline `encryptedDelegatedShare` below — the two should be merged into this one the next time the generated `DelegatedShareDeliveryRequestEncryptedDelegatedShare` type can be renamed across its call sites.

        '
      required:
      - alg
      - iv
      - ct
      - tag
      - ek
      properties:
        alg:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        iv:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        ct:
          $ref: '#/components/schemas/NonEmptyStringWith4096MaxLength'
        tag:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        ek:
          $ref: '#/components/schemas/NonEmptyStringWith4096MaxLength'
        kid:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
    WaasWalletProperties:
      type: object
      properties:
        keyShares:
          description: List of key share information for the primary share set (the one this auth principal signs with).
          type: array
          items:
            $ref: '#/components/schemas/WalletKeyShareInfo'
        thresholdSignatureScheme:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        derivationPath:
          type: string
          description: The derivation path for the wallet
        settings:
          $ref: '#/components/schemas/WaasWalletSettings'
        shareSetId:
          type: string
          format: uuid
          description: 'Identifier of the primary share set (the one whose `keyShares`, `thresholdSignatureScheme`, `derivationPath`, and `settings` are inlined at the top level). Browser context: rootUser. Delegated-server context: delegated.'
        shareSetType:
          $ref: '#/components/schemas/WaasWalletShareSetType'
        businessAccountId:
          type: string
          format: uuid
          description: Identifier of the business account that owns this wallet, when it is a business-account wallet; absent for personal wallets.
        otherShareSets:
          type: array
          description: All other active share sets that exist on this wallet (i.e., owned by other auth principals). Returned for awareness so consumers can see, e.g., that a delegated share set is set up alongside their rootUser. Server-typed share sets are never exposed.
          items:
            $ref: '#/components/schemas/WaasShareSet'
        version:
          $ref: '#/components/schemas/EmbeddedWalletVersionEnum'
    EmbeddedWalletSecret:
      type: object
      required:
      - walletId
      - secret
      properties:
        walletId:
          $ref: '#/components/schemas/uuid'
        secret:
          description: Encrypted secret material for the embedded wallet
          type: string
        source:
          $ref: '#/components/schemas/PasswordSourceTypeEnum'
    WalletKeyShareInfo:
      type: object
      required:
      - id
      - backupLocation
      - passwordEncrypted
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        backupLocation:
          description: Where this key share is stored (e.g. "user", "dynamic", "googleDrive", "iCloud")
          type: string
        passwordEncrypted:
          description: Whether this key share is additionally encrypted with a user-provided password
          type: boolean
        walletShareDeveloperKeyEncrypted:
          description: Whether this key share is encrypted with the developer's encryption public key
          type: boolean
        externalKeyShareId:
          $ref: '#/components/schemas/uuid'
        keygenId:
          description: Identifier of the key generation ceremony that produced this share
          type: string
    BusinessAccountProposalStatus:
      type: string
      description: 'Lifecycle of a governed mutation awaiting approvals. Only `pending` accepts approvals; the other three are terminal.

        '
      enum:
      - pending
      - executed
      - vetoed
      - expired
    CoinbaseOnrampGetBuyUrlRequest:
      type: object
      required:
      - destinationAddress
      - networks
      properties:
        assets:
          description: List of asset symbols available for purchase
          type: array
          items:
            $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        defaultNetwork:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        defaultAsset:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        defaultExperience:
          $ref: '#/components/schemas/CoinbaseOnrampBuyUrlExperience'
        defaultPaymentMethod:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        destinationAddress:
          $ref: '#/components/schemas/WalletPublicKey'
        fiatCurrency:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        handlingRequestedUrls:
          type: boolean
          description: Prevents the widget from opening URLs directly & relies on onRequestedUrl entirely for opening links
        networks:
          description: List of blockchain networks available for delivery
          type: array
          items:
            $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        partnerUserRef:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        presetCryptoAmount:
          $ref: '#/components/schemas/NonEmptyAmountString'
        presetFiatAmount:
          $ref: '#/components/schemas/NonEmptyAmountString'
        redirectUrl:
          $ref: '#/components/schemas/OptionalNonEmptyUrlWithLocalhostAndDeepLink'
    BusinessAccountGovernedAction:
      type: string
      description: A business-account action that an approval requirement can gate.
      enum:
      - addMember
      - removeMember
      - updateMemberRole
      - transferOwnership
      - createWallet
      - linkWallet
      - removeWallet
      - addSignerToWallet
      - removeSignerFromWallet
      - updatePolicyLayer
      - setGovernance
      - defineRole
      - deleteRole
      - signMessage
      - exportWallet
    FlowRiskStateEnum:
      description: Risk-screening axis of a flow's state machine.
      type: string
      enum:
      - unknown
      - pending
      - cleared
      - blocked
      - review
    ProjectSettingsSdkWaasOfflineRecovery:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether offline recovery share delivery is enabled for the environment. When enabled, encrypted recovery shares are delivered to the configured share-delivery webhook so the developer can help users reconstruct their wallet offline. Recovery shares cannot be used to sign.
    SwapSigningPayload:
      type: object
      required:
      - chainName
      - chainId
      properties:
        chainName:
          $ref: '#/components/schemas/ChainEnum'
        chainId:
          type: string
          description: Source chain identifier
        evmTransaction:
          $ref: '#/components/schemas/SwapEvmTransactionData'
        evmApproval:
          $ref: '#/components/schemas/SwapEvmApprovalData'
        serializedTransaction:
          type: string
          description: Base64-encoded serialized transaction
        psbt:
          type: string
          description: Base64-encoded unsigned PSBT
        tronTransaction:
          $ref: '#/components/schemas/SwapTronTransactionData'
      description: 'Chain-aware signing payload. Which fields are populated depends on chainName: EVM uses evmTransaction + optional evmApproval. SOL and SUI use serializedTransaction. BTC uses psbt. TRON uses tronTransaction.

        '
    CoinbaseOnrampOrderResponse:
      type: object
      required:
      - order
      properties:
        order:
          $ref: '#/components/schemas/CoinbaseOnrampOrder'
        paymentLink:
          description: Payment link details for completing the purchase
          type: object
          required:
          - url
          - paymentLinkType
          properties:
            url:
              type: string
              description: The URL to the hosted widget the user should be redirected to. For certain payment link types you can append your own redirect_url query parameter to this URL to ensure the user is redirected back to your app after the widget completes.
              example: https://pay.coinbase.com/v2/api-onramp/apple-pay?sessionToken=MWYwNWQwODktZTZlYy02OTdlLTgzZTYtMTI3NzcyOWJhNjM3
            paymentLinkType:
              $ref: '#/components/schemas/CoinbaseOnrampOrderPaymentLinkType'
    EmailVerificationVerifyRequest:
      required:
      - verificationUUID
      - verificationToken
      type: object
      properties:
        verificationUUID:
          $ref: '#/components/schemas/uuid'
        verificationToken:
          $ref: '#/components/schemas/sixDigitsVerificationToken'
        captchaToken:
          $ref: '#/components/schemas/captchaToken'
        sessionPublicKey:
          $ref: '#/components/schemas/NonEmptyString'
        requestedScopes:
          $ref: '#/components/schemas/RequestedScopes'
        allowNewMFALinking:
          type: boolean
          description: 'When true on a sign-in request, the server returns an elevated access token with credential:link scope if MFA is optional and the user has no MFA methods registered. Ignored on post-login verify requests.

            '
    OauthProviderLoginUrl:
      type: object
      required:
      - url
      properties:
        url:
          description: OAuth authorization URL to redirect the user to for login
          type: string
          format: url
  responses:
    BusinessAccountApprovalsPending:
      description: 'Governed and not yet authorized — sign the intent, or collect the approvals `approvalRequirements` names, then resend. Not a failure.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessAccountApprovalsPending'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
    BadGateway:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadGateway'
    BusinessAccountForbidden:
      description: 'Forbidden. Carries the outstanding approval requirements when the caller is authorized but consent is incomplete.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessAccountForbidden'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequests'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
    ForbiddenWithErrorAndPayload:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenWithErrorAndPayload'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Conflict'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
