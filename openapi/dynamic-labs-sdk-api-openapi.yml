          description: Arbitrary key-value metadata associated with the user
          type: object
        mfaBackupCodeAcknowledgement:
          $ref: '#/components/schemas/MfaBackupCodeAcknowledgement'
        btcWallet:
          description: Bitcoin wallet address of the user
          type:
          - string
