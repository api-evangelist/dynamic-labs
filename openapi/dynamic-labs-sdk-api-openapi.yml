        targetUserIds:
          type: array
          description: Matches the user the change targets.
          items:
            $ref: '#/components/schemas/uuid'
        initiatorRoles:
          type: array
          description: Matches the role the caller holds.
          items:
            type: string
        initiatorUserIds:
          type: array
