        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /sdk/{environmentId}/yield/vaults/{vaultId}/deposit:
    post:
      operationId: yieldVaultDeposit
      tags:
      - SDK
      summary: Build a vault deposit signing payload
      description: 'Builds an unsigned deposit signing payload for the given vault and wallet address. The SDK signs and sends the payload''s steps in order: any approval first, then the deposit.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - name: vaultId
        in: path
