        requestedScopes:
          $ref: '#/components/schemas/RequestedScopes'
    ProjectSettingsSdkWaasDelegatedAccess:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether delegated access is enabled for the environment. If enabled, developer can trigger user to accept delegated access.
        promptUsersOnSignIn:
          type: boolean
          description: Prompt for delegated access when user logs in.
        requiresDelegation:
          type: boolean
          description: If enabled, users will be required to delegate access.
    origin:
      type: string
      pattern: ^(https?|chrome-extension|moz-extension|capacitor):\/\/(?!.*(\*).*(\*).*)[*a-zA-Z0-9._-]{1,256}(:[*0-9]{1,5})?$
      description: An [RFC 6454](https://www.rfc-editor.org/rfc/rfc6454) valid url. Must not include any paths. A single wildcard (*) can be used as the first subdomain.
      example: http://*.example.com
    StepUpCredential:
      type: object
      required:
      - id
      - format
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the credential
        format:
          $ref: '#/components/schemas/JwtVerifiedCredentialFormatEnum'
        type:
          type: string
          description: The specific credential type (e.g. totp, passkey). Distinguishes MFA device types that share the same format.
        alias:
          type: string
          description: The user-friendly name of the credential
    AuthModeEnum:
      type: string
      enum:
      - connect-only
      - connect-and-sign
    OptionalNonEmptyStringWith255MaxLength:
      type: string
      pattern: ^$|^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
      maxLength: 255
    SponsorEVMTransactionRequest:
      type: object
      description: Request to sponsor an EVM transaction via gasless relay
      properties:
        authorization:
          description: Optional EIP-7702 authorization for first-time delegation
          allOf:
          - $ref: '#/components/schemas/EIP7702Authorization'
        calls:
          type: array
          description: Array of calls to execute
          items:
            type: object
            properties:
              data:
                type: string
                pattern: ^0x[a-fA-F0-9]*$
                description: Hex-encoded calldata
              target:
                type: string
                pattern: ^0x[a-fA-F0-9]{40}$
                description: Target contract address
              value:
                type: string
                description: Value in wei as string
            required:
            - data
            - target
            - value
        chainId:
          type: integer
          description: Target chain ID
        deadline:
          type: string
          description: Unix timestamp deadline for the intent
        nonce:
          type: string
          description: Nonce for the intent signature
        signature:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
          description: Hex-encoded EIP-712 intent signature
        relayer:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Relayer contract address (signed as relayer in EIP-712 intent)
        userId:
          type: string
          format: uuid
          description: The end user this relay is sponsored for. Required for server-auth callers.
        walletAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: User wallet address
      required:
      - calls
      - chainId
      - deadline
      - nonce
      - signature
      - relayer
      - walletAddress
    SetBusinessAccountGovernanceSdkRequest:
      type: object
      description: 'SDK setGovernance body. Replaces the whole section, so an absent governance field is refused rather than read as a request to delete every requirement — send an empty object to clear.

        '
      required:
      - governance
      properties:
        governance:
          $ref: '#/components/schemas/BusinessAccountGovernance'
        autoExecute:
