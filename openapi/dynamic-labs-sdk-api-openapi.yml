        passkeyEmbeddedWalletRecoveryEnabled:
          description: Whether to enable passkey-based recovery for embedded wallets
          type: boolean
        embeddedWalletSecurityMethods:
          type: array
          description: Embedded wallet authenticator security methods required upon creation of the embedded wallet at onboarding
          items:
            $ref: '#/components/schemas/EmbeddedWalletSecurityMethod'
        embeddedWallets:
          description: Embedded wallet configuration settings
          type: object
          properties:
            automaticEmbeddedWalletCreation:
              type: boolean
              description: When true embedded wallets will be generated during onboarding for the users. When false customer needs to trigger the creation.
            automaticEmbeddedWalletCreationForExternal:
              type: boolean
              description: When true embedded wallets will be created for external wallets during sign in. When false embedded wallets are not generated for external wallets during sign in.
            showEmbeddedWalletActionsUI:
              type: boolean
              description: When true users will see embedded wallets action confirmation views.
            emailRecoveryEnabled:
              type: boolean
              description: When true users will be able to start recovery for their accounts.
            forceAuthenticatorAtSignup:
              type: boolean
              description: When true user will be prompted to add a security method during onboarding. When false user will need to add a security method before a transaction
            allowSkippingAuthenticatorAtSignup:
              type: boolean
              description: When combined with forceAuthenticatorAtSignup it allows user to skip adding a security method during onboarding. User will need to add it before a transaction.
            sessionKeyDuration:
              $ref: '#/components/schemas/Duration'
            supportedSecurityMethods:
              $ref: '#/components/schemas/SupportedSecurityMethods'
            chainConfigurations:
              $ref: '#/components/schemas/ChainConfigurations'
            domainEnabledByProvider:
              type: boolean
              description: When a client domain needs to be whitelisted explicitly by one of our embedded wallet providers, this will be true when Dynamic has confirmed that this is the case.
            defaultWalletVersion:
              $ref: '#/components/schemas/EmbeddedWalletVersionEnum'
            promptForKeyExport:
              type: boolean
              description: When true, the user will be prompted to export their private key after creating a wallet.
            transactionSimulation:
              type: boolean
              description: When true, user transactions will show asset transfers in the Confirmation UI.
            evmGasSponsorshipEnabled:
              type: boolean
              description: When true, EVM gas sponsorship is available for this environment.
            evmGasSponsorshipRelayMode:
              type: string
              enum:
              - clientAndServer
              - serverOnly
              description: Restricts who may submit EVM sponsored transactions. serverOnly rejects end-user (client) submissions; environment API token and server-auth submissions are still accepted. Defaults to clientAndServer.
            evmGasSponsorshipNetworks:
              type: array
              items:
                type: string
                pattern: ^(mainnet|testnet|\d+)$
              description: Restricts EVM gas sponsorship to specific networks. Use mainnet or testnet for every supported chain of that class, or a numeric chain id for a single chain. Absent or empty covers every supported chain.
            svmGasSponsorshipEnabled:
              type: boolean
              description: When true, network fees for Solana embedded wallet transactions will be sponsored.
        waas:
          description: Wallet-as-a-Service configuration settings
          type: object
          properties:
            allowMultipleWaasWalletsPerChain:
              type: boolean
              description: When true, users can have multiple WAAS wallets per chain.
            passcodeRequired:
              type: boolean
              description: When true, passcode security method is forced for v3 embedded wallets. Usually it is an optional security method.
            onSignUp:
              type: object
              properties:
                promptBackupOptions:
                  type: boolean
                  description: When true, backup options are shown during sign up for v3 embedded wallets.
                promptClientShareExport:
                  type: boolean
                  description: When true, users will be prompted to export their client share.
              required:
              - promptBackupOptions
              - promptClientShareExport
            backupOptions:
              type: array
              items:
                $ref: '#/components/schemas/WaasBackupOptionsEnum'
            iCloud:
              type: object
              description: Apple iCloud configuration for key share backup.
              properties:
                containerIdentifier:
                  type: string
                  description: The iCloud container identifier for storing key share backups.
                apiToken:
                  type: string
                  description: CloudKit Web Services API token for public operations.
                environment:
                  type: string
                  enum:
                  - development
                  - production
                  description: The CloudKit environment to use.
            relayUrl:
              type: string
              description: The URL of the relay server for the environment. If not provided, the default relay server will be used.
            delegatedAccessEndpoint:
              type: string
              description: 'Webhook URL where Dynamic delivers encrypted key shares for share-delivery flows.

                Despite the legacy name, this endpoint carries multiple event families:

                `wallet.delegation.*` (delegated access) and `wallet.offlineRecovery.created`

                (developer recovery share). Configure once; subscribers differentiate by

                `eventName` on the inbound payload. If not provided, neither feature can be enabled.

                '
            delegatedAccess:
              $ref: '#/components/schemas/ProjectSettingsSdkWaasDelegatedAccess'
            offlineRecovery:
              $ref: '#/components/schemas/ProjectSettingsSdkWaasOfflineRecovery'
            enableForwardMPCClient:
              type: boolean
              description: When true, the sdk will utilize the forward MPC client for select MPC operations.
            customKeyshareRelayBaseUrl:
              type: string
              description: When applicable, this is the custom base URL hostname to use for the WAAS keyshare backup relay. If not provided, the default will be used.
            exportDisabled:
              type: boolean
              description: When true, private key exports are disabled at both API and wallet enclave levels. When false (default), users can export their private keys from v3 embedded wallets.
            fireblocksMigration:
              type: object
              description: Fireblocks NCW backend configuration the SDK reads when migrating a Fireblocks embedded wallet into a Dynamic WaaS wallet.
              properties:
                backendBaseUrl:
                  type: string
                  description: Base URL of the Fireblocks NCW backend the SDK calls during migration.
                environment:
                  type: string
                  enum:
                  - sandbox
                  - production
                  description: The Fireblocks NCW environment to target.
          required:
          - passcodeRequired
          - onSignUp
          - backupOptions
        walletConnect:
          description: WalletConnect integration configuration settings
          type: object
          properties:
            projectId:
              type: string
            v2Enabled:
              type: boolean
            walletProjectId:
              type: string
        confirmEmailProviderForVerify:
          description: Whether to require email provider confirmation during verification
          type: boolean
          x-security-impact:
            path: sdk.confirmEmailProviderForVerify
            weakenedWhen: when-false
            message: email-provider confirmation during verification removed
        displayDynamicMessaging:
          description: Whether to display Dynamic branding messaging in the SDK
          type: boolean
        hideNetworkInDynamicWidget:
          description: Whether to hide the network selector in the Dynamic widget
          type: boolean
        minApiVersion:
          $ref: '#/components/schemas/MinApiVersionEnum'
        preventOrphanedAccounts:
          description: Whether to prevent users from removing their last authentication method
          type: boolean
          x-security-impact:
            path: sdk.preventOrphanedAccounts
            weakenedWhen: when-false
            message: orphaned-account prevention disabled
        views:
          type: array
          description: Configs used to create the views in the sdk.
          items:
            $ref: '#/components/schemas/SdkView'
        accountAbstraction:
          description: Account abstraction (ERC-4337) configuration settings
          type: object
          properties:
            allWallets:
              description: If set to false, will create smart wallets for embedded wallets only.
              type: boolean
            allUsers:
              description: If set to false, will create smart wallets for new users only.
              type: boolean
            separateSmartWalletAndSigner:
              description: if set to false, only smart wallet will be in user wallets list.
              type: boolean
            enablePasskeys:
              description: If set to false, will disable passkeys (if specified) for zksync wallets.
              type: boolean
        blockEmailSubaddresses:
          description: Whether to block email subaddresses (plus addressing) during sign-up
          type: boolean
          x-security-impact:
            path: sdk.blockEmailSubaddresses
            weakenedWhen: when-false
            message: email subaddress block disabled
        enableMultiAsset:
          description: Whether to enable multi-asset support in the wallet
          type: boolean
        showFiat:
          description: Whether to display fiat currency values in the wallet
          type: boolean
        disabledWalletConnectors:
          type: array
          description: Ids of wallet connectors to filter out from available options in the sdk
          items:
            $ref: '#/components/schemas/WalletConnectorKey'
        funding:
          $ref: '#/components/schemas/Funding'
    SdkViewSection:
      type: object
      description: A section used create the view in the sdk.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/SdkViewSectionType'
        label:
          type: string
          description: The label for the section. This will be displayed above the section or as part of the separator component if it is a Separator section.
        numOfItemsToDisplay:
          type: integer
          description: The deafult number of items to display in the section. For Wallet section, represents the number of wallet items to be displayed by default. User has to click a button to view more options if there are any. For Social section, represents the number of social providers to be displayed by default. User has to click a button to view more options if there are any.
        defaultItem:
          type: string
          description: The option to be displayed as the main one. The default item will be displayed in a more prominent way than the rest of the items in the section. For Wallet section, represents the wallet item to be displayed by default. For Social section, represents the social provider to be displayed by default.
        alignment:
          $ref: '#/components/schemas/SdkViewSectionAlignment'
    SignMessageEip7702Auth:
