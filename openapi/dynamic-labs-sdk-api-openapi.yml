  /sdk/{environmentId}/yield/vaults/{vaultId}/position/performance:
    get:
      operationId: getYieldVaultPositionPerformance
      tags:
      - SDK
      summary: Get earnings for a user position in a vault
      description: Returns net earnings and return on capital for the given wallet address in the specified vault, as indexed by Morpho. Indexed figures trail the chain head, so the balances from the position endpoint remain the live source of truth for what a position is worth now.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
        description: Opaque vault identifier from the Dynamic dashboard.
      - name: ownerAddress
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/WalletPublicKey'
        description: Wallet address whose earnings to query.
      responses:
        '200':
          description: Earnings for the user position in the vault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YieldVaultPositionPerformance'
