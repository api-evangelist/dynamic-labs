    BusinessAccountMutationIntent:
      type: object
      description: 'The initiator''s proposal, signed with their session key. Built by the API, not the client — sign these exact bytes verbatim, because re-serializing can change them and invalidate the signature.

        `autoExecute` is inside the signed bytes, so an approver consents to it and nothing can flip it afterwards.

        '
      additionalProperties: true
    AttachSourceRequest:
      type: object
      required:
      - sourceType
      description: fromAddress, fromChainId, and fromChainName are required when sourceType is 'wallet'. When sourceType is 'exchange', they are optional; pass exchangeProvider to generate the buy URL and create the exchange source record server-side. When sourceType is 'deposit_address', fromChainId and fromChainName are required so the bridge provider knows the source chain; fromAddress is optional (omit when the customer pays from a CEX with no connected wallet).
      properties:
        sourceType:
          $ref: '#/components/schemas/FlowSourceTypeEnum'
        fromAddress:
          $ref: '#/components/schemas/WalletPublicKey'
        fromChainId:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        fromChainName:
          $ref: '#/components/schemas/ChainEnum'
        exchangeProvider:
          $ref: '#/components/schemas/ExchangeKeyEnum'
    WalletTransaction:
      type: object
      required:
      - transactionHash
