          $ref: '#/components/schemas/NonEmptyString'
        type:
          $ref: '#/components/schemas/NonEmptyString'
    WaasSignAndBroadcastRequest:
      type: object
      additionalProperties: false
      required:
      - message
      - context
      - networkId
      properties:
        message:
          $ref: '#/components/schemas/NonEmptyStringWith204800MaxLength'
        context:
          $ref: '#/components/schemas/SignMessageContext'
        networkId:
          type: string
          pattern: ^[0-9]{1,20}$
          description: Network the transaction is sent on (e.g. "1", "101"). The context must name the same chain id.
        broadcastOptions:
          $ref: '#/components/schemas/WaasBroadcastOptions'
        isFormatted:
          description: When true, `message` is treated as a pre-computed 32-byte hash (64 hex characters, optionally with a leading `0x`) and signed by the MPC server as-is ("raw signing"). When false or omitted, the SDK hashes the message bytes using the chain's standard algorithm (e.g. keccak256 for EVM). Sign and broadcast only accepts false.
          type: boolean
        requestedCertainty:
          allOf:
          - $ref: '#/components/schemas/WaasRequestedCertainty'
          default: safe
        externalReference:
          type: string
          description: Your own label for this transaction, returned on every event. Not unique.
          minLength: 1
          maxLength: 256
          pattern: ^[\x20-\x7E]+$
        roomId:
          description: MPC room identifier for the signing session
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9_-]+$
        approvalQuorum:
          $ref: '#/components/schemas/SignMessageApprovalQuorum'
        shareSetId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: 'Optional identifier of the share set this operation targets. When

            omitted, the active rootUser share set for `walletId` is resolved

            server-side (backwards-compat fallback for older SDKs).

            '
    EmailVerificationCreateResponse:
      type: object
