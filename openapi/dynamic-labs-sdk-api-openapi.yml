      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/members:
    post:
      operationId: sdkAddBusinessAccountMember
      tags:
      - SDK
      summary: SDK — add a member to a business account
      description: 'Owner or admin by default; an account whose governance sets

        `eligibleInitiatorRoles` for `addMember` can widen that. Target user is

        resolved by `userId` OR `identifier + type` (email/externalUserId

        create-or-resolve; id direct lookup). Idempotent: an already-active member

        returns the existing row with 200.


        When the account governs `addMember` and nothing is signed yet, the

        response is `422 intent_required` with the intent to sign. Resend

        signed to move to 202 (the proposal collecting approvals) or straight

        to 201 if quorum is already met.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBusinessAccountMemberSdkRequest'
      responses:
        '200':
          description: Target user was already a member; existing row returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMember'
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMember'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/wallets/{walletId}:
    delete:
      operationId: sdkRemoveBusinessAccountWallet
      tags:
      - SDK
      summary: SDK — remove a wallet from a business account
      description: 'Owner/admin only. Removes the wallet from the business account and

        cascades: every signer + share set on the wallet is soft-deleted and the

        wallet itself is soft-deleted, in one transaction. Returns 404 when the

        wallet isn''t part of this business account.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - in: path
        name: walletId
        required: true
        schema:
          $ref: '#/components/schemas/uuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveBusinessAccountWalletSdkRequest'
      responses:
        '200':
          description: Business account with the wallet removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountDetail'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/members/{userId}:
    patch:
      operationId: sdkUpdateBusinessAccountMemberRole
      tags:
      - SDK
      summary: SDK — change a member's role
      description: 'Owner-only. Changes the member''s role to any role the account defines — a

        built-in (`admin`, `viewer`) or a customer-defined one, and between two

        customer-defined ones. Owner is never a target — ownership moves via

        transferOwnership.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - in: path
        name: userId
        required: true
        schema:
          $ref: '#/components/schemas/uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessAccountMemberRoleSdkRequest'
      responses:
        '200':
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMember'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    delete:
      operationId: sdkRemoveBusinessAccountMember
      tags:
      - SDK
      summary: SDK — remove a member from a business account
      description: 'Owner-only. Removes the member and cascades: every one of that user''s

        signer rows + share sets across the business account''s wallets is

        soft-deleted in one transaction. Returns 409 if removing the member

        would leave any wallet with zero active signers.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - in: path
        name: userId
        required: true
        schema:
          $ref: '#/components/schemas/uuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveBusinessAccountMemberSdkRequest'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required:
                - member
                properties:
                  member:
                    $ref: '#/components/schemas/BusinessAccountMember'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/governance:
    get:
      operationId: sdkGetBusinessAccountGovernance
      tags:
      - SDK
      summary: SDK — read the approval requirements in force
      description: 'Readable by any member: names which of the account''s actions need consent

        before attempting one. Also needed to use `PUT`, which replaces the

        section wholesale — changing one action means merging against this value

        first.


        Empty object when nothing is governed; that is an answer, not a 404.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      responses:
        '200':
          description: The governance section in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountGovernanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    put:
      operationId: sdkSetBusinessAccountGovernance
      tags:
      - SDK
      summary: SDK — replace the approval requirements for a business account
      description: 'Replaces the governance section wholesale, matching the enclave: a caller

        sending one action''s rules drops the others. Requires step-up

        authentication, because governance decides what every other mutation

        requires.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBusinessAccountGovernanceSdkRequest'
      responses:
        '200':
          description: Governance replaced; the new document version returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMutationVersion'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/roles:
    get:
      operationId: sdkListBusinessAccountRoles
      tags:
      - SDK
      summary: SDK — list the customer-defined roles for a business account
      description: 'Readable by any member. Names the roles the account has defined and the

        built-in each inherits, which is what a caller needs before referring to

        one in governance or when assigning a member.


        Returns an empty object when none are defined; that is an answer, not a

