        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/activity:
    get:
      operationId: sdkGetBusinessAccountActivity
      tags:
      - SDK
      summary: SDK — list business account activity
      description: 'Retrieve the audit trail of a business account, newest first. Caller

        must be an owner or admin member. Returns 404 when the caller is not a

        member (404 not 403 so we don''t leak business-account existence).'
      parameters:
