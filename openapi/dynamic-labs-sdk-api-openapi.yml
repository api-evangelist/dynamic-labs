        type:
          $ref: '#/components/schemas/DestinationTypeEnum'
        identifier:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
    BusinessAccountApprovalRequirementStatus:
      type: object
      description: 'One governance requirement and how close it is to being met. Every matching requirement is reported, not only the unmet ones, so a client can show per-rule progress rather than a rule appearing only once it is short.

        Computed inside the enclave: eligibility resolves from the signed document, so whether a given approval counts depends on roles that are not readable outside it. A client cannot derive these numbers from the approval list.

        '
      required:
      - action
      - approved
      - required
      - requirementId
      - satisfied
      properties:
        action:
          type: string
          description: 'The change type this rule governs. Requirement ids are unique per action only, so a change set spanning two actions can report the same id twice.

            '
          example: addMember
        requirementId:
          type: string
        required:
          type: integer
        approved:
          type: integer
          description: 'Approvals that COUNT toward this requirement — not the raw approval count. An approver outside the eligible pool, or one demoted since they approved, is not included.

            '
        satisfied:
          type: boolean
          description: 'Authoritative. `approved >= required` is not sufficient: a mandatory approver role with nobody''s approval leaves this false with the count already met.

            '
        unmetMandatoryRoles:
          type: array
          description: 'Mandatory approver roles still lacking an approval, present only when they are what is holding the requirement back.

            '
          items:
            type: string
    AccountList:
      type: array
      items:
        $ref: '#/components/schemas/Account'
    WaasShareSet:
