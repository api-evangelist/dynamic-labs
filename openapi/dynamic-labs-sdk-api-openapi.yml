            is linked into a business account so the caller''s signer share set can

            be resolved; omit for personal wallets.

            '
        shareSetId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: 'Identifier of the share set (WaasWallets row) being activated. SDKs

            that already receive shareSetId from the ceremony_complete event

            should echo it back here. Optional for backwards compatibility — when

            omitted, the active rootUser share set is resolved from walletId.

            '
        locations:
          description: List of backup locations with their key share configuration
          type: array
