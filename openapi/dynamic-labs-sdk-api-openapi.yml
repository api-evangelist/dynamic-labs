          $ref: '#/components/schemas/PasskeyRegistrationCredential'
        challenge:
          $ref: '#/components/schemas/NonEmptyString'
    YieldSigningPayload:
      type: object
      required:
      - chainId
      - chainName
      properties:
        chainId:
          type: string
          description: Chain identifier for the chain the payload targets.
        chainName:
          $ref: '#/components/schemas/ChainEnum'
        evmTransaction:
          $ref: '#/components/schemas/SwapEvmTransactionData'
        evmApproval:
          $ref: '#/components/schemas/SwapEvmApprovalData'
        transactions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/YieldTransactionStep'
          description: Ordered transaction sequence to sign and send, one after the other.
      description: Unsigned payload for a vault action. When present, `evmApproval` must be signed and sent before `evmTransaction`; `transactions` replaces both with a sequence signed in `ordinal` order, contiguous from zero.
    captchaToken:
      type: string
      description: When provided, used to verify that a captcha is valid and get the success/failure result from the captcha provider server-side.
    BusinessAccountProposal:
      type: object
      description: 'A governed mutation or signing operation waiting on consent. Untrusted workflow state: it records what was proposed and who has signed, and the enclave verifies every signature when the proposal is executed. The signature is over `intent` as stored, so an approver must sign these exact bytes — re-deriving the intent would produce a different `intentId` and invalidate the approvals already collected.

        '
      required:
      - actionType
      - approvals
      - businessAccountId
      - completeBy
      - createdAt
      - id
      - initiatorUserId
      - intent
      - status
      properties:
        id:
          type: string
          format: uuid
        businessAccountId:
          type: string
          format: uuid
        actionType:
          $ref: '#/components/schemas/BusinessAccountGovernedAction'
        status:
          $ref: '#/components/schemas/BusinessAccountProposalStatus'
        initiatorUserId:
          type: string
          format: uuid
          description: 'Who proposed it. They can never approve their own intent, so they are never counted toward a requirement.

            '
        intent:
          $ref: '#/components/schemas/BusinessAccountMutationIntent'
        completeBy:
          type: string
          format: date-time
          description: 'The one deadline for the whole proposal, derived from the signed intent''s `createdAt`. Past it the proposal accepts no further approvals AND can no longer be executed.

            '
        consumedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When it left `pending`; null while still open.
        createdAt:
          type: string
          format: date-time
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/BusinessAccountProposalApprovalRecord'
        autoExecute:
          type: boolean
          description: 'Whether this applies as soon as its quorum is met, or waits for an explicit execute. A copy of the flag inside the signed intent, which is the authority. An approver needs this to know whether their approval is the one that lands the change.

            '
        subjects:
          type: array
          description: 'The users this change is about, resolved for display — the member being added, the signer being removed, the new owner. Empty for a change that names no user, such as `setGovernance`.

            '
          items:
            $ref: '#/components/schemas/BusinessAccountProposalSubject'
        approvalRequirements:
          type: array
          description: 'Every governance rule matching this proposal, with how close each is. Do NOT derive progress from `approvals` — that counts rows, including approvers outside a rule''s pool and approvers demoted since they signed.

            Absent means the tally is unknown (not fetched, or no longer pending); an empty array means nothing is outstanding. Treat the two differently.

            '
          items:
            $ref: '#/components/schemas/BusinessAccountApprovalRequirementStatus'
    KycFieldType:
