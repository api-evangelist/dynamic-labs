  /sdk/{environmentId}/realtime/auth:
    get:
      operationId: getRealtimeAuthToken
      tags:
      - SDK
      summary: Get a realtime auth token
      description: 'Returns a short-lived JWT for subscribing to realtime channels. Accepts either a JWT (via Authorization header) or a checkout session token with transaction ID for unauthenticated checkout flows. The token is always scoped to the channels of the resources the caller is entitled to: session tokens are scoped to their own transaction or flow, while JWT callers must name the flow and/or checkout transaction to follow via the X-Dynamic-Flow-Id and X-Dynamic-Checkout-Transaction-Id headers.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - name: capabilities
        in: query
        required: false
        description: Comma-separated list of requested capabilities. The only allowed value is subscribe, which is also the default.
        schema:
          type: string
          example: subscribe
      - $ref: '#/components/parameters/flowSessionTokenOptional'
      - $ref: '#/components/parameters/flowIdHeaderOptional'
      - $ref: '#/components/parameters/checkoutSessionTokenOptional'
      - $ref: '#/components/parameters/checkoutTransactionIdHeaderOptional'
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Realtime auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeAuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
