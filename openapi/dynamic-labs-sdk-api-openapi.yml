        description: EVM chain ID or other network identifier (e.g. '1' for Ethereum mainnet)
      responses:
        '200':
          description: List of supported MoonPay currencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoonPayCurrenciesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/businessAccounts:
    post:
      operationId: sdkCreateBusinessAccount
      tags:
      - SDK
      summary: SDK — create a business account
      description: 'Create a business account from the SDK. The authenticated JWT user

        becomes the first `owner` member. Gated by the

        `enable-business-accounts` feature flag.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessAccountSdkRequest'
      responses:
        '201':
          description: Business account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    get:
      operationId: sdkListBusinessAccounts
      tags:
      - SDK
      summary: SDK — list business accounts the caller is a member of
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: query
        name: externalRef
        required: false
        description: Filter to business accounts whose externalRef matches one of the given values. Repeat the param for multiple values (max 100). Only accounts the caller is a member of are ever returned.
        schema:
          type: array
          maxItems: 100
          items:
            type: string
