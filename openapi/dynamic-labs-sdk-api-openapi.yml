      description: Builds an unsigned withdraw signing payload for the given vault and wallet address. Withdrawals redeem shares the owner already holds, so no approval step is needed and the response never includes one.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - name: vaultId
