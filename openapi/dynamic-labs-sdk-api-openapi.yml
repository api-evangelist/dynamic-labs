      security:
      - bearerAuth: []
      tags:
      - SDK
      summary: Update additional wallet addresses (Midnight only)
      description: 'Update additional addresses for a Midnight wallet. Used to set correct shielded/dust

        addresses after client-side derivation (server cannot compute JubJub/BLS12-381 keys).

        Only allowed for Midnight wallets.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      requestBody:
        description: Additional addresses to update
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - additionalAddresses
              properties:
                additionalAddresses:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - address
                    - type
                    - publicKey
                    properties:
                      address:
                        type: string
                        minLength: 1
                        maxLength: 256
                      publicKey:
                        type: string
                        minLength: 1
                        maxLength: 256
                      type:
                        type: string
                        enum:
                        - midnight_shielded
                        - midnight_dust
                        - midnight_unshielded
                      network:
                        type: string
                        description: Network this address is encoded for (e.g. 'preview' | 'mainnet'). Lets one wallet hold an address per network.
                        minLength: 1
                        maxLength: 64
      responses:
        '200':
          description: Additional addresses updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
