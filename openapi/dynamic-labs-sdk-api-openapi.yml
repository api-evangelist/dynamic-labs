            type: object
            required:
            - location
            properties:
              location:
                $ref: '#/components/schemas/WaasBackupOptionsEnum'
              keygenId:
                $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
              thresholdSignatureScheme:
                $ref: '#/components/schemas/ThresholdSignatureScheme'
              externalKeyShareId:
                $ref: '#/components/schemas/NonEmptyString'
              passwordEncrypted:
                description: 'Whether the key share stored at this location is encrypted with a

                  user-provided password. Stored as `false` when omitted, which makes

                  recovery decrypt the share with the environment id instead.

                  '
                type: boolean
              tokenSource:
                type: string
                enum:
                - external
                - stored_oauth
                description: 'Audit-only indicator of which OAuth token the client used to back

                  up this location: `external` (consumer-supplied, e.g. Fanpla''s own

                  Drive-scoped token) or `stored_oauth` (resolved from the user''s

                  linked account). Enum only — never the token value. Currently set

                  only for the `googleDrive` location; persisted verbatim on the

                  `backupKeyShares` wallet action metadata.

