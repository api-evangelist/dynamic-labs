    WaasTransactionBroadcast:
      type: object
      required:
      - transactionId
      - status
      - chainType
      - chainId
      - walletAddress
      - idempotencyKey
      - requestedAt
      properties:
        transactionId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Dynamic's id for this transaction, the same on every event.
        status:
          $ref: '#/components/schemas/WaasBroadcastStatus'
        reason:
          $ref: '#/components/schemas/WaasTransactionBroadcastReason'
        errorMessage:
          type: string
          maxLength: 512
          description: Human-readable detail on a `reverted` or `failed` transaction, written by Dynamic and never a raw provider or node error. For a log or a support ticket; branch on `reason` instead.
        revertReason:
          type: string
          maxLength: 512
          description: The contract's own error, when the transaction landed and reverted. Public chain output, passed through untouched and capped in length.
        chainType:
          type: string
          enum:
          - evm
          - svm
        chainId:
          type: string
          description: An EVM chain id, or a Solana network id (101 mainnet, 103 devnet, 201 Eclipse).
        walletAddress:
          type: string
        idempotencyKey:
          type: string
          description: The key the transaction was requested with.
        externalReference:
          type: string
          description: Your own label, as sent.
        transactionHash:
          type: string
          description: The transaction's hash, once it is signed.
        blockExplorerUrls:
          $ref: '#/components/schemas/WaasBlockExplorerUrls'
        nonce:
          allOf:
          - $ref: '#/components/schemas/WaasHexQuantity'
          description: EVM only. The transaction's nonce, the only safe one to reuse when replacing it.
        replacementFee:
          allOf:
          - $ref: '#/components/schemas/WaasBroadcastEvmFee'
          description: EVM only, while the transaction is not final. The lowest fee a replacement at the same nonce would need to displace the transaction.
        room:
          allOf:
          - $ref: '#/components/schemas/OpenRoomResponse'
          description: The signing room, while status is pending_signature.
        progress:
          $ref: '#/components/schemas/WaasTransactionBroadcastProgress'
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          description: Present when the status is terminal.
