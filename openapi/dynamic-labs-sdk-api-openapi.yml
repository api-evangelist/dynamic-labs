  /sdk/{environmentId}/businessAccounts/linkWallet:
    post:
      operationId: sdkLinkBusinessAccountWallet
      tags:
      - SDK
      summary: SDK — add an existing wallet to a business account
      description: 'Brings an existing user wallet under a business account so signers can be

        added to it. No MPC ceremony — the owner already holds a valid share

        set, so this transfers the wallet''s ownership to the business account

        (`businessAccountId` set, `userId` cleared) and registers the caller

        as an owner member + `endUser` signer bound to their existing share

        set. When `businessAccountId` is omitted, the per-wallet business account is

        found-or-created (unnamed). Idempotent.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkBusinessAccountWalletSdkRequest'
      responses:
        '200':
          description: Business account with embedded members, signers, and wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountDetail'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}:
    get:
      operationId: sdkGetBusinessAccountById
      tags:
      - SDK
      summary: SDK — get a business account with embedded members and signers
      description: 'Returns 404 if the caller is not a member of the business account

        (404 not 403 so we don''t leak business-account existence).'
