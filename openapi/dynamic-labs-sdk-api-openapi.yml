    ScreenTransactionRequest:
      type: object
      additionalProperties: false
      required:
      - chain
      - context
      description: The sender and statically-encoded envelope destinations are extracted and screened server-side.
      properties:
        chain:
          $ref: '#/components/schemas/ChainEnum'
        chainId:
          type: string
          maxLength: 128
          description: Network identifier, recorded for audit/logging only — screening is per chain family.
        senderAddress:
          type: string
          minLength: 1
          maxLength: 256
          description: The transaction sender; screened alongside the extracted destinations.
        context:
          type: object
          minProperties: 1
          maxProperties: 1
          additionalProperties: false
          description: Chain-specific transaction payload; exactly one shape must be provided.
          properties:
            btcTransaction:
              type: object
              additionalProperties: false
              required:
              - chainId
              description: Exactly one of psbt / recipientAddress must be provided.
              properties:
                chainId:
                  type: string
                  maxLength: 16
                  description: Bitcoin network from the signing contract (1=mainnet, 2=testnet, 3=signet).
                psbt:
                  type: string
                  minLength: 1
                  maxLength: 204800
                  description: Base64- or hex-encoded PSBT.
                recipientAddress:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: The envelope recipient, for callers that have not built a PSBT yet (e.g. sendBitcoin); screened like an extracted destination.
            evmTransaction:
              type: object
              additionalProperties: false
              description: The envelope destination, absent for contract deployments.
              properties:
                to:
                  type: string
                  maxLength: 256
                  description: The envelope destination address. Calldata is not decoded.
            stellarTransaction:
              type: object
              additionalProperties: false
              required:
              - serializedTransaction
              properties:
                serializedTransaction:
                  type: string
                  minLength: 1
                  maxLength: 204800
                  description: Base64-encoded transaction envelope XDR.
            suiTransaction:
              type: object
              additionalProperties: false
              required:
              - serializedTransaction
              properties:
                serializedTransaction:
                  type: string
                  minLength: 1
                  maxLength: 204800
                  description: Base64- or hex-encoded BCS TransactionData.
            svmTransaction:
              type: object
              additionalProperties: false
              required:
              - serializedTransactions
              properties:
                serializedTransactions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                    maxLength: 4096
                  description: Base64- or base58-encoded serialized transactions.
            tronTransaction:
              type: object
              additionalProperties: false
              required:
              - rawDataHex
              properties:
                rawDataHex:
                  type: string
                  minLength: 8
                  maxLength: 204800
                  pattern: ^(0[xX])?[0-9a-fA-F]+$
                  description: Hex-encoded serialized Tron raw_data protobuf (the signable transaction body).
