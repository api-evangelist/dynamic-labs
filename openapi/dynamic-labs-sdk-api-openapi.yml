      - SDK
      summary: List yield vaults
      description: Returns the yield vaults available to this environment. Public vaults (project_environment_id IS NULL) are included for every caller; private vaults are included only for the matching environment. Each vault is enriched with live net APY and TVL from Morpho on a best-effort basis.
