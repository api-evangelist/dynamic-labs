    TokenBalance:
      type: object
      required:
      - address
      - name
      - symbol
      - decimals
      - logoURI
      - balance
      - rawBalance
      - rawBalanceString
      properties:
        networkId:
          description: Network identifier where the token balance resides
          type: integer
        address:
          $ref: '#/components/schemas/WalletPublicKey'
        name:
          description: Display name of the token
          type: string
        symbol:
          description: Ticker symbol of the token
          type: string
        decimals:
          description: Number of decimal places the token supports
          type: integer
        logoURI:
          description: URL of the token logo image
          type: string
        balance:
          description: Human-readable token balance adjusted for decimals
          type: number
        rawBalance:
          description: 'Raw token balance in the smallest unit, as a number. WARNING: loses precision

            above 2^53 (~9.007e15). For 18-decimal tokens this is every realistic balance

            over ~0.009 of one unit. Use rawBalanceString for any precision-sensitive use

            case (exact-amount validation against on-chain state, swap fromAmount, transfer

            amounts). Retained for backwards compatibility.

            '
          type: number
        rawBalanceString:
          description: 'Raw token balance in the smallest unit, as a decimal string. Precision-safe for

            any token amount. Use BigInt(rawBalanceString) for math, or pass directly to

            APIs that accept string-encoded amounts (LI.FI, viem, ethers, etc.).

            '
          type: string
        price:
          description: Current price per token in USD
          type: number
        marketValue:
          description: Total market value of the balance in USD
          type: number
        liquidityPoolSizeUsd:
          description: Size of the token's liquidity pool in USD
          type: number
        totalSupply:
          description: Total circulating supply of the token
          type: string
        isNative:
          description: Whether this is the chain's native token
          type: boolean
        verified:
          description: Whether the balance provider recognizes the token as verified. Omitted when the provider does not report it.
          type: boolean
        isSpam:
          description: Whether the balance provider flags the token as spam. Omitted when the provider does not report it.
          type: boolean
