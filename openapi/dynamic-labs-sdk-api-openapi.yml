      - $ref: '#/components/parameters/businessAccountId'
      - $ref: '#/components/parameters/businessAccountRoleName'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteBusinessAccountRoleSdkRequest'
      responses:
        '200':
          description: Role deleted; the new document version returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMutationVersion'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/proposals:
    get:
      operationId: sdkListBusinessAccountProposalsAwaitingApproval
      tags:
      - SDK
      summary: SDK — list proposals awaiting the caller's approval, across accounts
      description: 'Every pending proposal waiting on the caller, across all the business

        accounts they belong to in this environment — without it an approver can

        only learn of one out of band.


        Scoped to the caller''s own memberships, so it can never include another

        tenant''s proposals. Proposals the caller initiated are excluded:

        proposing is not approving.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Proposals awaiting the caller's approval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessAccountProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/proposals:
    get:
      operationId: sdkListBusinessAccountProposals
      tags:
      - SDK
      summary: SDK — list the governed mutations awaiting approval
      description: 'Every proposal for the account, newest first. Any member may read them:

        knowing what is pending is what lets an approver act, and the list carries

        no signing material — only who has already consented.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - $ref: '#/components/parameters/businessAccountProposalStatusFilter'
      responses:
        '200':
          description: The account's proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessAccountProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/proposals/{proposalId}:
    get:
      operationId: sdkGetBusinessAccountProposal
      tags:
      - SDK
      summary: SDK — read one proposal, including the intent to sign
      description: 'Returns the stored intent verbatim. An approver signs THESE bytes: a

        re-derived intent would carry a different `intentId` and `createdAt`, and

        every approval already collected would stop verifying.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - $ref: '#/components/parameters/businessAccountProposalId'
      responses:
        '200':
          description: The proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/proposals/{proposalId}/approvals:
    post:
      operationId: sdkApproveBusinessAccountProposal
      tags:
      - SDK
      summary: SDK — approve a proposal
      description: 'Records the caller''s consent, signed with their session key. Requires

        step-up authentication: approving is the act that authorizes the mutation,

        so it carries the same weight as performing it.


        Recording an approval does not apply the change — call execute once the

        requirements are satisfied. An initiator can never approve their own

        intent; the enclave refuses it and so does this endpoint.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - $ref: '#/components/parameters/businessAccountProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveBusinessAccountProposalSdkRequest'
      responses:
        '200':
          description: Approval recorded; the proposal with its current approvals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    delete:
      operationId: sdkWithdrawBusinessAccountProposalApproval
      tags:
      - SDK
      summary: SDK — withdraw the caller's approval
      description: 'Marks the caller''s approval revoked rather than deleting it, so the record

        that consent was given and then taken back survives. A revoked approval

        stops being forwarded to the enclave, which is what makes withdrawal

        actually reduce the count.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - $ref: '#/components/parameters/businessAccountProposalId'
      responses:
        '200':
          description: Approval withdrawn; the proposal with its remaining approvals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/proposals/{proposalId}/veto:
    post:
      operationId: sdkVetoBusinessAccountProposal
      tags:
      - SDK
      summary: SDK — kill a proposal
      description: 'Terminal, and different from withdrawing an approval: a veto ends the

        proposal rather than reducing its count. Requires step-up authentication —

        killing a proposal is destructive and irreversible, so it carries the same

        weight as approving one.


        Enforced by the application rather than the signed document, because the

        absence of a veto is not provable in a stateless request. It works because

        the application is the only path to the enclave, so declining to forward

        genuinely stops it.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - $ref: '#/components/parameters/businessAccountProposalId'
      responses:
        '200':
          description: Proposal vetoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/proposals/{proposalId}/execute:
    post:
      operationId: sdkExecuteBusinessAccountProposal
      tags:
      - SDK
      summary: SDK — apply a proposal whose approvals now satisfy it
      description: 'Submits the stored intent and its unrevoked approvals to the enclave, which

        decides whether the requirements are met. On success the original mutation

        runs — the same code path an ungoverned account takes — and the proposal is

        consumed.


        Returns 202 with the requirement tallies when consent is still short, leaving the

        proposal open so more approvals can arrive. No step-up: the approvals are

        what authorize the change, and the caller adds no consent of their own.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - $ref: '#/components/parameters/businessAccountProposalId'
      responses:
        '200':
          description: Applied; the new document version returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMutationVersion'
        '202':
          description: 'Not applied — consent is still outstanding. The proposal stays open.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountApprovalsPending'
        '400':
          description: 'The enclave refused the request; `reason` says why.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountSigningRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/transferOwnership:
    post:
      operationId: sdkTransferBusinessAccountOwnership
      tags:
      - SDK
      summary: SDK — transfer ownership of a business account
      description: 'Owner-only. Promotes the target user (must already be a member) to

        owner and demotes the current owner to admin, atomically. The signed

        RBAC doc always has exactly one owner.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferBusinessAccountOwnershipSdkRequest'
      responses:
        '200':
          description: Ownership transferred; updated business account returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountDetail'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/wallets/{walletId}/signers/{signerId}:
    delete:
      operationId: sdkRemoveBusinessAccountSigner
      tags:
      - SDK
      summary: SDK — remove a signer from a wallet in a business account
      description: 'Severs the signer''s MPC pair on this wallet by soft-deleting the

        server share + the share set + the signer row in one transaction.

        No reshare ceremony is run — surviving signers'' share sets are

        independent MPC pairs and remain intact.


        Authorization is enforced by auth-service — owner or admin by default,

        wider if the account''s governance sets `eligibleInitiatorRoles` for

        `removeSignerFromWallet`. Returns 409 if removing the signer would leave

        the wallet with zero active signers.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - in: path
        name: walletId
        required: true
        schema:
          $ref: '#/components/schemas/uuid'
      - in: path
        name: signerId
        required: true
        schema:
          $ref: '#/components/schemas/uuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveBusinessAccountSignerSdkRequest'
      responses:
        '200':
          description: Signer removed
          content:
            application/json:
              schema:
                type: object
                required:
                - signer
                properties:
                  signer:
                    $ref: '#/components/schemas/BusinessAccountSigner'
        '202':
          $ref: '#/components/responses/BusinessAccountApprovalsPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/BusinessAccountForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/wallets/{walletId}/signers:
    post:
      operationId: sdkAddBusinessAccountSigner
      tags:
      - SDK
      summary: SDK — add a signer to a wallet in a business account
      description: 'Adds a signer to a business-account wallet by running a same-parties

        2/2 -> 2/2 MPC reshare ceremony. The caller must hold an active share on

        the wallet (only existing share-holders can reshare). The target user

        is resolved the same way as addMember and, if absent, is created and

        added to the account. The response is `text/event-stream` (NOT JSON):

        clients consume it via EventSource and receive `room_created` and

        `ceremony_complete` events; the new signer share is delivered to the

        initiating client (iframe) via Sodot''s relay and backed up to the

        client-keyshare service on the target''s behalf.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - in: path
        name: walletId
        required: true
        schema:
          $ref: '#/components/schemas/uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBusinessAccountSignerSdkRequest'
      responses:
        '200':
          description: 'SSE stream for the add-signer reshare ceremony. The response is

            `text/event-stream` (NOT JSON): clients consume it via EventSource

            and receive `room_created` and `ceremony_complete` events.

            '
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/businessAccounts/{businessAccountId}/policy-layer:
    get:
      operationId: getBusinessAccountPolicyLayer
      security:
      - bearerAuth: []
      tags:
      - SDK
      summary: Get the business account's account-Layer Rules
      description: 'Returns the Composition account-Layer content for the business

        account — the Rules that apply to every wallet in the business

        account. BA owner/admin only. Returns 404 if the caller is not a

        qualifying owner/admin of the business account, or if the

        account-Layer has not been minted yet (it''s created by the first PATCH

        to this path, or the first time a signer is added to a wallet in this

        business account with Composition enabled — see the PATCH docs on

        this same path).'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      responses:
        '200':
          description: Account-Layer fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateBusinessAccountPolicyLayer
      security:
      - bearerAuth: []
      tags:
      - SDK
      summary: Create, update, or remove a Rule on the business account's account-Layer
      description: 'Applies a single per-Rule upsert (create when ruleId is new, update

        when it already exists) or remove operation to the business

        account''s account-Layer, which applies to every wallet in the

        business account. BA owner/admin only. ruleId may be omitted on an

        upsert; the enclave then mints one and returns it in the response''s

        layerContent.rules. Creates the account-Layer if this business

        account has none yet, so a first write succeeds rather than 404ing;

        it is otherwise minted the first time a signer is added to a wallet

        in the business account with Composition enabled. Set op to batch to

        apply several operations atomically in one enclave cycle.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasPolicyLayerUpdateRequest'
      responses:
        '200':
          description: Account-Layer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    exchangeKey:
      in: path
      name: exchangeKey
      required: true
      description: Exchange identifier
      schema:
        $ref: '#/components/schemas/ExchangeKeyEnum'
    screeningAsset:
      in: query
      name: asset
      required: false
      schema:
        type: string
        maxLength: 64
      description: Asset the transaction is denominated in, evaluated on the same terms as amountUsd.
    providerType:
      in: path
      name: providerType
      required: true
      description: Type of external auth provider
      schema:
        $ref: '#/components/schemas/ProviderEnum'
    globalWalletConnectionId:
      in: path
      name: globalWalletConnectionId
      required: true
      description: ID of the global wallet connection
      schema:
        $ref: '#/components/schemas/uuid'
    oauthAccountId:
      in: path
      name: oauthAccountId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of a user oauth account
    walletId:
      in: path
      name: walletId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of the wallet
    relatedOriginRpId:
      in: query
      name: relatedOriginRpId
      required: false
      description: The Relying Party ID (rpID) to use as the passkey challenge rpID when authenticating from a related origin (Related Origin Requests). Must be a bare hostname such as `example.com` (no scheme, port, or path); a full origin like `https://example.com` is also accepted for convenience. When omitted, the rpID is derived from the request's Origin header.
      schema:
        type: string
        example: example.com
    sponsoredTransactionWait:
      in: query
      name: wait
      required: false
      description: Seconds to hold the response open while the transaction is still unresolved, so the hash is returned as soon as it exists instead of on the caller's next poll. Omitted or zero returns immediately. Values outside 0-10 are rejected.
      schema:
        type: integer
        minimum: 0
        maximum: 10
    accountId:
      in: path
      name: accountId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of an exchange account
    requestId:
      in: path
      name: requestId
      required: true
      description: UUID of the relay request
      schema:
        $ref: '#/components/schemas/uuid'
    businessAccountId:
      in: path
      name: businessAccountId
      required: true
      description: ID of the business account
      schema:
        $ref: '#/components/schemas/uuid'
    walletAddress:
      in: path
      name: walletAddress
      schema:
        $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
      required: true
      description: Public key (address) of the wallet
    signAndBroadcastIdempotencyKey:
      in: header
      name: x-idempotency-key
      required: true
      description: Your repeat-protection key for one transaction, unique per environment. Repeating it with the same transaction returns the original; with a different transaction, 409.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[-A-Za-z0-9._~!$&'()*+,;=:@/]{1,255}$
    screeningApplyPolicies:
      in: query
      name: applyPolicies
      required: false
      schema:
        type: boolean
      description: Defaults to true; false ignores the environment's screening rules and address entries, but not the cost rules deciding which providers are called.
    transactionId:
      in: path
      name: transactionId
      required: true
      description: UUID of the deposit transaction
      schema:
        $ref: '#/components/schemas/uuid'
    checkoutTransactionIdHeaderOptional:
      in: header
      name: X-Dynamic-Checkout-Transaction-Id
      required: false
      description: UUID of the checkout transaction the request applies to. Required when authenticating via checkout session token, or to scope a realtime token to a checkout transaction.
      schema:
        $ref: '#/components/schemas/uuid'
    flowIdHeaderOptional:
      in: header
      name: X-Dynamic-Flow-Id
      required: false
      description: Flow ID associated with the flow session token. Required when authenticating via flow session token instead of JWT.
      schema:
        $ref: '#/components/schemas/uuid'
    checkoutSessionTokenOptional:
      in: header
      name: X-Dynamic-Checkout-Session-Token
      required: false
      description: 'Checkout session token issued at transaction creation. Required when no JWT is provided. Format: dct_<base64url>.'
      schema:
        type: string
    evmChainIdQuery:
      in: query
      name: chainId
      required: true
      description: EVM chain ID
      schema:
        type: integer
        minimum: 1
    flowSessionToken:
      in: header
      name: X-Dynamic-Flow-Session-Token
      required: true
      description: 'Flow session token issued at source attachment. Format: dft_<base64url>.'
      schema:
        type: string
    flowId:
      in: path
      name: flowId
      required: true
      description: UUID of the flow
      schema:
        $ref: '#/components/schemas/uuid'
    mfaDeviceId:
      in: path
      name: mfaDeviceId
      required: true
      description: ID of the MFA Device
      schema:
        $ref: '#/components/schemas/uuid'
    broadcastIdempotencyKey:
      in: header
      name: x-idempotency-key
      required: true
      description: Idempotency key scoping a broadcast result. Replaying the same key with the identical signed payload returns the stored result. Replacement or speed-up transactions use different signed bytes and require a new key; reusing an existing key with different bytes returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[-A-Za-z0-9._~!$&'()*+,;=:@/]{1,255}$
    screeningScope:
      in: query
      name: scope
      required: false
      schema:
        $ref: '#/components/schemas/ScreeningPolicyScopeEnum'
      description: Which of the environment's policies to evaluate against; defaults to TRANSACTION.
    checkoutSessionToken:
      in: header
      name: X-Dynamic-Checkout-Session-Token
      required: true
      description: 'Checkout session token issued at transaction creation. Format: dct_<base64url>.'
      schema:
        type: string
    flowSessionTokenOptional:
      in: header
      name: X-Dynamic-Flow-Session-Token
      required: false
      description: 'Flow session token issued at source attachment. Required when no JWT is provided. Format: dft_<base64url>.'
      schema:
        type: string
    businessAccountProposalStatusFilter:
      in: query
      name: status
      required: false
      description: Return only proposals in this state
      schema:
        $ref: '#/components/schemas/BusinessAccountProposalStatus'
    userId:
      in: path
      name: userId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: UUID of the user
    shareSetId:
      in: path
      name: shareSetId
      schema:
        $ref: '#/components/schemas/uuid'
      required: true
      description: 'UUID of the WaaS share set (the `WaasWallets` row). Identifies which

        share set the operation targets — for the FF=on delegated-share-set

        model, this is the id of the `delegated` row to soft-delete.

        '
    mfaAuthToken:
      in: header
      name: x-mfa-auth-token
      required: true
      description: MFA authentication token
      schema:
        type: string
    screeningAmountUsd:
      in: query
      name: amountUsd
      required: false
      schema:
        type: number
        minimum: 0
      description: USD value of the transaction being screened for; supply it only when the amount is genuinely USD-denominated.
    exportId:
      in: path
      name: exportId
      required: true
      description: ID of the export
      schema:
        $ref: '#/components/schemas/uuid'
    environmentId:
      in: path
      name: environmentId
      required: true
      description: ID of the environment
      schema:
        $ref: '#/components/schemas/uuid'
    waasBroadcastTransactionId:
      in: path
      name: transactionId
      required: true
      description: UUID of the signed-and-sent transaction
      schema:
        $ref: '#/components/schemas/uuid'
    checkoutId:
      in: path
      name: checkoutId
      required: true
      description: UUID of the checkout
      schema:
        $ref: '#/components/schemas/uuid'
    activityId:
      in: path
      name: activityId
      required: true
      description: ID of activity
      schema:
        $ref: '#/components/schemas/uuid'
    businessAccountProposalId:
      in: path
      name: proposalId
      required: true
      description: ID of the business account proposal
      schema:
        $ref: '#/components/schemas/uuid'
    businessAccountRoleName:
      in: path
      name: role
      required: true
      description: 'Name of the customer-defined role. Lowercase letters and numbers, with `-` and `_` allowed inside, 1–32 characters.

        '
      schema:
        type: string
        pattern: ^[a-z0-9](?:[a-z0-9_-]{0,30}[a-z0-9])?$
  schemas:
    EmbeddedWalletProviderEnum:
      type: string
      description: Values 'turnkey' and 'turnkeyhd' are deprecated and will be removed in a future version.
      enum:
      - turnkey
      - turnkeyhd
      - dynamicWaas
    GlobalWalletConnectionCreateRequest:
      type: object
      required:
      - expiresAt
      properties:
        expiresAt:
          description: ISO 8601 timestamp of when the connection should expire
          type: string
          format: date-time
    NameServiceData:
      type: object
      properties:
        avatar:
          description: URL of the avatar associated with the name service record
          type: string
        name:
          description: Resolved name from the name service (e.g. ENS name)
          type: string
    SignMessageApprovalQuorumTransactionOperation:
      oneOf:
      - $ref: '#/components/schemas/SignMessageApprovalQuorumEvmTransactionOperation'
      - $ref: '#/components/schemas/SignMessageApprovalQuorumSvmTransactionOperation'
      discriminator:
        propertyName: chainName
        mapping:
          EVM: SignMessageApprovalQuorumEvmTransactionOperation
          SVM: SignMessageApprovalQuorumSvmTransactionOperation
    CreateEmbeddedWalletSpecificOpts:
      oneOf:
      - $ref: '#/components/schemas/CreateTurnkeyEmbeddedWalletSpecificOpts'
    TurnkeyDeleteEmbeddedWalletsRequestBodyParameters:
      deprecated: true
      required:
      - walletIds
      type: object
      properties:
        walletIds:
          description: List of wallet identifiers to delete
          type: array
          items:
            $ref: '#/components/schemas/uuid'
        deleteWithoutExport:
          description: Whether to allow deletion of wallets that have not been exported
          type: boolean
    WaasBackupOptionsEnum:
      type: string
      enum:
      - googleDrive
      - iCloud
      - dynamic
      - external
      - delegated
      - offlineRecovery
    TransferDestinationList:
      type: array
      items:
        $ref: '#/components/schemas/TransferDestination'
    NonEmptyStringWith255MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      maxLength: 255
      example: An example name
    BusinessAccountActivityExport:
      type: object
      required:
      - id
      - status
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        status:
          type: string
          enum:
          - completed
          - failed
          - pending
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        downloadUrl:
          type: string
          format: url
          description: Pre-signed URL to download the exported CSV (available after completion)
        error:
          type: string
          description: Error message when status is failed
    SwapStatusRequest:
      type: object
      required:
      - txHash
      properties:
        from:
          $ref: '#/components/schemas/SwapStatusRequestChain'
        to:
