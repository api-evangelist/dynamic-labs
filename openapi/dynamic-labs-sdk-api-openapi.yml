                description: 'Whether the elevated access token is consumed after one use (single_use) or remains valid until expiry (time_bound). Defaults to single_use for wallet scopes, time_bound for others.

                  '
              tokenExpirySeconds:
                type: integer
                minimum: 60
                maximum: 600
                description: 'Custom TTL in seconds for the elevated access token. Defaults to 300 (5 min) for single_use, 600 (10 min) for time_bound.

                  '
    ReshareKind:
      type: string
      enum:
      - rootUser
      - cloudBackup
      - delegation
      - offlineRecovery
      description: "Discriminator for what kind of share this reshare ceremony is minting.\nDetermines the destination of the new share, whether a webhook fires,\nand what BackupLocation tag is applied. Defaults to `rootUser` for\nbackwards compatibility with clients that don't yet pass the field.\n\n* `rootUser` — refresh/rotate the user's primary shares (password\n  change, key rotation). Shares stay on the user's device + Dynamic.\n* `cloudBackup` — add a cloud-stored share (Google Drive / iCloud).\n  Encrypted with the user's password and uploaded to the third-party\n  provider determined by request context.\n* `delegation` — add a delegated signing share. Encrypted with the\n  env's delegated-access RSA key and POSTed to the env's\n  `delegatedAccessEndpoint`. Includes an encrypted wallet API key so\n  the developer can sign on behalf of the user.\n* `offlineRecovery` — add a non-signing recovery share. Same endpoint\n  + RSA key as `delegation`, but no API key in the payload and the\n  resulting share is tagged `BackupLocation: 'offlineRecovery'` so\n  wallet-service refuses to use it for signing.\n"
    WaasBroadcastSvmCosignerSignature:
      type: object
      additionalProperties: false
      required:
      - publicKey
      - signature
      properties:
        publicKey:
          type: string
          description: The co-signer's public key, base58.
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
        signature:
          type: string
          description: The co-signer's signature over the transaction, base58.
          pattern: ^[1-9A-HJ-NP-Za-km-z]{64,88}$
    WaasPolicyLayerResponse:
      type: object
      required:
      - layerId
      - layerContent
      - updatedAt
      properties:
        message:
          type: string
          description: Message describing the operation result
        layerId:
          type: string
          description: Unique identifier for the wallet-Layer
        layerContent:
          type: object
          description: The decrypted, mutated wallet-Layer document
          properties:
            rules:
