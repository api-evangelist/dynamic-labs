  /sdk/{environmentId}/waas/aleo/prover/{network}/prove/encrypted:
    parameters:
    - $ref: '#/components/parameters/environmentId'
    - in: path
      name: network
      required: true
      schema:
        type: string
        enum:
        - testnet
        - mainnet
      description: Aleo network whose prover to forward to.
    post:
      operationId: submitAleoProverEncrypted
      security:
      - bearerAuth: []
      tags:
      - SDK
      summary: Submit a libsodium-encrypted Provable proving request through redcoast
      description: 'Server-side proxy to `api.provable.com/prove//encrypted`. Body is `{ key_id, ciphertext }` exactly as the Provable SDK constructs it after sealing the proving request with the pubkey returned by `/pubkey`. Redcoast forwards verbatim and never sees the plaintext. Provable''s TEE decrypts inside the enclave, generates the proof, and (if the inner ProvingRequest had `broadcast: true`) broadcasts the resulting transaction.'
      requestBody:
        required: true
        content:
