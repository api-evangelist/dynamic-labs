        chainId:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        chainName:
          $ref: '#/components/schemas/ChainEnum'
        tokenAddress:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
    NonEmptyUrl:
      type: string
      pattern: ^(https?:\/\/)?[a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}([0-9]{1,5})?(\/.*)?$
      example: https://website-sample.com
    SponsorSVMTransactionResponse:
      type: object
      description: Response containing the sponsored Solana transaction and request ID
      required:
      - transaction
      - requestId
      properties:
        transaction:
          type: string
          description: Base64 encoded transaction with Grid as the fee payer
        requestId:
          type: string
          format: uuid
          description: Unique request ID for tracking the sponsored transaction
    FlowFailure:
      description: Structured failure detail recorded on a flow when an operation fails.
      type: object
      required:
      - code
      - message
      - category
      - stage
      - retryable
      properties:
        code:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        message:
          description: Human-readable error message describing the failure
          type: string
        category:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        stage:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        retryable:
          description: Whether the failed operation can be retried
          type: boolean
        details:
          description: Additional structured details about the failure
          type: object
    TransactionList:
      type: array
      items:
        $ref: '#/components/schemas/ExchangeTransaction'
    CreateWaasAccountRequest:
      type: object
      required:
      - chain
      - clientKeygenIds
      properties:
        chain:
          $ref: '#/components/schemas/WaasChainEnum'
        clientKeygenIds:
          description: List of client-side key generation identifiers
          type: array
          items:
            $ref: '#/components/schemas/NonEmptyBase58StringWith100MaxLength'
        thresholdSignatureScheme:
          $ref: '#/components/schemas/ThresholdSignatureScheme'
        skipLock:
          type: boolean
          description: When true, bypasses server-side lock during wallet creation.
          default: false
        addressType:
          description: Address derivation type for the new account
          type: string
        businessAccountId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'When set, creates this wallet as a business-account wallet rather than a root-user wallet: Wallets.userId stays null, Wallets is bound to the business account, the WaaS share set is minted with type `businessAccountUser` in `pending` status, and the caller is registered as the wallet''s signer. Caller must be an `owner` or `admin` of the business account. Requires the `enable-business-accounts` feature flag — calls with this field will 422 if the flag is off rather than silently falling back to root-user creation.

            '
        delegateToProjectEnvironment:
          type: boolean
          default: false
          description: 'When true, the enclave also mints a walletApiKey for the new wallet and returns it as `encryptedWalletApiKey`, sealed to the environment''s delegated-access RSA key. Off by default: a wallet whose EAC carries no walletApiKey cannot be used on the delegated sign route at all, and that stays true unless the creator asks otherwise. 422s when the environment has no active delegated-access encryption key, rather than creating a wallet the caller cannot delegate against.

            '
        variant:
          $ref: '#/components/schemas/Ed25519Variant'
    OauthInitAuthRequest:
      type: object
      required:
      - state
      properties:
        state:
          $ref: '#/components/schemas/OauthState'
        redirectUrl:
          $ref: '#/components/schemas/OptionalNonEmptyUrlWithLocalhostAndDeepLink'
        ssoProviderId:
          $ref: '#/components/schemas/uuid'
    FlowQuote:
