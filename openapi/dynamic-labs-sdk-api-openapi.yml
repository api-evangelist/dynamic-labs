      pattern: ^(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,59}$
      example: 3FZbgi29cpjq2GjdwV8eyHuJJnkLtktZc5
    Conflict:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: 'Conflict: invalid state transition'
    FlowQuoteRequest:
      description: Request body for fetching a quote on a flow.
      type: object
      properties:
        fromTokenAddress:
          description: Optional token address the source funds will originate from for this quote. When omitted, defaults to the canonical native-token sentinel for the previously-attached fromChainName (e.g. the zero address for EVM, 11111111111111111111111111111111 for Solana, 0x2::sui::SUI for Sui, 'bitcoin' for BTC).
          allOf:
          - $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        fromChainId:
          description: Optional chain identifier the source funds will originate from. When provided, overrides the fromChainId recorded at source time. The chain family (fromChainName) and source address (fromAddress) are locked at source time and cannot be changed here.
          allOf:
          - $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        slippage:
          type: number
          description: Slippage tolerance (e.g. 0.005 for 0.5%)
          minimum: 0
          maximum: 0.1
    StepUpCheckResponse:
      type: object
      required:
      - isRequired
      - credentials
      properties:
        isRequired:
          type: boolean
          description: Whether step-up authentication is required for the given scope
        credentials:
          type: array
          description: The credentials available for step-up authentication. Empty if isRequired is false.
          items:
            $ref: '#/components/schemas/StepUpCredential'
        defaultCredentialId:
          type: string
          format: uuid
          description: The recommended default credential to use for step-up. For reauth this is the sign-in credential; for MFA this is the default or most recently added device.
    ForbiddenWithErrorAndPayload:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorMessageWithCode'
        payload:
          $ref: '#/components/schemas/ForbiddenErrorPayload'
    PasskeyRegistrationCredential:
      type: object
      required:
      - attestationObject
      - clientDataJson
      - credentialId
      - transports
      properties:
        attestationObject:
          $ref: '#/components/schemas/NonEmptyString'
        clientDataJson:
          $ref: '#/components/schemas/NonEmptyString'
        credentialId:
          $ref: '#/components/schemas/NonEmptyString'
        transports:
          description: List of transport methods supported by this registration credential
          type: array
          items:
            $ref: '#/components/schemas/AuthenticatorTransportProtocol'
        publicKey:
          $ref: '#/components/schemas/NonEmptyString'
    NotFound:
      type: object
      required:
      - error
