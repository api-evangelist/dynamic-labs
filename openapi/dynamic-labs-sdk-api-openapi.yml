openapi: 3.2.0
info:
  title: Dashboard SDK API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: SDK
  description: SDK-facing endpoints consumed by embedded Dynamic clients.
paths:
  /environments/{environmentId}/users/{userId}/balances:
    post:
      operationId: getUserAccountBalances
      tags:
      - SDK
      summary: Get account balances for multiple addresses
      description: Returns account balances for the specified user addresses.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/userId'
      requestBody:
        description: Array of account addresses with chains and network IDs
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultichainAccountBalancesRequest'
      responses:
        '200':
          description: Token balances organized by chain and network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultichainAccountBalanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /exchangeRates:
    get:
      operationId: getExchangeRates
      tags:
      - SDK
      summary: Get exchange rates
      description: Exchange rates for the given currency
      responses:
        '200':
          description: Exchange rates response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRatesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/waas/keyShares/backup/token:
    get:
      operationId: getBackupToken
      tags:
      - SDK
      summary: Generate a short-lived JWT token for use with WAAS client backups
      description: This endpoint generates a short-lived JWT token for use with WAAS client backups. The token is valid for 1 minute and can only be used for storing and retrieving client keyshare backups. A Dynamic Auth user must be authenticated and have a Dynamic JWT to use this endpoint.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Successfully generated a short-lived JWT token for use with WAAS client backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/users/check:
    get:
      operationId: getUserFieldsCheck
      tags:
      - SDK
      summary: Check user field uniqueness
      description: Check if the unique field value is already taken. For example, an enabled unique username or unique email. This also works with enabled unique custom fields.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: query
        name: filter
        required: true
        style: form
        schema:
          $ref: '#/components/schemas/UserFieldsCheckParams'
      responses:
        '200':
          description: successful check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFieldsCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
      - bearerAuth: []
  /sdk/{environmentId}/providers/{providerType}/initAuth:
    post:
      operationId: initAuth
      tags:
      - SDK
      summary: Initialize an OAuth authentication sequence
      description: This endpoint initializes a secure oauth authentication sequence by providing the state and current url path to the API.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/providerType'
      requestBody:
        description: OAuth temporary auth code
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OauthInitAuthRequest'
        required: true
      responses:
        '204':
          description: Empty response
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/session:
    get:
      operationId: sessionCheck
      summary: Check session validity
      description: Checks whether the current user session is still valid.
      security:
      - bearerAuth: []
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '204':
          description: Empty response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/scan/websiteUrl:
    post:
      summary: Scan a URL for potential malicious activity
      description: Scans a URL for potential phishing or malicious activity and returns the result.
      operationId: scanUrl
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanWebsiteUrlRequest'
      responses:
        '200':
          description: Successful scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanWebsiteUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/solana/simulateTransaction:
    post:
      operationId: simulateSVMTransaction
      tags:
      - SDK
      summary: Simulate a Solana transaction
      description: Simulates a Solana transaction and returns the expected outcome.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateSVMTransactionRequest'
        required: true
      responses:
        '200':
          description: Simulated transaction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateTransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/solana/sponsorAddress:
    get:
      operationId: getSVMSponsorAddress
      tags:
      - SDK
      summary: Get the Solana gas sponsor address
      description: Returns the public key that signs as fee payer for sponsored Solana transactions.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Sponsor address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSVMSponsorAddressResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/solana/sponsorTransaction:
    post:
      operationId: sponsorSVMTransaction
      tags:
      - SDK
      summary: Sponsor a Solana transaction via Grid API
      description: 'Sponsors a Solana transaction using the Grid API by Squads.

        The Grid API replaces the fee payer with a sponsored account so users don''t need SOL for gas.

        Only available for environments with SVM gas sponsorship enabled.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SponsorSVMTransactionRequest'
        required: true
      responses:
        '200':
          description: Sponsored transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SponsorSVMTransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/evm/sponsorTransaction:
    post:
      operationId: sponsorEVMTransaction
      tags:
      - SDK
      summary: Sponsor an EVM transaction via gasless relay
      description: 'Relays an EVM transaction through a gasless relayer so the user pays no gas.

        Requires EVM gas sponsorship enabled for the environment.

        Returns a request ID for tracking the relay status.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SponsorEVMTransactionRequest'
        required: true
      responses:
        '200':
          description: Relay request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SponsorEVMTransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/evm/availableGaslessRelayer:
    get:
      operationId: getAvailableEVMGaslessRelayer
      tags:
      - SDK
      summary: Get an available EVM gasless relayer address
      description: 'Returns the relayer EOA that should be embedded in the EIP-712 sponsored

        transaction intent for the given chain. The address is owned by the

        project''s relay backend and is the eventual `from` of the on-chain

        broadcast. Today a single relayer is returned; future implementations

        will round-robin across multiple workspace relayers.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/evmChainIdQuery'
      responses:
        '200':
          description: Available relayer address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAvailableEVMGaslessRelayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/evm/sponsorTransaction/{requestId}:
    get:
      operationId: getEVMSponsoredTransactionStatus
      tags:
      - SDK
      summary: Get the status of a sponsored EVM transaction
      description: 'Returns the current status of a previously sponsored EVM transaction from

        the stored record, which is kept in sync with the relay provider.

        Pass `wait` to hold the response open until the transaction resolves.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/sponsoredTransactionWait'
      responses:
        '200':
          description: Relay request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEVMSponsoredTransactionStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/evm/simulateTransaction:
    post:
      operationId: simulateEVMTransaction
      tags:
      - SDK
      summary: Simulate an EVM transaction
      description: Simulates an EVM transaction and returns the expected outcome.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateEVMTransactionRequest'
        required: true
      responses:
        '200':
          description: Simulated transaction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateTransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/evm/simulateUserOp:
    post:
      operationId: simulateUserOp
      tags:
      - SDK
      summary: Simulate an EVM AA UserOp
      description: Simulates an EVM Account Abstraction UserOp and returns the expected outcome.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateUserOpRequest'
        required: true
      responses:
        '200':
          description: Simulated transaction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateTransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/externalAuth/signin:
    post:
      x-requires-device-nonce-signature: true
      operationId: externalAuthSignin
      summary: Sign in with an external auth provider token
      description: Authenticates a user using a token from an external auth provider.
      security:
      - bearerAuth: []
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAuthSigninRequest'
        required: true
      responses:
        '200':
          description: Successful external auth signin response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/solana/optimizeTransaction:
    post:
      summary: Add fees to a Solana transaction
      description: Adds priority fees and compute unit limits to a Solana transaction for optimization.
      operationId: optimizeTransaction
      tags:
      - SDK
      security:
      - BearerAuth: []
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolanaTransactionOptimizationRequest'
      responses:
        '200':
          description: Successfully optimized transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolanaTransactionOptimizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/externalAuth/verify:
    post:
      operationId: externalAuthVerify
      summary: Verify external auth assertion for elevated access token
      description: Accepts a customer-signed assertion JWT and returns an elevated access token for step-up authentication. The assertion JWT must be signed with the same key registered in the environment's external auth JWKS URL.
      security:
      - bearerAuth: []
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAuthSigninRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAuthAssertionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/users/embeddedWallets/authToken:
    get:
      operationId: getAuthToken
      summary: Get an auth token for an embedded wallet type
      description: Returns an auth token for the specified embedded wallet type.
      security:
      - bearerAuth: []
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: query
        name: type
        schema:
          $ref: '#/components/schemas/EmbeddedWalletAuthType'
      responses:
        '200':
          description: embedded wallet auth token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedWalletAuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/users/embeddedWallets/passcode:
    get:
      operationId: getEmbeddedWalletPasscode
      summary: Get the passcode for a pregenerated embedded wallet
      description: Returns the passcode for a pregenerated embedded wallet.
      security:
      - bearerAuth: []
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: embedded wallet passcode response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedWalletSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/users/wallets/selection:
    put:
      operationId: selectUserWallet
      summary: Update primary wallet selection
      description: When a user selects a wallet to be the primary wallet in a multi-wallet enabled environment, this endpoint is called to record this on the backend.
      security:
      - bearerAuth: []
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWalletSelectionRequest'
        required: true
      responses:
        '200':
          description: Updated standard, minified JWT and full user profile object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/users/embeddedWallets/passcode/claim:
    put:
      operationId: claimEmbeddedWallet
      summary: Claim a pregenerated embedded wallet
      description: Claims a pregenerated embedded wallet and associates it with the authenticated user.
      security:
      - bearerAuth: []
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedWalletPasscodeClaimRequest'
        required: true
      responses:
        '200':
          description: Claim embedded wallet response with updated jwt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/users/embeddedWallets/backup:
    get:
      operationId: getEmbeddedWalletBackups
      summary: Get the backup key for an embedded wallet
      description: Returns the backup key for an embedded wallet.
      security:
      - bearerAuth: []
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: embedded wallet passcode response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedWalletSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/users/embeddedWallets/upgradeToV2:
    post:
      operationId: upgradeEmbeddedWalletToV2
      tags:
      - SDK
      summary: Update V1 embedded wallet to V2
      description: Upgrades a V1 embedded wallet to V2 and returns a refreshed JWT.
      requestBody:
        description: Session info required to upgrade embedded wallet to V2
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeEmbeddedWalletToV2Request'
        required: true
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '201':
          description: Successfully migrated to V2 embedded wallet and refreshed jwt token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/healthcheck:
    get:
      operationId: getHealthcheck
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      summary: Check API health
      description: Health check endpoint to check for uptime of API.
      responses:
        '200':
          description: Healthcheck response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/refresh:
    post:
      x-requires-device-nonce-signature: true
      operationId: refreshAuth
      summary: Refresh the JWT auth token
      description: Refreshes the JWT auth token and returns a new token with updated claims.
      security:
      - bearerAuth: []
      tags:
      - SDK
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Successful refreshed jwt token and user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenWithErrorAndPayload'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/emailProvider:
    get:
      operationId: getEmailProvider
      tags:
      - SDK
      summary: Get the sign-in email provider
      description: Return the email provider to be used for signing in with a given email. If an external provider such as magicLink is disabled, this endpoint would return emailOnly. If an external provider such as magicLink is enabled, it will return emailOnly when the email already exists in Dynamic and it is associated with a wallet, otherwise it will return magicLink.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: query
        required: true
        name: email
        allowReserved: true
        schema:
          type: string
          format: email
          maxLength: 255
          pattern: ^[^@]{1,64}@[^@]+$
      responses:
        '200':
          description: Email provider response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailProviderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/providers/{providerType}/loginUrl:
    get:
      operationId: oauthLoginUrl
      tags:
      - SDK
      summary: Get the OAuth provider login URL
      description: Returns the login URL for the specified OAuth provider.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/providerType'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthProviderLoginUrl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
