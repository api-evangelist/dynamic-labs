    get:
      operationId: getWaasSignerSelfPolicyLayer
      security:
      - bearerAuth: []
      tags:
      - SDK
      summary: Get a signer-Layer's Rules
      description: Returns the Composition Layer content for the calling wallet's own active Signer, or (given shareSetId) another share set of the same wallet — e.g. a delegated share set — without mutating it. Only the wallet's own owner may target another share set.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      - name: shareSetId
        in: query
        required: false
        description: 'Targets a share set other than the caller''s own, as returned in the

          wallet''s shareSetId or otherShareSets. Omit to read the caller''s own

          active share set. A share set''s id changes when the wallet''s shares

          are refreshed or reshared; Rules are unaffected by that rotation, so

          re-read the wallet''s share sets to get the current id.

          '
        schema:
          $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: Signer-Layer fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateWaasSignerSelfPolicyLayer
      security:
      - bearerAuth: []
      tags:
      - SDK
      summary: Create, update, or remove a Rule on a signer-Layer
      description: Applies a single per-Rule upsert (create when ruleId is new, update when it already exists) or remove operation — or, with op set to batch, an operations array of 1-100 upsert/remove entries applied atomically in one enclave cycle (all-or-nothing — a rejection applies none of them) — or, with op set to replace, a full rules list that replaces the Layer's Rules (either syntax; an empty list clears it) — to the calling wallet's own signer-Layer, or (given shareSetId in the request body) another share set of the same wallet — e.g. a delegated share set. ruleId may be omitted on an upsert; the enclave then mints one and returns it in the response's layerContent.rules. Only the wallet's own owner may target another share set. Field permissions, grant/authorship, and the remove-vs-marker decision are enforced by wallet-service, not this route.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasSignerPolicyLayerUpdateRequest'
      responses:
        '200':
          description: Signer-Layer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasPolicyLayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
