      type: string
      pattern: ^[0-9a-fA-F]{128}$
      description: 'Hex-encoded ECDSA P-256 signature over the canonicalized payload, produced by the signer''s session key — which never leaves their device, so consent cannot be given on their behalf.

        Exactly 128 hex characters. WebCrypto emits the raw r‖s form with both halves padded to 32 bytes, so unlike DER the length never varies. Constrained here so a malformed value is a 400 at the edge rather than an enclave round trip that returns INTENT_SIGNATURE_INVALID, and so an unbounded string cannot be persisted against a proposal.

