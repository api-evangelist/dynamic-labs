      summary: Fetch an ephemeral X25519 public key for Provable's encrypted proving flow
      description: Server-side proxy to `api.provable.com/prove//pubkey`. Returns the ephemeral X25519 public key + matching key_id used to libsodium-seal a proving request before POSTing to the `/prove/encrypted` endpoint. The iframe runs the encryption locally so the plaintext proving request never leaves the browser.
