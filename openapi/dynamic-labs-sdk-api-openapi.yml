      summary: Attach a source to a flow and mint a session token
      description: Sets the source wallet address and chain on an initiated flow and mints the capability sessionToken used to drive the rest of the lifecycle. No API key or token is required (the browser has neither at this point) — the endpoint is gated by the flow still being initiated and by CORS. At most one live token exists per flow at a time. When re-attaching from the signing state, the existing session token must be supplied to prove the caller is the original signer.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/flowId'
