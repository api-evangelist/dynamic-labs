  /sdk/{environmentId}/waas/{walletId}/transactions/broadcast:
    post:
      operationId: broadcastWaasTransaction
      security:
      - bearerAuth: []
      tags:
      - SDK
      summary: Broadcast a signed transaction from a Dynamic v3 WaaS wallet
      description: Relays an already-signed transaction from a Dynamic v3 WaaS wallet to the network. The server derives chain and wallet address from `walletId`, verifies the signed payload belongs to the wallet, owns provider selection and bounded retry/failover of the identical signed bytes, and replays a stored result when `x-idempotency-key` repeats. Replacement or speed-up transactions use different signed bytes and require a new key; reusing an existing key with different bytes returns 409.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      - $ref: '#/components/parameters/broadcastIdempotencyKey'
      requestBody:
        description: Signed transaction broadcast request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasTransactionBroadcastRequest'
      responses:
        '200':
          description: Transaction submitted or already known to the network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionBroadcastResponse'
        '400':
          description: Malformed payload, signer mismatch, unsupported chain/network, or deterministic rejection (including requires-resign).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionBroadcastError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency key conflict or a broadcast already in progress. An in-progress response has an unknown submission state because another request may have submitted the transaction; retrying with the same key while its claim is live does not submit it again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionBroadcastError'
        '422':
          description: Broadcasting is not available at the moment (code `broadcast_unavailable`). The transaction is not submitted, so the request can be retried later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionBroadcastError'
        '429':
          description: Broadcast rate limit exceeded for this wallet. The Retry-After header indicates how long to wait before retrying.
          headers:
            Retry-After:
              description: Seconds to wait before retrying the broadcast.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionBroadcastError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Provider exhaustion or ambiguous broadcast outcome. The transaction may already be on chain, so check the chain before retrying. A retry with the same key is duplicate-safe while its in-progress claim is live; once the claim's 60-second TTL may have expired, check for the transaction and retry only if it is absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionBroadcastError'
        '503':
          description: Temporary provider or endpoint setup failure before submission. The transaction is not submitted, so the request can be retried safely immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionBroadcastError'
  /sdk/{environmentId}/waas/{walletId}/signAndBroadcast:
    post:
      operationId: signAndBroadcast
      security:
      - bearerAuth: []
      tags:
      - SDK
      summary: Sign a transaction with a WaaS wallet and broadcast it
      description: Opens a signing room and returns the transaction record. Once signing finishes, Dynamic assembles the transaction and broadcasts it; the signed transaction is never returned. Repeating the idempotency key with the same transaction returns the original record.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/walletId'
      - $ref: '#/components/parameters/signAndBroadcastIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaasSignAndBroadcastRequest'
      responses:
        '200':
          description: The transaction record, with the signing room while signing is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaasTransactionBroadcast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The idempotency key was already used for a different transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntity'
        '413':
          description: The request body is over 640kb. A transaction with large calldata can reach that. Send less calldata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/waas/signAndBroadcast:
