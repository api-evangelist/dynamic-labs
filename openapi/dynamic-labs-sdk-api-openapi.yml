        kdaWallet:
          description: Kadena wallet address of the user
          type:
          - string
          - 'null'
        ltcWallet:
          description: Litecoin wallet address of the user
          type:
          - string
          - 'null'
        ckbWallet:
          description: Nervos CKB wallet address of the user
