    InternalServerError:
      type: object
      properties:
        error:
          description: Human-readable error message
          type: string
          example: Internal Server Error
    BusinessAccountMutationIntent:
      type: object
      description: 'The initiator''s proposal, signed with their session key. Built by the API, not the client — sign these exact bytes verbatim, because re-serializing can change them and invalidate the signature.

        `autoExecute` is inside the signed bytes, so an approver consents to it and nothing can flip it afterwards.

        '
      additionalProperties: true
    UnprocessableEntityErrorPayload:
      type: object
      description: Contains information which the integrating client of this API can use to tailor an experience to a customer to fix the underlying issue that triggered this error.
      properties:
        email:
          description: Email address that caused the validation error
          type: string
          format: email
          example: joe@email.com
        loginProvider:
          $ref: '#/components/schemas/ProviderEnum'
        embeddedWalletName:
          description: Embedded wallet name that caused the validation error
          type: string
        embeddedSocialSigninProvider:
          $ref: '#/components/schemas/ProviderEnum'
        mergeConflicts:
          $ref: '#/components/schemas/MergeConflicts'
        intent:
          $ref: '#/components/schemas/BusinessAccountMutationIntent'
        additionalMessages:
          description: List of additional validation error messages
          type: array
          items:
            type: string
    CreateBusinessAccountAdminRequest:
      description: 'Dashboard create body: the SDK create fields plus the `owner` to assign (an SDK caller becomes the owner themselves).'
      allOf:
      - $ref: '#/components/schemas/CreateBusinessAccountSdkRequest'
      - type: object
        required:
        - owner
        properties:
          owner:
            $ref: '#/components/schemas/BusinessAccountMemberSelection'
    BusinessAccountProperties:
      type: object
      description: 'Business-account context attached to a verified credential that belongs to a business account. Present whenever `wallet_properties.shareSetType` is `businessAccountUser`; absent otherwise. Each field is namespaced by its source table so a caller reading the response sees exactly which entity the value came from (no ambiguity between member role and signer type, between business-account name and signer-derived names, etc.).

        '
      required:
      - businessAccountId
      - businessAccountCreatedAt
      - businessAccountSignerId
      - businessAccountSignerType
      - businessAccountMemberRole
      properties:
        businessAccountId:
          $ref: '#/components/schemas/uuid'
        businessAccountName:
          type:
          - string
          - 'null'
          description: Display name; user-supplied at create time. Nullable.
        businessAccountExternalRef:
          type:
          - string
          - 'null'
          description: Developer-supplied stable ID inside the env. Nullable.
        businessAccountCreatedAt:
          type: string
          format: date-time
        businessAccountSignerId:
          $ref: '#/components/schemas/uuid'
        businessAccountSignerType:
          $ref: '#/components/schemas/BusinessAccountSignerType'
        businessAccountMemberRole:
          $ref: '#/components/schemas/HeldBusinessAccountMemberRole'
    BusinessAccountsResponse:
      type: object
      required:
      - businessAccounts
      - count
      properties:
        businessAccounts:
          description: Business accounts in the environment matching the query
          type: array
          items:
            $ref: '#/components/schemas/BusinessAccountSummary'
        count:
          type: integer
          description: Total number of business accounts matching the filter
        limit:
          type: integer
          description: Maximum number of business accounts returned
        offset:
          type: integer
          description: Number of business accounts skipped
    WaasWalletShareSetType:
      type: string
      enum:
      - delegated
      - rootUser
      - server
      - businessAccountUser
      - offlineRecovery
      description: The role this share set plays for the wallet
    WalletAdditionalAddress:
      type: object
      description: An additional address associated with a wallet.
      required:
      - address
      - type
      properties:
        address:
          type: string
          description: An address associated with a wallet.
        publicKey:
          type: string
          description: The public key associated with the address.
        type:
          $ref: '#/components/schemas/WalletAddressType'
        network:
          type: string
          description: Network this address is encoded for (e.g. 'mainnet' | 'testnet' | 'preview'). Present when a wallet exposes an address per network.
    ecdsaValidatorOptions:
      type: string
      enum:
      - zerodev_signer_to_ecdsa
      - zerodev_multi_chain
    BusinessAccountMember:
      type: object
      description: Admin-reach membership in a business account
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        businessAccountId:
          $ref: '#/components/schemas/uuid'
        userId:
          $ref: '#/components/schemas/uuid'
        email:
          description: Member's verified email; null when they have none
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/HeldBusinessAccountMemberRole'
        customRole:
          description: The member's actual customer-defined role, when role names one; null for a built-in role
          type:
          - object
          - 'null'
          properties:
            name:
              $ref: '#/components/schemas/HeldBusinessAccountMemberRole'
            inherits:
              $ref: '#/components/schemas/HeldBusinessAccountMemberRole'
          required:
          - name
          - inherits
        addedByUserId:
          type:
          - string
          - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          description: 'Dashboard-only: this member''s most recent session creation time. Null when they have never completed authentication (e.g. still mid-invite).'
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - businessAccountId
      - userId
      - role
    AssignableBusinessAccountRoleName:
      type: string
      description: 'A role that can be directly assigned to a member: a built-in (`admin`, `viewer`) or a customer-defined role the account has defined. `owner` is excluded — ownership moves only via transferOwnership.

        Not an enum, because the set is per-account: a caller can grant any role from GET /roles. Whether the role exists is the enclave''s to answer, not this schema''s — the pattern only rejects names that could never be one. A role the account has not defined is refused with UNKNOWN_ROLE.

        A customer-defined role grants exactly what it inherits, so `cfo inherits admin` is an admin with a distinguishable name.

        Case-insensitive on input — `CFO` and `cfo` name the same role. The server normalizes to lowercase before comparing or storing, so the pattern accepts both cases here even though a held/stored role name (HeldBusinessAccountMemberRole) is always lowercase.

        '
      pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9_-]{0,30}[a-zA-Z0-9])?$
      example: cfo
    BusinessAccountMemberPreview:
      type: object
      description: Minimal member identity for the list page's member-count hover preview — not the full BusinessAccountMember shape (no role, no addedByUserId).
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        email:
          type:
          - string
          - 'null'
          description: The member's oldest verified email. Null if they have none.
    BusinessAccountAdminDetail:
      type: object
      description: Business account with its members, signers, and wallets for the dashboard detail view
      allOf:
      - $ref: '#/components/schemas/BusinessAccountSummary'
      - type: object
        required:
        - members
        - signers
        - wallets
        properties:
          members:
            type: array
            items:
              $ref: '#/components/schemas/BusinessAccountMember'
          signers:
            type: array
            items:
              $ref: '#/components/schemas/BusinessAccountSigner'
          wallets:
            type: array
            items:
              $ref: '#/components/schemas/BusinessAccountWallet'
    BusinessAccountRolesResponse:
