openapi: 3.2.0
info:
  title: Dashboard Business Accounts API
  description: Dashboard API documentation
  version: 1.0.0
servers:
- url: https://app.dynamicauth.com/api/v0
- url: https://app.dynamic.xyz/api/v0
- url: http://localhost:3333/api/v0
tags:
- name: BusinessAccounts
  description: Administer the business accounts (multi-operator wallet containers) that end users create in an environment.
paths:
  /environments/{environmentId}/businessAccounts:
    post:
      operationId: createBusinessAccountAdmin
      tags:
      - BusinessAccounts
      summary: Create a business account with a named owner
      description: 'Platform-credential counterpart of the SDK create: the caller names the owner instead of becoming it. No `TokenScopes.BusinessAccountsWrite` scope yet — access is gated by the caller''s role.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessAccountAdminRequest'
      responses:
        '201':
          description: Business account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    get:
      operationId: getBusinessAccounts
      tags:
      - BusinessAccounts
      summary: List business accounts in an environment
      description: Retrieve the business accounts of an environment with active member, signer, and wallet counts.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Maximum number of business accounts to return
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Number of business accounts to skip
      - in: query
        name: search
        required: false
        schema:
          type: string
          maxLength: 255
        description: Case-insensitive match on name or external reference
      - in: query
        name: sortBy
        required: false
        schema:
          type: string
          enum:
          - name
          - memberCount
          - walletCount
          - signerCount
          - updatedAt
          - createdAt
          default: createdAt
        description: Column to sort by. memberCount/walletCount/signerCount sort by the relation's raw row count, not the active-only count shown in the response (see BusinessAccountSummary) — an account with soft-deleted rows may sort slightly differently than its displayed count. For signerCount specifically, the raw row count also counts a user once per wallet they sign, while the displayed count deduplicates by user — the two can disagree even with no soft-deleted rows.
      - in: query
        name: sortDirection
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Successful response with business accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}/businessAccounts/{businessAccountId}:
    get:
      operationId: getBusinessAccount
      tags:
      - BusinessAccounts
      summary: Get a business account
      description: Retrieve a business account with its members, signers, and wallets.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      responses:
        '200':
          description: Successful response with the business account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountAdminDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}/businessAccounts/{businessAccountId}/activity:
    get:
      operationId: getBusinessAccountActivity
      tags:
      - BusinessAccounts
      summary: List business account activity
      description: Retrieve the audit trail of a business account, newest first.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Maximum number of activity entries to return
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          format: uuid
        description: Identifier of the last entry from the previous page
      responses:
        '200':
          description: Successful response with activity entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountActivityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}/businessAccounts/{businessAccountId}/members:
    post:
      operationId: addBusinessAccountMemberAdmin
      tags:
      - BusinessAccounts
      summary: Add a member to a business account
      description: 'Platform-credential counterpart of the SDK addMember: the caller names the member. Governance is bypassed — the member is always added directly, never proposed. No `TokenScopes.BusinessAccountsWrite` scope yet — access is gated by the caller''s role.'
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBusinessAccountMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}/businessAccounts/{businessAccountId}/members/{userId}:
    delete:
      operationId: removeBusinessAccountMemberAdmin
      tags:
      - BusinessAccounts
      summary: Remove a member from a business account
      description: Platform-credential counterpart of the SDK removeMember. Governance is bypassed — the member is always removed directly, never proposed. Also soft-deletes the user's signers and share sets across the account's wallets, in the same transaction. No `TokenScopes.BusinessAccountsWrite` scope yet — access is gated by the caller's role.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
    patch:
      operationId: updateBusinessAccountMemberRoleAdmin
      tags:
      - BusinessAccounts
      summary: Change a member's role on a business account
      description: Platform-credential counterpart of the SDK updateMemberRole. Governance is bypassed — the role change is always applied directly, never proposed. Cannot assign `owner`; ownership moves only via transferOwnership. No `TokenScopes.BusinessAccountsWrite` scope yet — access is gated by the caller's role.
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessAccountMemberRoleRequest'
      responses:
        '200':
          description: Member role changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
  /environments/{environmentId}/businessAccounts/{businessAccountId}/roles:
    get:
      operationId: getBusinessAccountRolesAdmin
      tags:
      - BusinessAccounts
      summary: List the roles assignable on a business account
      description: The customer-defined roles (`roles`, as in the SDK) and the built-in roles every account has (`builtInRoles`).
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/businessAccountId'
      responses:
        '200':
          description: The assignable roles on this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccountRolesAdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
components:
  schemas:
    NameServiceData:
      type: object
      properties:
        avatar:
          description: URL of the avatar associated with the name service record
          type: string
        name:
          description: Resolved name from the name service (e.g. ENS name)
          type: string
    VerifiedCredentialId:
      description: UUID v4 with an optional -zerodev suffix for ZeroDev EIP-7702 smart-wallet credentials
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(-zerodev)?$
      minLength: 36
      maxLength: 45
      example: 95b11417-f18f-457f-8804-68e361f9164f-zerodev
    BusinessAccount:
      type: object
      description: A multi-operator wallet container (product name "Business Accounts")
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        projectEnvironmentId:
          $ref: '#/components/schemas/uuid'
        name:
          type:
          - string
          - 'null'
          maxLength: 255
        externalRef:
          description: Developer-supplied stable ID inside the env
          type:
          - string
          - 'null'
          maxLength: 255
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - projectEnvironmentId
    SdkUser:
      allOf:
      - $ref: '#/components/schemas/BaseUser'
      - type: object
        required:
        - verifiedCredentials
    NonEmptyStringWith255MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      maxLength: 255
      example: An example name
    BusinessAccountMemberSelection:
      type: object
      description: 'Names a user. Pass `userId` directly OR `identifier + type` (any UserIdentifierTypeEnum value), mirroring the pregen flow. `smsCountryCode` is required when `type` is `phoneNumber`; `socialProvider` is required when `type` is `socialUsername` or `socialAccountId`.

        '
      properties:
        userId:
          type:
          - string
          - 'null'
          format: uuid
        identifier:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/UserIdentifierTypeEnum'
        smsCountryCode:
          $ref: '#/components/schemas/SmsCountryCode'
        socialProvider:
          $ref: '#/components/schemas/ProviderEnum'
    BusinessAccountWallet:
      type: object
      description: Minimal business-account-wallet projection used by `BusinessAccountDetail`.
      required:
      - id
      - publicKey
      - chain
      - createdAt
      properties:
        id:
          description: Wallet ID (matches `signers[].walletId` for wallets that already have a signer).
          type: string
          format: uuid
        publicKey:
          description: Wallet address (already-formatted public address, not raw key material).
          type: string
        chain:
          $ref: '#/components/schemas/ChainEnum'
        createdAt:
          type: string
          format: date-time
    UnprocessableEntity:
      type: object
      properties:
        error:
          description: Human-readable error message describing the validation failure
          type: string
          example: Resources already exists for this Object
        code:
          $ref: '#/components/schemas/UnprocessableEntityErrorCode'
        payload:
          $ref: '#/components/schemas/UnprocessableEntityErrorPayload'
        retryAfterSeconds:
          description: Seconds the client should wait before retrying, present on rate-limit errors
          type: integer
          example: 600
      required:
      - error
    CreateBusinessAccountSdkRequest:
      type: object
      description: SDK-side create-business-account request. Caller becomes the first owner.
      properties:
        name:
          type:
          - string
          - 'null'
          maxLength: 255
        externalRef:
          description: Developer-supplied stable ID inside the env
          type:
          - string
          - 'null'
          maxLength: 255
        metadata:
          type: object
    UpdateBusinessAccountMemberRoleRequest:
      type: object
      description: 'Changes a member''s role to any role the account defines — a built-in (`admin`, `viewer`) or a customer-defined one, and between two customer-defined ones. Owner is never a target — ownership moves via transferOwnership.

        '
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/AssignableBusinessAccountRoleName'
    HeldBusinessAccountMemberRole:
      type: string
      description: 'The role a member actually holds: a built-in (`owner`, `admin`, `viewer`) or a customer-defined role the account has defined. Wider than AssignableBusinessAccountRoleName because a held role can be `owner`, which cannot be assigned directly.

        '
      pattern: ^[a-z0-9](?:[a-z0-9_-]{0,30}[a-z0-9])?$
      example: cfo
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    BusinessAccountSigner:
      type: object
      description: Signing-reach assignment (per signer-wallet pair)
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        businessAccountId:
          $ref: '#/components/schemas/uuid'
        userId:
          type:
          - string
          - 'null'
          format: uuid
          description: Required when type=endUser; null for type=server
        walletId:
          $ref: '#/components/schemas/uuid'
        shareSetId:
          type:
          - string
          - 'null'
          format: uuid
          description: Set after reshare ceremony completes
        derivedFromUserId:
          type:
          - string
          - 'null'
          format: uuid
        type:
          $ref: '#/components/schemas/BusinessAccountSignerType'
        apiKeyIdentityRef:
          type:
          - string
          - 'null'
          description: Required when type=server
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - businessAccountId
      - walletId
      - type
    TurnkeyWalletProperties:
      deprecated: true
      type: object
      properties:
        turnkeySubOrganizationId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          deprecated: true
        turnkeyPrivateKeyId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          deprecated: true
        turnkeyHDWalletId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          deprecated: true
        isAuthenticatorAttached:
          type: boolean
          description: Whether or not the wallet has an authenticator (passkey, api key, etc) attached to it.
        turnkeyUserId:
          allOf:
          - $ref: '#/components/schemas/uuid'
          deprecated: true
        isSessionKeyCompatible:
          description: Whether this wallet supports session key operations
          type: boolean
        version:
          $ref: '#/components/schemas/EmbeddedWalletVersionEnum'
        ecdsaProviderType:
          $ref: '#/components/schemas/ecdsaValidatorOptions'
        entryPointVersion:
          $ref: '#/components/schemas/ProviderEntryPointVersionEnum'
        kernelVersion:
          $ref: '#/components/schemas/ProviderKernelVersionEnum'
    WalletPublicKey:
      type: string
      pattern: ^[A-Za-z0-9_-]{18,100}$
      description: Valid blockchain wallet address, must be an alphanumeric string (underscores allowed for chains like Midnight, hyphens allowed for chains using base64url-encoded addresses like TON)
      example: '0xbF394748301603f18d953C90F0b087CBEC0E1834'
      maxLength: 255
    MergeConflicts:
      type: object
      description: Contains information needed for the SDK to surface merge conflicts when attempting to merge information from one user to another
      required:
      - fromUser
      - conflicts
      properties:
        fromUser:
          $ref: '#/components/schemas/SdkUser'
        conflicts:
          description: List of field-level merge conflicts between users
          type: array
          items:
            $ref: '#/components/schemas/MergeUserConflict'
    ThresholdSignatureScheme:
      type: string
      enum:
      - TWO_OF_TWO
      - TWO_OF_THREE
      - THREE_OF_FIVE
    BusinessAccountActivityEntry:
      type: object
      required:
      - id
      - businessAccountId
      - action
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        businessAccountId:
          $ref: '#/components/schemas/uuid'
        action:
          $ref: '#/components/schemas/BusinessAccountActionEnum'
        takenByUserId:
          type:
          - string
          - 'null'
          format: uuid
          description: Null when the action was system-triggered
        takenByEmail:
          type:
          - string
          - 'null'
          description: Verified email of the actor, when they have one
        metadata:
          type: object
          description: Per-action context, such as target identifiers and changed values
        createdAt:
          type: string
          format: date-time
    BusinessAccountRoles:
      type: object
      description: Customer-defined roles keyed by role name.
      additionalProperties:
        $ref: '#/components/schemas/BusinessAccountRoleDefinition'
    HardwareWalletProperties:
      type: object
      properties:
        hardwareWallet:
          $ref: '#/components/schemas/HardwareWalletEnum'
    Unauthorized:
      type: object
      properties:
        error:
          description: Human-readable error message describing the authentication failure
          type: string
          example: No jwt provided!
    UserIdentifierTypeEnum:
      type: string
      enum:
      - email
      - id
      - externalUserId
      - phoneNumber
      - socialUsername
      - socialAccountId
    WalletAddressType:
      type: string
      enum:
      - ordinals
      - payment
      - cosmos
      - evm
      - stellar
      - ton
      - midnight_unshielded
      - midnight_dust
      - midnight_shielded
    ProviderKernelVersionEnum:
      type: string
      enum:
      - v2_4
      - v3_0
      - v3_1
      - v3_2
      - v3_3
    BusinessAccountActivityResponse:
      type: object
      required:
      - entries
      - nextCursor
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/BusinessAccountActivityEntry'
        nextCursor:
          type:
          - string
          - 'null'
          description: Cursor for fetching the next page, null if no more pages
    SmartWalletProperties:
      type: object
      properties:
        entryPointVersion:
          $ref: '#/components/schemas/ProviderEntryPointVersionEnum'
        kernelVersion:
          $ref: '#/components/schemas/ProviderKernelVersionEnum'
        ecdsaProviderType:
          $ref: '#/components/schemas/ecdsaValidatorOptions'
    JwtVerifiedCredential:
      type: object
      required:
      - id
      - format
      - signInEnabled
      properties:
        address:
          $ref: '#/components/schemas/WalletPublicKey'
        chain:
          description: Blockchain network for this credential
          type: string
        refId:
          $ref: '#/components/schemas/uuid'
        signerRefId:
          $ref: '#/components/schemas/uuid'
        email:
          description: Email address for email-based credentials
          type: string
          format: email
        id:
          $ref: '#/components/schemas/VerifiedCredentialId'
        name_service:
          $ref: '#/components/schemas/NameServiceData'
        public_identifier:
          description: This is used to publicly identify a verified credential in a human-friendly way. For example, this will be the email address if credential format=email.
          type: string
        wallet_name:
          description: Name of the wallet provider
          type: string
        wallet_provider:
          $ref: '#/components/schemas/WalletProviderEnum'
        wallet_properties:
          $ref: '#/components/schemas/WalletProperties'
        business_account_properties:
          $ref: '#/components/schemas/BusinessAccountProperties'
        format:
          $ref: '#/components/schemas/JwtVerifiedCredentialFormatEnum'
        oauth_provider:
          $ref: '#/components/schemas/ProviderEnum'
        oauth_username:
          description: Username from the OAuth provider
          type: string
        oauth_display_name:
          description: Display name from the OAuth provider
          type:
          - string
          - 'null'
        oauth_account_id:
          description: Unique account identifier from the OAuth provider
          type:
          - string
          - 'null'
        phoneNumber:
          description: This field contains the phone number in the country. This could also contain the area code within a country.
          example: '9171113333'
          type: string
        phoneCountryCode:
          description: This field contains the phone international country code. See https://countrycode.org/
          example: '1'
          type: string
        isoCountryCode:
          description: ISO-3166 two-character country code. See https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes
          example: US
          type: string
        oauth_account_photos:
          description: List of profile photo URLs from the OAuth provider
          type: array
          items:
            type: string
        oauth_emails:
          description: List of email addresses from the OAuth provider
          type: array
          items:
            type: string
        oauth_metadata:
          type: object
          description: This object contains JSON metadata for a social-based verified credential. It may contain data about the user that does not fit into the other structured fields, and could include arbitrary fields about the user from the oauth provider's API.
        previous_users:
          description: This will only be provided in the responses for GET /users/{userId}.Previous user IDs that owned this verified credential and was tranfered to the current user ID.
          type: array
          items:
            $ref: '#/components/schemas/uuid'
        embedded_wallet_id:
          description: Identifier of the linked embedded wallet
          type:
          - string
          - 'null'
        wallet_additional_addresses:
          description: List of additional addresses derived from this wallet
          type: array
          items:
            $ref: '#/components/schemas/WalletAdditionalAddress'
        lastSelectedAt:
          description: This timestamp indicates the last time this verified wallet was either connected to the user account or selected to become the primary wallet on the account.
          type: string
          format: date-time
        signInEnabled:
          type: boolean
          description: This indicates if the user can sign in with this credential
        verifiedAt:
          type: string
          format: date-time
          description: This timestamp indicates the last time this verified credential was verified.
    CoinbaseMpcWalletProperties:
      deprecated: true
      type: object
      properties:
        claimed:
          type: boolean
          description: Dynamic pregenerated this wallet and stored the passcode
        source:
          $ref: '#/components/schemas/PasswordSourceTypeEnum'
    UnprocessableEntityErrorCode:
      type: string
      enum:
      - email_cannot_be_null
      - exchange_cannot_be_enabled
      - transfer_amount_too_small
      - transfer_address_not_whitelisted
      - invalid_scopes
      - unknown_transfer_error
      - transfer_mfa_required
      - transfer_mfa_failed
      - intent_required
      - invalid_transfer_funds
      - invalid_transfer_currency
      - invalid_exchange_provider
      - invalid_transfer_network
      - invalid_email
      - email_already_exists
      - allowlist_already_exists
      - allowlist_entry_already_exists
      - reassign_wallet_error
